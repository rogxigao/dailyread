    {t:'exs', id:'4.2', items:[
      {q:'解 <m>a<sub>n</sub> = 5a<sub>n−1</sub> − 6a<sub>n−2</sub></m>，<m>a<sub>0</sub>=1, a<sub>1</sub>=4</m>。',
       hint:'特征方程 <m>r<sup>2</sup>−5r+6=0</m>。',
       steps:['<m>r<sup>2</sup>−5r+6 = (r−2)(r−3) = 0</m>，根为 2 和 3。','通解 <m>a<sub>n</sub> = α·2<sup>n</sup> + β·3<sup>n</sup></m>。','<m>n=0</m>：<m>α+β=1</m>；<m>n=1</m>：<m>2α+3β=4</m>。','解得 <m>β=2, α=−1</m>。'],
       ans:'<m>a<sub>n</sub> = 3<sup>n+1</sup> − 2<sup>n</sup></m>'},
      {q:'解 <m>a<sub>n</sub> = 4a<sub>n−1</sub> − 4a<sub>n−2</sub></m>，<m>a<sub>0</sub>=1, a<sub>1</sub>=6</m>。',
       hint:'判别式为 0，是重根。',
       steps:['<m>r<sup>2</sup>−4r+4 = (r−2)<sup>2</sup></m>，重根 <m>r=2</m>。','通解 <m>a<sub>n</sub> = (α+βn)·2<sup>n</sup></m>。','<m>n=0</m>：<m>α=1</m>；<m>n=1</m>：<m>(1+β)·2=6</m>，得 <m>β=2</m>。'],
       ans:'<m>a<sub>n</sub> = (1+2n)·2<sup>n</sup></m>'},
      {q:'求 <m>a<sub>n</sub> = 2a<sub>n−1</sub> + 1</m>，<m>a<sub>1</sub>=1</m> 的解。',
       hint:'特解猜常数。',
       steps:['齐次部分 <m>a<sub>n</sub> = 2a<sub>n−1</sub></m> 通解 <m>α·2<sup>n</sup></m>。','猜特解 <m>c</m>：<m>c = 2c+1</m>，得 <m>c=−1</m>。','通解 <m>a<sub>n</sub> = α·2<sup>n</sup> − 1</m>。','<m>a<sub>1</sub>=1</m> 代入：<m>2α−1=1</m>，<m>α=1</m>。'],
       ans:'<m>a<sub>n</sub> = 2<sup>n</sup> − 1</m>'}
    ]}
  ]
},

{
  id:'4.3', title:'分治算法与递推关系',
  blocks:[
    {t:'lead', h:'分治算法天然产生递推：把一个规模 <m>n</m> 的问题拆成 <m>a</m> 个规模 <m>n/b</m> 的子问题，再把结果合并。'},
    {t:'def', lb:'分治递推', h:'<p>形如</p><div class="f" style="margin:8px 0">f(n) = a·f(n/b) + g(n)</div><p>其中 <m>a</m> 是子问题个数，<m>n/b</m> 是子问题规模，<m>g(n)</m> 是拆分与合并的代价。</p>'},
    {t:'table', head:['算法','递推','复杂度'],
      rows:[
        ['二分查找','<m>f(n) = f(n/2) + 1</m>','<m>O(log n)</m>'],
        ['归并排序','<m>f(n) = 2f(n/2) + n</m>','<m>O(n log n)</m>'],
        ['二分幂','<m>f(n) = f(n/2) + 1</m>','<m>O(log n)</m>'],
        ['朴素矩阵乘','<m>f(n) = 8f(n/2) + n<sup>2</sup></m>','<m>O(n<sup>3</sup>)</m>']
      ]},
    {t:'tip', h:'<p>主定理（Master Theorem）给了一个速判法：比较 <m>a</m> 与 <m>b<sup>d</sup></m>（其中 <m>g(n) = O(n<sup>d</sup>)</m>）。</p><ul><li><m>a &lt; b<sup>d</sup></m>：结果由 <m>g(n)</m> 主导，<m>O(n<sup>d</sup>)</m>。</li><li><m>a = b<sup>d</sup></m>：多一个对数因子，<m>O(n<sup>d</sup> log n)</m>。</li><li><m>a &gt; b<sup>d</sup></m>：结果由递归主导，<m>O(n<sup>log<sub>b</sub>a</sup>)</m>。</li></ul><p>归并排序里 <m>a=2, b=2, d=1</m>，<m>a = b<sup>d</sup></m>，所以是 <m>O(n log n)</m>。</p>'},

    {t:'ex', title:'例 1　归并排序的递推', q:'归并排序把 n 个数分成两半各自排序，再线性时间合并。写出递推并求解。',
      steps:['两个规模 <m>n/2</m> 的子问题，合并代价 <m>O(n)</m>：<m>f(n) = 2f(n/2) + n</m>。','展开一层：<m>f(n) = 4f(n/4) + 2n</m>。','再展开：<m>= 8f(n/8) + 3n</m>，规律是 <m>2<sup>k</sup>f(n/2<sup>k</sup>) + kn</m>。','当 <m>n/2<sup>k</sup> = 1</m> 即 <m>k = log<sub>2</sub>n</m> 时到底，得 <m>n·f(1) + n log n = O(n log n)</m>。'],
      ans:'<m>O(n log n)</m>'},

    {t:'exs', id:'4.3', items:[
      {q:'二分查找的递推是 <m>f(n) = f(n/2) + 1</m>，求复杂度。',
       hint:'展开到 <m>n/2<sup>k</sup>=1</m>。',
       steps:['展开 <m>k</m> 次得 <m>f(n) = f(n/2<sup>k</sup>) + k</m>。','<m>k = log<sub>2</sub>n</m> 时到底。','<m>f(n) = f(1) + log<sub>2</sub>n</m>。'],
       ans:'<m>O(log n)</m>'},
      {q:'若 <m>f(n) = 4f(n/2) + n</m>，求复杂度。',
       hint:'比较 <m>a=4</m> 与 <m>b<sup>d</sup>=2<sup>1</sup>=2</m>。',
       steps:['<m>a = 4 > b<sup>d</sup> = 2</m>，递归主导。','复杂度为 <m>O(n<sup>log<sub>2</sub>4</sup>) = O(n<sup>2</sup>)</m>。'],
       ans:'<m>O(n<sup>2</sup>)</m>'}
    ]}
  ]
},

{
  id:'4.4', title:'生成函数',
  blocks:[
    {t:'lead', h:'生成函数是计数里最像「魔法」的工具：<b>把一个数列编码成一个多项式的系数</b>，于是「数方案」变成了「算多项式乘法」。'},
    {t:'def', lb:'生成函数', h:'<p>序列 <m>a<sub>0</sub>, a<sub>1</sub>, a<sub>2</sub>, …</m> 的<b>生成函数</b>是</p><div class="f" style="margin:8px 0">G(x) = a<sub>0</sub> + a<sub>1</sub>x + a<sub>2</sub>x<sup>2</sup> + ⋯</div>'},
    {t:'p', h:'关键直觉：<b>多项式相乘时，指数相加、系数相乘</b>。而「取两个物品」的方案数恰好也是「两个选择的组合」——所以系数自动完成了计数。'},
    {t:'table', head:['生成函数','对应的序列'],
      rows:[
        ['<m>1/(1−x)</m>','<m>1,1,1,1,…</m>'],
        ['<m>1/(1−ax)</m>','<m>1,a,a<sup>2</sup>,a<sup>3</sup>,…</m>'],
        ['<m>1/(1−x)<sup>2</sup></m>','<m>1,2,3,4,…</m>'],
        ['<m>(1+x)<sup>n</sup></m>','<m>C(n,0), C(n,1), …, C(n,n)</m>']
      ]},
    {t:'p', h:'<b>怎么用它解计数题？</b>把「每类物品取几个」写成 <m>(1 + x + x<sup>2</sup> + ⋯)</m> 这样的因子，多个因子相乘，展开后 <m>x<sup>k</sup></m> 的系数就是「总共取 k 个」的方案数。'},
    {t:'warn', h:'<p>如果某类物品最多取 3 个，因子就写 <m>(1+x+x<sup>2</sup>+x<sup>3</sup>)</m> 而不是无穷级数。<b>限制条件直接体现在因子的截断上</b>——这是生成函数最好用的地方。</p>'},

    {t:'ex', title:'例 1　用生成函数数分法', q:'把 10 分成若干个 1、2、3 之和（顺序不计），有多少种？',
      steps:[
        '对应生成函数 <m>1/((1−x)(1−x<sup>2</sup>)(1−x<sup>3</sup>))</m>。',
        '展开后 <m>x<sup>10</sup></m> 的系数即为答案。',
        '手工枚举：设用 <m>a</m> 个 3、<m>b</m> 个 2、<m>c</m> 个 1，<m>3a+2b+c=10</m>。',
        '枚举 <m>a=0..3</m>：<m>a=0</m> 有 6 种（b=0..5），<m>a=1</m> 有 4 种，<m>a=2</m> 有 2 种，<m>a=3</m> 有 1 种。合计 13。'
      ], ans:'13 种'},

    {t:'exs', id:'4.4', items:[
      {q:'写出「从 3 种水果中取 n 个，每种至少取 1 个」的生成函数。',
       hint:'每种至少 1 个，因子从 <m>x</m> 开始。',
       steps:['单种的因子：<m>x + x<sup>2</sup> + x<sup>3</sup> + ⋯ = x/(1−x)</m>。','三种独立，相乘。'],
       ans:'<m>(x/(1−x))<sup>3</sup> = x<sup>3</sup>/(1−x)<sup>3</sup></m>'},
      {q:'<m>1/(1−x)<sup>2</sup></m> 展开后 <m>x<sup>n</sup></m> 的系数是多少？',
       hint:'查表或记 <m>1/(1−x)<sup>2</sup> = Σ(n+1)x<sup>n</sup></m>。',
       steps:['<m>1/(1−x)<sup>2</sup> = 1 + 2x + 3x<sup>2</sup> + 4x<sup>3</sup> + ⋯</m>。','系数依次为 1,2,3,…，所以第 n 项系数是 <m>n+1</m>。'],
       ans:'<m>n+1</m>'}
    ]}
  ]
},

{
  id:'4.5', title:'容斥原理',
  blocks:[
    {t:'lead', h:'「至少满足一个条件」的计数，直接加会重复。容斥就是<b>一加一减地修正误差</b>——加多了减，减多了加。'},
    {t:'thm', lb:'两个集合', h:'<div class="f" style="margin:4px 0">|A ∪ B| = |A| + |B| − |A ∩ B|</div>'},
    {t:'thm', lb:'三个集合', h:'<div class="f" style="margin:4px 0">|A∪B∪C| = |A|+|B|+|C| − |A∩B|−|A∩C|−|B∩C| + |A∩B∩C|</div>'},
    {t:'thm', lb:'一般形式', h:'<div class="f" style="margin:4px 0;font-size:16px">|A<sub>1</sub>∪⋯∪A<sub>n</sub>| = Σ|A<sub>i</sub>| − Σ|A<sub>i</sub>∩A<sub>j</sub>| + Σ|A<sub>i</sub>∩A<sub>j</sub>∩A<sub>k</sub>| − ⋯ + (−1)<sup>n+1</sup>|A<sub>1</sub>∩⋯∩A<sub>n</sub>|</div>'},
    {t:'w', id:'incl'},
    {t:'tip', h:'<p>符号规律很好记：<b>奇数个集合的交取正，偶数个取负</b>。</p><p>直觉上，一个元素如果属于 <m>k</m> 个集合，它被计算的次数是 <m>C(k,1)−C(k,2)+C(k,3)−⋯ = 1</m>——正好算一次。</p>'},

    {t:'ex', title:'例 1　1 到 100 中与 30 互素的数', q:'1 到 100 中有多少个数与 30 互素？',
      steps:[
        '<m>30 = 2 × 3 × 5</m>，与 30 不互素就是能被 2、3、5 之一整除。',
        '设 <m>A, B, C</m> 分别为被 2、3、5 整除的数集。<m>|A|=50, |B|=33, |C|=20</m>。',
        '两两交集：<m>|A∩B|=⌊100/6⌋=16</m>，<m>|A∩C|=⌊100/10⌋=10</m>，<m>|B∩C|=⌊100/15⌋=6</m>。',
        '三重交集：<m>|A∩B∩C|=⌊100/30⌋=3</m>。',
        '<m>|A∪B∪C| = 50+33+20−16−10−6+3 = 74</m>，所以互素的有 <m>100−74 = 26</m> 个。'
      ], ans:'26 个'},

    {t:'exs', id:'4.5', items:[
      {q:'一个班 50 人，30 人学英语，25 人学日语，10 人两样都学。有多少人两样都不学？',
       hint:'先算至少学一样的。',
       steps:['<m>|E∪J| = 30+25−10 = 45</m>。','两样都不学：<m>50 − 45 = 5</m>。'],
       ans:'5 人'},
      {q:'1 到 1000 中有多少个不能被 2、3、5 中任何一个整除？',
       hint:'套三集合容斥。',
       steps:['<m>|A|=500, |B|=333, |C|=200</m>。','两两：<m>|A∩B|=166, |A∩C|=100, |B∩C|=66</m>。','三重：<m>|A∩B∩C|=33</m>。','并集 <m>= 500+333+200−166−100−66+33 = 734</m>。','补集 <m>= 1000 − 734 = 266</m>。'],
       ans:'266 个'}
    ]}
  ]
},

{
  id:'4.6', title:'容斥原理的应用',
  blocks:[
    {t:'lead', h:'容斥不只能数集合，还能数<b>函数</b>和<b>排列</b>。这一节看两个经典应用：满射个数和错排。'},
    {t:'h3', h:'满射函数的个数'},
    {t:'p', h:'从 <m>m</m> 元集到 <m>n</m> 元集的<b>满射</b>有多少个？设 <m>A<sub>i</sub></m> 为「第 <m>i</m> 个目标元素没被指到」的函数集合，则'},
    {t:'f', h:'Σ<sub>k=0</sub><sup>n</sup> (−1)<sup>k</sup> C(n,k)(n−k)<sup>m</sup>', note:'这也正是 3.5.5 里「物体可区分、盒子可区分、不许空」的答案'},
    {t:'h3', h:'错排问题'},
    {t:'def', lb:'错排', h:'<p><b>错排</b> <m>D<sub>n</sub></m> 是 <m>{1,…,n}</m> 的排列中，满足「每个元素都不在自己原位」的排列数。</p>'},
    {t:'p', h:'用容斥：设 <m>A<sub>i</sub></m> 为「第 <m>i</m> 个元素恰好在原位」的排列集合，则'},
    {t:'f', h:'D<sub>n</sub> = n! (1 − 1/1! + 1/2! − 1/3! + ⋯ + (−1)<sup>n</sup>/n!)', note:'这个值约等于 n!/e，所以错排概率趋近于 1/e ≈ 0.368'},
    {t:'table', head:['n','1','2','3','4','5','6'],
      rows:[['<m>D<sub>n</sub></m>','0','1','2','9','44','265']]},

    {t:'ex', title:'例 1　信件装错', q:'4 封信随机装入 4 个写好地址的信封，全部装错的概率是多少？',
      steps:[
        '总装法：<m>4! = 24</m>。',
        '全部装错即错排：<m>D<sub>4</sub> = 4!(1 − 1 + 1/2 − 1/6 + 1/24) = 24(9/24) = 9</m>。',
        '概率 <m>9/24 = 3/8</m>。'
      ], ans:'<m>3/8</m>'},

    {t:'exs', id:'4.6', items:[
      {q:'计算 <m>D<sub>5</sub></m>。',
       hint:'用公式或递推 <m>D<sub>n</sub> = (n−1)(D<sub>n−1</sub>+D<sub>n−2</sub>)</m>。',
       steps:['<m>D<sub>3</sub>=2</m>，<m>D<sub>4</sub>=9</m>。','<m>D<sub>5</sub> = 4(9+2) = 44</m>。'],
       ans:'44'},
      {q:'从 5 元集到 3 元集的满射有多少个？',
       hint:'套容斥公式。',
       steps:['<m>3<sup>5</sup> − C(3,1)2<sup>5</sup> + C(3,2)1<sup>5</sup></m>。','<m>= 243 − 96 + 3 = 150</m>。'],
       ans:'150 个'}
    ]}
  ]
}

]};

CH[5] = {
  title: '关系',
  en: 'Relations',
  intro: '关系是把集合里的元素<b>两两连起来</b>。听起来简单，但它是整本书里结构最丰富的一章：等价关系把集合切成块，偏序把它排成层，传递闭包算出谁能到达谁。掌握这一章的关键是<b>会用三种语言描述同一个关系</b>——集合、矩阵、图。',
  sections: [

{
  id:'5.1', title:'关系及其性质',
  blocks:[
    {t:'lead', h:'「<m>a</m> 小于 <m>b</m>」「<m>a</m> 是 <m>b</m> 的父亲」「<m>a</m> 和 <m>b</m> 同余」——这些都是关系。它们的共同点是：<b>描述两个对象之间有没有某种联系</b>。'},
    {t:'def', lb:'二元关系', h:'<p>从集合 <m>A</m> 到 <m>B</m> 的<b>二元关系</b>是 <m>A × B</m> 的一个子集。若 <m>(a,b) ∈ R</m>，记作 <m>a R b</m>。</p><p><m>A</m> 上的关系就是 <m>A × A</m> 的子集，共 <m>2<sup>|A|<sup>2</sup></sup></m> 个不同的关系。</p>'},
    {t:'table', head:['性质','定义','关系图上看','矩阵上看'],
      rows:[
        ['自反','对每个 a 都有 <m>a R a</m>','每个点都有自环','主对角线全 1'],
        ['反自反','对每个 a 都没有 <m>a R a</m>','没有自环','主对角线全 0'],
        ['对称','<m>a R b ⟹ b R a</m>','边都是双向的','矩阵关于对角线对称'],
        ['反对称','<m>a R b</m> 且 <m>b R a ⟹ a=b</m>','互异点之间没有双向边','无对称的 1 对'],
        ['传递','<m>a R b, b R c ⟹ a R c</m>','有「接力」就有直达边','<m>M<sup>2</sup> ≤ M</m>']
      ]},
    {t:'warn', h:'<p>最容易混的是<b>「反对称」和「不对称」</b>。反对称不要求对称性缺席——它只是说「如果两个方向都有，那这两个元素必须相同」。</p><p>例如「≤」既是自反的，又是反对称的：<m>a≤b</m> 和 <m>b≤a</m> 同时成立时必然 <m>a=b</m>。它完全合法。</p>'},
    {t:'w', id:'relmat'},
    {t:'p', h:'<b>关系图</b>的画法：把每个元素画成一个点，<m>a R b</m> 就从 <m>a</m> 画一条有向边到 <m>b</m>；<m>a R a</m> 画一个自环。'},
    {t:'p', h:'<b>关系矩阵</b> <m>M<sub>R</sub></m>：第 <m>i</m> 行第 <m>j</m> 列为 1 当且仅当 <m>a<sub>i</sub> R a<sub>j</sub></m>。'},
    {t:'tip', h:'<p>判断性质时，<b>矩阵比图快</b>：自反看对角线，对称看上下三角是否互为镜像，传递看 <m>M<sup>2</sup></m> 的 1 是否都落在 <m>M</m> 的 1 里。</p><p>但<b>图比矩阵直观</b>：想不清结构时画图，要机械判定时看矩阵。</p>'},

    {t:'exs', id:'5.1', items:[
      {q:'设 <m>A = {1,2,3,4}</m>，<m>R = {(a,b) | a 整除 b}</m>。判断 <m>R</m> 的四条性质。',
       hint:'先列出所有有序对。',
       steps:['<m>R</m> 含 (1,1)(1,2)(1,3)(1,4)(2,2)(2,4)(3,3)(4,4)。','自反：每个 (a,a) 都在，成立。','反对称：若 a|b 且 b|a，则 a=b，成立。','对称：有 (1,2) 但没有 (2,1)，不成立。','传递：若 a|b 且 b|c 则 a|c，成立。'],
       ans:'自反、反对称、传递；不对称'},
      {q:'<m>A = {1,2,3}</m>，<m>R = {(1,2),(2,1),(2,3),(3,2)}</m>，判断对称性和传递性。',
       hint:'检查 (1,2) 和 (2,3) 能不能接力。',
       steps:['(1,2) 有 (2,1)，(2,3) 有 (3,2)，所以对称。','但 (1,2) 和 (2,3) 推出应有 (1,3)，而 (1,3) 不在 <m>R</m> 中。','所以不传递。'],
       ans:'对称，但不传递'},
      {q:'一个集合有 3 个元素，它上面一共有多少个不同的关系？',
       hint:'关系是 <m>A×A</m> 的子集。',
       steps:['<m>|A×A| = 9</m>。','子集个数 <m>2<sup>9</sup> = 512</m>。'],
       ans:'512 个'}
    ]}
  ]
},

{
  id:'5.2', title:'n 元关系及其应用',
  blocks:[
    {t:'lead', h:'二元关系描述「两个东西的关系」，<m>n</m> 元关系描述「<m>n</m> 个东西的关系」——它其实就是数据库里的一张表。'},
    {t:'def', lb:'n 元关系', h:'<p><m>n</m> 元关系是 <m>A<sub>1</sub> × A<sub>2</sub> × ⋯ × A<sub>n</sub></m> 的子集。每个元素是一个 <m>n</m> 元组。</p>'},
    {t:'p', h:'换个说法：一张学生成绩表就是三元关系（学号、课程、成绩）的子集。数据库里的「表」和「关系」本来就是同一个词——关系数据库的名字就是这么来的。'},
    {t:'def', lb:'关系的复合', h:'<p><m>S ∘ R = {(a,c) | 存在 b 使 a R b 且 b S c}</m>，即「先走 <m>R</m> 再走 <m>S</m>」。</p><p>注意顺序：<m>S ∘ R</m> 里 <m>R</m> 先作用，和函数复合的约定一致。</p>'},
    {t:'p', h:'复合在矩阵上就是<b>布尔矩阵乘法</b>：<m>M<sub>S∘R</sub> = M<sub>R</sub> ⊙ M<sub>S</sub></m>。而在图上，复合就是「走两步能到哪」。'},
    {t:'p', h:'<b>关系的幂</b> <m>R<sup>n</sup></m> 表示「走 <m>n</m> 步」。于是「<m>a</m> 能否到达 <m>b</m>」就等于问：是否存在 <m>n ≥ 1</m> 使 <m>(a,b) ∈ R<sup>n</sup></m>。这正是第 5.4 节传递闭包要解决的问题。'},

    {t:'exs', id:'5.2', items:[
      {q:'<m>R = {(1,2),(2,3)}</m>，<m>S = {(2,4),(3,5)}</m>，求 <m>S ∘ R</m>。',
       hint:'找「先 R 后 S」能接上的链。',
       steps:['1 R 2，2 S 4 → (1,4)。','2 R 3，3 S 5 → (2,5)。','其他接不上。'],
       ans:'<m>S∘R = {(1,4),(2,5)}</m>'},
      {q:'用关系语言描述「学生选课」这件事，指出它是几元关系。',
       hint:'需要记录哪些信息？',
       steps:['需要：学号、课程号、学期、成绩。','所以是四元关系，是 <m>学号 × 课程 × 学期 × 成绩</m> 的子集。','数据库里这就是一张选课表。'],
       ans:'四元关系'}
    ]}
  ]
},

{
  id:'5.3', title:'关系的表示',
  blocks:[
    {t:'lead', h:'同一个关系，三种表示：<b>有序对集合、0-1 矩阵、有向图</b>。做题时哪种方便就用哪种，但要能随时互相翻译。'},
    {t:'table', head:['表示','优点','适合'],
      rows:[
        ['有序对集合','精确、无歧义','定义、证明'],
        ['0-1 矩阵','适合机械计算','判断性质、算闭包'],
        ['有向图','直观、看结构','看连通性、找路径']
      ]},
    {t:'p', h:'三种表示之间的翻译规则：'},
    {t:'ol', items:[
      '<b>集合 → 矩阵</b>：元素 <m>a<sub>i</sub></m> 排在集合的第 <m>i</m> 个位置，<m>a<sub>i</sub> R a<sub>j</sub></m> 则 <m>m<sub>ij</sub> = 1</m>。',
      '<b>集合 → 图</b>：每个元素一个点，每个有序对一个箭头。',
      '<b>矩阵 → 图</b>：第 <m>i</m> 行第 <m>j</m> 列为 1，就从点 <m>i</m> 画箭头到点 <m>j</m>。'
    ]},
    {t:'warn', h:'<p>矩阵表示依赖<b>元素的排列顺序</b>。同一个关系，换个顺序写矩阵，矩阵就变了——但关系的性质不变。</p><p>所以判断「自反」「对称」这类性质时，用矩阵是安全的（这些性质在行列重排下保持）；但比较两个矩阵是否相等时，必须先确认顺序一致。</p>'},

    {t:'exs', id:'5.3', items:[
      {q:'<m>A = {1,2,3}</m>，<m>R = {(1,1),(1,3),(2,2),(3,1)}</m>，写出关系矩阵。',
       hint:'按 1,2,3 的顺序填 3×3 表。',
       steps:['第 1 行：(1,1)=1，(1,2)=0，(1,3)=1。','第 2 行：(2,1)=0，(2,2)=1，(2,3)=0。','第 3 行：(3,1)=1，(3,2)=0，(3,3)=0。'],
       ans:'<m>[[1,0,1],[0,1,0],[1,0,0]]</m>'}
    ]}
  ]
},

{
  id:'5.4', title:'关系的闭包',
  blocks:[
    {t:'lead', h:'一个关系可能「不够自反」「不够对称」「不够传递」。闭包就是<b>用最少的补充，让它满足某条性质</b>。'},
    {t:'def', lb:'三种闭包', h:'<ul style="margin:6px 0 0"><li><b>自反闭包</b> <m>r(R) = R ∪ I<sub>A</sub></m>：把所有 <m>(a,a)</m> 补上。</li><li><b>对称闭包</b> <m>s(R) = R ∪ R<sup>−1</sup></m>：把每条边都补上反向的。</li><li><b>传递闭包</b> <m>t(R)</m>：补上所有「接力能到」的边。</li></ul>'},
    {t:'thm', lb:'传递闭包的计算', h:'<div class="f" style="margin:4px 0">t(R) = R ∪ R<sup>2</sup> ∪ R<sup>3</sup> ∪ ⋯ ∪ R<sup>n</sup></div><p>其中 <m>n = |A|</m>。因为如果存在路径，最短的那条一定不超过 <m>n</m> 条边（否则必然重复经过某个点，可以缩短）。</p>'},
    {t:'p', h:'<b>Warshall 算法</b>是更高效的算法：逐个用中间点 <m>k</m> 去「打通」其他点。核心三行伪代码：'},
    {t:'f', h:'for k = 1 to n<br>　for i = 1 to n<br>　　for j = 1 to n<br>　　　W[i][j] = W[i][j] ∨ (W[i][k] ∧ W[k][j])', note:'意思是：如果 i 能到 k，k 能到 j，那就让 i 能到 j。三重循环，O(n³)'},
    {t:'tip', h:'<p>Warshall 和第 6 章的 Floyd 最短路算法是同一个骨架。区别只在：Warshall 处理布尔值，Floyd 处理「取最小值 + 相加」。</p><p>看懂一个，另一个自然就懂了。</p>'},

    {t:'ex', title:'例 1　求传递闭包', q:'<m>A = {1,2,3,4}</m>，<m>R = {(1,2),(2,3),(3,4)}</m>，求 <m>t(R)</m>。',
      steps:[
        '这是一个链：1→2→3→4。',
        '走两步：<m>R<sup>2</sup> = {(1,3),(2,4)}</m>。',
        '走三步：<m>R<sup>3</sup> = {(1,4)}</m>。',
        '走四步：空（没有更长的简单路径）。',
        '合并：所有 <m>i &lt; j</m> 的有序对。'
      ], ans:'<m>t(R) = {(i,j) | i &lt; j}</m>，共 6 个'},

    {t:'exs', id:'5.4', items:[
      {q:'<m>A = {1,2,3}</m>，<m>R = {(1,2),(3,2)}</m>，求自反闭包和对称闭包。',
       hint:'自反补对角线，对称补反向边。',
       steps:['自反闭包：加上 (1,1),(2,2),(3,3)。','对称闭包：加上 (2,1),(2,3)。'],
       ans:'<m>r(R)</m> 加三个自环；<m>s(R) = {(1,2),(2,1),(3,2),(2,3)}</m>'},
      {q:'上题的 <m>R</m> 的传递闭包是什么？',
       hint:'检查有没有能接力的链。',
       steps:['(1,2) 的后继只有 2，(3,2) 的后继只有 2。','没有任何「a→b→c」形式的两条边首尾相接。','所以不需要补充。'],
       ans:'<m>t(R) = R</m>（本身已传递）'}
    ]}
  ]
},

{
  id:'5.5', title:'等价关系',
  blocks:[
    {t:'lead', h:'等价关系是「把东西按某个标准归类」的数学化。<b>同余、相似、同姓、同班</b>——凡是「差不多算一类」的关系，都是等价关系。'},
    {t:'def', lb:'等价关系', h:'<p>集合 <m>A</m> 上的关系如果<b>同时满足自反、对称、传递</b>，就称为<b>等价关系</b>。</p>'},
    {t:'def', lb:'等价类', h:'<p>对 <m>a ∈ A</m>，<b>等价类</b> <m>[a] = {x ∈ A | x R a}</m>，即所有与 <m>a</m> 等价的元素。</p>'},
    {t:'thm', lb:'基本定理', h:'<p>等价关系与<b>划分</b>是一一对应的：</p><ul style="margin:6px 0 0"><li>不同等价类互不相交：<m>[a] ∩ [b] = ∅</m> 或 <m>[a] = [b]</m>。</li><li>所有等价类的并是全集 <m>A</m>。</li></ul>'},
    {t:'w', id:'equiv'},
    {t:'tip', h:'<p>这个定理的实用价值在于：<b>证明一个关系是等价关系，等价于找到它对应的那个划分</b>。反之，想构造一个等价关系，只要先想好「怎么切块」，然后定义「在同一块里就等价」。</p>'},
    {t:'p', h:'「互不相交或完全相同」这句话值得琢磨——它排除了「部分重叠」的可能。为什么？若 <m>c ∈ [a] ∩ [b]</m>，则 <m>c R a</m> 且 <m>c R b</m>，由对称得 <m>a R c</m>，由传递得 <m>a R b</m>，于是 <m>[a] = [b]</m>。'},

    {t:'ex', title:'例 1　模 3 同余', q:'在 <m>ℤ</m> 上定义 <m>a R b ⟺ a ≡ b (mod 3)</m>。验证它是等价关系，并写出等价类。',
      steps:[
        '自反：<m>a − a = 0</m> 被 3 整除。',
        '对称：若 <m>3 | (a−b)</m>，则 <m>3 | (b−a)</m>。',
        '传递：若 <m>3|(a−b)</m> 且 <m>3|(b−c)</m>，则 <m>3|(a−c)</m>。',
        '三个等价类：<m>[0]={…,−3,0,3,6,…}</m>，<m>[1]={…,−2,1,4,7,…}</m>，<m>[2]={…,−1,2,5,8,…}</m>。'
      ], ans:'三个等价类，构成 <m>ℤ</m> 的一个划分'},

    {t:'exs', id:'5.5', items:[
      {q:'<m>A = {1,2,3,4,5,6}</m>，<m>R</m> 定义为「除以 3 的余数相同」。写出所有等价类。',
       hint:'按余数 0、1、2 分三组。',
       steps:['余 0：<m>{3,6}</m>。','余 1：<m>{1,4}</m>。','余 2：<m>{2,5}</m>。'],
       ans:'<m>{3,6}</m>、<m>{1,4}</m>、<m>{2,5}</m>'},
      {q:'判断：关系「a 是 b 的祖先」是等价关系吗？',
       hint:'逐条检查三条性质。',
       steps:['自反：自己不是自己的祖先，不满足。','对称：若 a 是 b 的祖先，b 不可能是 a 的祖先，不满足。','它是反自反、传递的，但不是等价关系。'],
       ans:'不是（不满足自反和对称）'},
      {q:'一个集合有 4 个元素，它上面有多少个不同的等价关系？',
       hint:'等价于问：4 元集有多少种划分。',
       steps:['1 块：1 种（全部一起）。','2 块：<m>S(4,2) = 7</m> 种。','3 块：<m>S(4,3) = 6</m> 种。','4 块：1 种。','合计 <m>1+7+6+1 = 15</m>。'],
       ans:'15 个（等于 Bell 数 B₄）'}
    ]}
  ]
},

{
  id:'5.6', title:'偏序',
  blocks:[
    {t:'lead', h:'等价关系把集合「摊平成一堆」，偏序则把它「排成层次」。前者关心「差不多」，后者关心「谁在前」。'},
    {t:'def', lb:'偏序关系', h:'<p>满足<b>自反、反对称、传递</b>的关系称为<b>偏序</b>。集合配上偏序叫<b>偏序集</b> <m>(S, ≼)</m>。</p>'},
    {t:'p', h:'「偏」的意思是：<b>不是任意两个元素都能比较</b>。「≤」在实数上是全序（任意两个都能比），但「整除」在正整数上只是偏序——2 和 3 谁也不整除谁，无法比较。'},
    {t:'h3', h:'哈斯图'},
    {t:'p', h:'偏序关系画成图会很乱（自环、传递边都是冗余的）。哈斯图把它<b>化简到最少</b>：'},
    {t:'ol', items:[
      '去掉所有自环（自反性已知）。',
      '去掉所有「可由传递性推出」的边（若 <m>a≼b≼c</m>，就不画 <m>a→c</m>）。',
      '把方向统一成「向上」，即 <m>a≼b</m> 时把 <m>b</m> 画在 <m>a</m> 上方。'
    ]},
    {t:'def', lb:'四个极值概念', h:'<ul style="margin:6px 0 0"><li><b>极大元</b>：没有比它更大的元素。可能不止一个。</li><li><b>极小元</b>：没有比它更小的元素。可能不止一个。</li><li><b>最大元</b>：比<b>所有</b>元素都大。唯一（如果存在）。</li><li><b>最小元</b>：比<b>所有</b>元素都小。唯一（如果存在）。</li></ul>'},
    {t:'warn', h:'<p><b>极大 ≠ 最大</b>。极大元只是「上面没人了」，最大元要求「比所有人都大」。</p><p>例子：集合 <m>{2,3,6,12}</m> 按整除关系，6 和 12 都是极大元吗？不——12 能被 6 整除，所以 6 不是极大元，12 是唯一的极大元，也是最大元。</p><p>但如果集合是 <m>{2,3,6}</m>，那么 2 和 3 都是极小元（互不整除），没有最小元。</p>'},
    {t:'p', h:'<b>拓扑排序</b>就是把偏序「拉直」成一个全序：不断取出极小元，删掉它，重复。如果中途卡住（有元素但都不是极小元），说明存在环，不是偏序。'},

    {t:'ex', title:'例 1　整除关系的哈斯图', q:'<m>S = {1,2,3,4,6,12}</m>，按整除关系画哈斯图，找出极大元、极小元、最大元、最小元。',
      steps:[
        '覆盖关系（中间没有其他元素的）：1≺2, 1≺3, 2≺4, 2≺6, 3≺6, 4≺12, 6≺12。',
        '注意 2≺12 不画，因为 2≺4≺12 已经蕴含了它。',
        '1 在最底下，12 在最上面。',
        '极大元：只有 12。极小元：只有 1。最大元：12。最小元：1。'
      ], ans:'极大=最大=12；极小=最小=1'},

    {t:'exs', id:'5.6', items:[
      {q:'<m>S = {2,3,6,12}</m> 按整除关系，求极大元和极小元。',
       hint:'两两检查谁能整除谁。',
       steps:['2|6，2|12，3|6，3|12，6|12。','极大元：12（没有更大的）。','极小元：2 和 3（互不整除，上方都有人但都不比对方小）。'],
       ans:'极大元 {12}；极小元 {2,3}'},
      {q:'「≤」在实数集上是偏序吗？是的话，它和整除关系有什么本质区别？',
       hint:'想想任意两个实数能不能比较。',
       steps:['「≤」满足自反、反对称、传递，是偏序。','而且任意两个实数都能比较大小。','整除关系在正整数上不满足这一点（2 和 3 无法比较）。','所以「≤」是全序，整除只是偏序。'],
       ans:'是偏序，而且是全序'},
      {q:'集合 <m>{a,b,c}</m> 的幂集按包含关系 <m>⊆</m> 构成偏序集，它的最大元、最小元是什么？',
       hint:'幂集的元素是子集。',
       steps:['最大元：包含所有元素的子集，即 <m>{a,b,c}</m>。','最小元：被所有子集包含的，即 <m>∅</m>。','它们都存在且唯一。'],
       ans:'最大元 <m>{a,b,c}</m>，最小元 <m>∅</m>'}
    ]}
  ]
}

]};

CH[6] = {
  title: '图',
  en: 'Graphs',
  intro: '图是离散数学里<b>最像「工具」</b>的一章。社交网络、地铁线路、任务依赖、电路板布线——全是图。这一章的公式不多，但概念密集：术语、连通、欧拉、哈密顿、平面、着色，每一块都有自己的判定定理。学的时候要多画图，别只看文字。',
  sections: [

{
  id:'6.1', title:'图和图模型',
  blocks:[
    {t:'lead', h:'图不是「函数图像」，是<b>点和线</b>。这个术语冲突让很多大一新生第一节课就懵了。'},
    {t:'def', lb:'图', h:'<p>图 <m>G = (V, E)</m> 由一个<b>顶点集</b> <m>V</m> 和一个<b>边集</b> <m>E</m> 组成，每条边连接一对顶点。</p><ul style="margin:6px 0 0"><li><b>无向图</b>：边没有方向，<m>{u,v}</m>。</li><li><b>有向图</b>：边有方向，<m>(u,v)</m>。</li><li><b>简单图</b>：没有自环，也没有重边。</li><li><b>多重图</b>：允许重边。</li></ul>'},
    {t:'p', h:'<b>怎么把一个实际问题变成图？</b>关键在于想清楚「什么充当顶点、什么充当边」。同一个场景，不同的建模方式会得到完全不同的图。'},
    {t:'table', head:['场景','顶点','边'],
      rows:[
        ['社交网络','人','认识关系'],
        ['地铁线路','车站','相邻区间'],
        ['任务调度','任务','「必须先做」的依赖'],
        ['网页链接','网页','超链接'],
        ['地图着色','区域','相邻关系']
      ]},
    {t:'tip', h:'<p>建模时最容易犯的错是<b>把「关系」当成顶点</b>，或者反过来。判断标准：你想问的问题，是关于「点能不能通到点」，还是关于「线本身」？</p><p>前者把对象当点，后者把对象当边（例如「一笔画遍所有桥」——桥是边，不是点）。'},

    {t:'exs', id:'6.1', items:[
      {q:'5 个人两两握手，一共握了几次手？用图论语言说，就是 <m>K<sub>5</sub></m> 有多少条边。',
       hint:'每对顶点之间一条边。',
       steps:['<m>K<sub>5</sub></m> 的边数等于从 5 个点里选 2 个。','<m>C(5,2) = 10</m>。'],
       ans:'10 次'},
      {q:'一个图有 6 个顶点、9 条边，所有顶点的度数之和是多少？',
       hint:'握手定理。',
       steps:['<m>Σdeg(v) = 2|E|</m>。','<m>= 2 × 9 = 18</m>。'],
       ans:'18'}
    ]}
  ]
},

{
  id:'6.2', title:'图的术语和几种特殊的图',
  blocks:[
    {t:'lead', h:'这一节是术语轰炸，但真正需要记住的核心只有一个：<b>握手定理</b>。其余的都是名词，遇到查一下就行。'},
    {t:'thm', lb:'握手定理', h:'<div class="f" style="margin:4px 0">Σ<sub>v∈V</sub> deg(v) = 2|E|</div><p>推论：<b>任何图中，奇数度顶点的个数必为偶数。</b></p>'},
    {t:'p', h:'握手定理的证明只有一句话：每条边贡献 2 个度数（两个端点各算一次）。所以度数之和永远是边数的两倍——一定是偶数。'},
    {t:'p', h:'推论也就跟着来了：如果奇度顶点有奇数个，它们的度数之和是奇数，而偶度顶点的度数之和是偶数，总和就成了奇数——与「必为偶数」矛盾。'},
    {t:'table', head:['名称','定义','边数 / 度数'],
      rows:[
        ['完全图 <m>K<sub>n</sub></m>','任意两点都有边','<m>n(n−1)/2</m> 条边，每点度 <m>n−1</m>'],
        ['圈图 <m>C<sub>n</sub></m>','一个环，<m>n ≥ 3</m>','<m>n</m> 条边，每点度 2'],
        ['轮图 <m>W<sub>n</sub></m>','<m>C<sub>n</sub></m> 加一个中心点连所有点','<m>2n</m> 条边'],
        ['<m>n</m> 立方体图 <m>Q<sub>n</sub></m>','<m>n</m> 位二进制串，差一位则相邻','<m>n·2<sup>n−1</sup></m> 条边，每点度 <m>n</m>'],
        ['二分图','顶点可分成两部分，边只跨部分','—'],
        ['完全二分图 <m>K<sub>m,n</sub></m>','两部分之间所有边都有','<m>mn</m> 条边']
      ]},
    {t:'p', h:'<b>二分图的判定</b>：一个图是二分图，当且仅当它<b>不含奇数长度的圈</b>。这是后面图着色一章的基础。'},
    {t:'warn', h:'<p>「奇度顶点个数为偶数」这条推论经常被用来<b>快速否定</b>某些图的存在性。</p><p>例如「是否存在 5 个顶点、度数分别为 3,3,3,3,3 的图？」——5 个奇度顶点，个数是奇数，直接否定，不用尝试画。</p>'},

    {t:'exs', id:'6.2', items:[
      {q:'<m>K<sub>6</sub></m> 有多少条边？每个顶点的度数是多少？',
       hint:'<m>C(6,2)</m> 和 <m>n−1</m>。',
       steps:['边数 <m>C(6,2) = 15</m>。','每点度数 <m>6−1 = 5</m>。','验证：<m>6 × 5 = 30 = 2 × 15</m>。'],
       ans:'15 条边，每点度为 5'},
      {q:'判断：是否存在一个图，5 个顶点的度数分别是 1,2,3,4,5？',
       hint:'数一下奇度顶点的个数。',
       steps:['奇度顶点有 1、3、5 三个，是奇数个。','由握手定理的推论，奇度顶点个数必须是偶数。','矛盾，所以不存在。'],
       ans:'不存在'},
      {q:'<m>Q<sub>3</sub></m>（3 维立方体图）有几个顶点、几条边？',
       hint:'顶点是 3 位二进制串。',
       steps:['顶点数 <m>2<sup>3</sup> = 8</m>。','每点度数为 3（可以翻转任意一位），总度 <m>24</m>。','边数 <m>24/2 = 12</m>。'],
       ans:'8 个顶点，12 条边'}
    ]}
  ]
},

{
  id:'6.3', title:'图的表示和图的同构',
  blocks:[
    {t:'lead', h:'图在计算机里怎么存？两种基本方式。以及一个更微妙的问题：<b>两个长得不一样的图，什么时候其实是同一个图</b>？'},
    {t:'table', head:['表示法','结构','适合'],
      rows:[
        ['邻接矩阵','<m>n × n</m> 的 0-1 矩阵，<m>a<sub>ij</sub>=1</m> 表示有边','稠密图；查两点是否相邻 O(1)'],
        ['邻接表','每个顶点挂一个链表，存它的邻居','稀疏图；省空间'],
        ['关联矩阵','<m>n × m</m>，行是点、列是边','少数场景（如网络流）']
      ]},
    {t:'p', h:'无向图的邻接矩阵是<b>对称</b>的，而且第 <m>i</m> 行的和就是顶点 <m>i</m> 的度数——这两个性质在判断图的性质时很好用。'},
    {t:'def', lb:'同构', h:'<p>两个图 <m>G<sub>1</sub></m> 和 <m>G<sub>2</sub></m> <b>同构</b>，如果存在一个双射 <m>f: V<sub>1</sub> → V<sub>2</sub></m>，使得 <m>u,v</m> 相邻当且仅当 <m>f(u),f(v)</m> 相邻。</p><p>直观说：<b>只是把点重新标了个号，结构完全一样</b>。</p>'},
    {t:'p', h:'判断同构没有简单的充要条件，但可以用<b>不变量</b>快速排除：顶点数、边数、度数序列、连通分量数、圈的分布。任何一项不同，就肯定不同构。'},
    {t:'tip', h:'<p>度数序列相同<b>不足以</b>说明同构。典型反例：一个 6 点图里有个 6-圈，另一个是两个不相交的 3-圈——度数序列都是 (2,2,2,2,2,2)，但显然不同构（一个连通，一个不连通）。</p><p>所以不变量只能用来「否定」，不能用来「肯定」。</p>'},

    {t:'exs', id:'6.3', items:[
      {q:'一个 4 个顶点的无向简单图，邻接矩阵第 2 行是 (1,0,1,1)，顶点 2 的度数是多少？',
       hint:'行和即度数（无向简单图无自环）。',
       steps:['行和为 <m>1+0+1+1 = 3</m>。','对应顶点 2 与其他三个点都有边（除了自己）。'],
       ans:'3'}
    ]}
  ]
},

{
  id:'6.4', title:'连通性',
  blocks:[
    {t:'lead', h:'连通性问的是一句很朴素的话：<b>从 A 能不能走到 B</b>。但它在不同场景下的含义差别很大。'},
    {t:'def', lb:'连通', h:'<p>无向图中，若 <m>u</m> 和 <m>v</m> 之间存在通路，则称它们<b>连通</b>。若图中任意两点都连通，称图为<b>连通图</b>。</p><p>不连通图会分成若干个<b>连通分量</b>，每个分量内部连通，分量之间没有边。</p>'},
    {t:'def', lb:'割点与割边', h:'<p>删掉某个顶点（及与之相连的边）后，图的连通分量数增加，这个顶点叫<b>割点</b>。类似地，删掉某条边后分量数增加，这条边叫<b>割边（桥）</b>。</p><p>它们是「网络的薄弱环节」——断掉就分裂。</p>'},
    {t:'p', h:'<b>有向图</b>的连通性要分两级：'},
    {t:'ul', items:[
      '<b>强连通</b>：任意两点 <m>u,v</m>，既有 <m>u→v</m> 的通路，也有 <m>v→u</m> 的通路。',
      '<b>弱连通</b>：把边都当成无向的之后连通。',
      '强连通一定弱连通，反之不然。'
    ]},
    {t:'p', h:'强连通分量可以用「两次 DFS」求：先在原图上 DFS 记录完成顺序，再在反图上按逆序 DFS，每次得到的点集就是一个强连通分量。这是 Tarjan / Kosaraju 算法的核心。'},

    {t:'exs', id:'6.4', items:[
      {q:'一个连通图有 7 个顶点，最少有多少条边？',
       hint:'连通图的边数下界是 <m>n−1</m>。',
       steps:['连通图至少要 <m>n−1</m> 条边（树的情形）。','<m>7−1 = 6</m>。'],
       ans:'6 条'},
      {q:'删掉一条边后图变成两个连通分量，这条边叫什么？',
       hint:'这是割边的定义。',
       steps:['删掉后分量数从 1 变成 2，增加了。','按定义，这条边是割边（桥）。'],
       ans:'割边（桥）'}
    ]}
  ]
},

{
  id:'6.5', title:'欧拉通路与哈密顿通路',
  blocks:[
    {t:'lead', h:'两个名字很像、难度却天差地别的问题：<b>欧拉</b>是「每条边走一次」，有漂亮的判定定理；<b>哈密顿</b>是「每个点走一次」，至今没有好的充要条件。'},
    {t:'table', head:['','欧拉','哈密顿'],
      rows:[
        ['要求','每条<b>边</b>恰好走一次','每个<b>顶点</b>恰好访问一次'],
        ['判定','有简单充要条件','无已知的简单充要条件'],
        ['复杂度','多项式时间','NP 完全'],
        ['典型问题','柯尼斯堡七桥','旅行商问题']
      ]},
    {t:'thm', lb:'欧拉定理', h:'<p>连通无向图 <m>G</m>：</p><ul style="margin:6px 0 0"><li>有<b>欧拉回路</b>（回到起点）⟺ <b>所有</b>顶点度数为偶数。</li><li>有<b>欧拉通路</b>（不要求回到起点）⟺ <b>恰好两个</b>顶点度数为奇数。</li></ul>'},
    {t:'w', id:'euler'},
    {t:'p', h:'<b>为什么？</b>走进去就必须走出来——每经过一个顶点，用掉两条边（一进一出），所以除了起点和终点，其余顶点的边必须成对出现，度数为偶。'},
    {t:'p', h:'<b>哈密顿</b>这边只有充分条件。狄拉克定理：若 <m>n ≥ 3</m> 且每个顶点度数 <m>≥ n/2</m>，则存在哈密顿回路。注意它是<b>充分不必要</b>的——很多图不满足条件却仍有哈密顿回路。'},
    {t:'warn', h:'<p>判断哈密顿回路时，常见的必要条件是：图中不能有割点、不能有「度数 1 的顶点」（除非 n=2）。这些条件能帮你<b>快速否定</b>，但不能证明存在。</p>'},

    {t:'ex', title:'例 1　七桥问题', q:'柯尼斯堡有 4 块陆地，7 座桥连接（A、B 各有 3 座，C、D 各有 5 座？）。能否一次走遍所有桥且每桥只走一次？',
      steps:[
        '把 4 块陆地看成顶点，7 座桥看成边。',
        '统计各顶点度数：A=3，B=3，C=5，D=3（按经典七桥布局）。',
        '奇度顶点有 4 个。',
        '由欧拉定理，奇度顶点必须是 0 个（回路）或 2 个（通路）。',
        '4 个奇度顶点 → 既无欧拉回路也无欧拉通路。'
      ], ans:'不能（欧拉证明的经典结论）'},

    {t:'exs', id:'6.5', items:[
      {q:'一个连通图所有顶点的度数都是偶数，它有什么特殊通路？',
       hint:'直接套欧拉定理。',
       steps:['所有顶点度数为偶。','满足欧拉回路的充要条件。','所以存在欧拉回路，可以从任一点出发走遍所有边再回来。'],
       ans:'存在欧拉回路'},
      {q:'一个图有 8 个顶点，度数分别为 2,2,2,2,4,4,4,4，是否存在欧拉回路？',
       hint:'检查奇度顶点个数。',
       steps:['所有度数都是偶数，奇度顶点 0 个。','图需要连通（题目未说明，但若连通则满足条件）。'],
       ans:'若连通，则存在欧拉回路'},
      {q:'为什么「每个顶点度数 ≥ n/2」只是哈密顿回路的充分条件而非必要条件？',
       hint:'想想一个很瘦长的圈。',
       steps:['考虑 <m>C<sub>10</sub></m>（10 个点的圈），每个顶点度数都是 2。','<m>2 &lt; 10/2 = 5</m>，不满足狄拉克条件。','但它显然有哈密顿回路（就是沿着圈走一圈）。','所以条件是充分的，不必要。'],
       ans:'<m>C<sub>10</sub></m> 就是反例'}
    ]}
  ]
},

{
  id:'6.6', title:'最短通路问题',
  blocks:[
    {t:'lead', h:'带权图上「从 A 到 B 最省」的问题。Dijkstra 是最经典的解法，也是贪心算法最漂亮的范例之一。'},
    {t:'p', h:'<b>Dijkstra 的思路</b>：维护一个「已确定最短路」的集合 <m>S</m>。每轮从未确定的点里挑出<b>当前距离最小</b>的那个，确定它，然后用它去松弛邻居。'},
    {t:'w', id:'dij'},
    {t:'p', h:'<b>为什么贪心是对的？</b>因为所有边权非负。当前距离最小的那个点，不可能通过绕道其他点变得更短——绕道只会更长。所以可以放心确定它，永不反悔。'},
    {t:'warn', h:'<p><b>Dijkstra 不能处理负权边。</b>一旦有负权，「绕道会更短」就可能成立，贪心的前提崩了。</p><p>负权要用 Bellman-Ford（跑 <m>n−1</m> 轮松弛），它还能检测负权环。</p>'},
    {t:'p', h:'<b>Floyd 算法</b>则一次性求出所有点对之间的最短距离，三重循环，思想是「逐个允许中间点」：<div class="f" style="margin:8px 0">d[i][j] = min(d[i][j], d[i][k] + d[k][j])</div>这和 5.4 的 Warshall 是同一个骨架，只是把「或」换成了「取最小」。'},

    {t:'exs', id:'6.6', items:[
      {q:'Dijkstra 算法能否用于有负权边的图？为什么？',
       hint:'想想贪心的前提。',
       steps:['Dijkstra 的核心假设是「当前最近的点的距离已经最终确定」。','有负权时，绕一个远点再回来可能更短。','假设被推翻，算法可能给出错误结果。'],
       ans:'不能，需改用 Bellman-Ford'},
      {q:'Floyd 算法的时间复杂度是多少？',
       hint:'看三重循环。',
       steps:['外层 k、内层 i、j 各 n 次。','共 <m>n<sup>3</sup></m> 次基本操作。'],
       ans:'<m>O(n<sup>3</sup>)</m>'}
    ]}
  ]
},

{
  id:'6.7', title:'平面图',
  blocks:[
    {t:'lead', h:'平面图问的是：<b>能不能把图画在纸上，让边不交叉</b>？这个问题和电路板布线、地图绘制直接相关。'},
    {t:'def', lb:'平面图', h:'<p>能在平面上画出且<b>边只在顶点处相交</b>的图，称为<b>平面图</b>。这样的画法叫平面嵌入。</p>'},
    {t:'thm', lb:'欧拉公式', h:'<p>对连通的平面图：</p><div class="f" style="margin:8px 0">V − E + F = 2</div><p>其中 <m>V</m> 是顶点数，<m>E</m> 是边数，<m>F</m> 是面数（<b>包括外部那个无限面</b>）。</p>'},
    {t:'p', h:'这个公式的威力在于：它把三个看似无关的量绑在一起。知道两个就能求第三个。'},
    {t:'thm', lb:'有用的推论', h:'<p>对 <m>V ≥ 3</m> 的连通平面简单图：</p><div class="f" style="margin:8px 0">E ≤ 3V − 6</div><p>若还没有三角形（围长 <m>≥ 4</m>），则 <m>E ≤ 2V − 4</m>。</p>'},
    {t:'p', h:'<b>用这个推论可以证明 <m>K<sub>5</sub></m> 和 <m>K<sub>3,3</sub></m> 都不是平面图。</b>'},
    {t:'ul', items:[
      '<m>K<sub>5</sub></m>：<m>V=5, E=10</m>，而 <m>3V−6 = 9 &lt; 10</m>，违反不等式。',
      '<m>K<sub>3,3</sub></m>：<m>V=6, E=9</m>，<m>3V−6=12</m> 没违反，但它没有三角形（二分图），所以用更强的 <m>E ≤ 2V−4 = 8 &lt; 9</m>，违反。'
    ]},
    {t:'thm', lb:'库拉托夫斯基定理', h:'<p>一个图是平面图，当且仅当它<b>不包含</b> <m>K<sub>5</sub></m> 或 <m>K<sub>3,3</sub></m> 的<b>细分</b>作为子图。</p><p>「细分」就是在边上插入新的二度顶点。所以只要你的图里藏着一个「拉长版的 <m>K<sub>5</sub></m>」，它就画不平。</p>'},

    {t:'ex', title:'例 1　用欧拉公式反推面数', q:'一个连通平面图有 8 个顶点、12 条边，有多少个面？',
      steps:['欧拉公式 <m>V − E + F = 2</m>。','<m>8 − 12 + F = 2</m>。','<m>F = 6</m>。'],
      ans:'6 个面（含外部面）'},

    {t:'exs', id:'6.7', items:[
      {q:'证明 <m>K<sub>5</sub></m> 不是平面图。',
       hint:'用 <m>E ≤ 3V−6</m>。',
       steps:['<m>K<sub>5</sub></m> 有 <m>V=5</m>，<m>E = C(5,2) = 10</m>。','若平面，则需 <m>E ≤ 3×5−6 = 9</m>。','<m>10 &gt; 9</m>，矛盾。'],
       ans:'得证'},
      {q:'一个平面图有 10 个顶点，最多能有多少条边？',
       hint:'用 <m>E ≤ 3V−6</m>。',
       steps:['<m>E ≤ 3×10 − 6</m>。','<m>= 24</m>。'],
       ans:'最多 24 条'}
    ]}
  ]
},

{
  id:'6.8', title:'图着色',
  blocks:[
    {t:'lead', h:'给图的顶点染色，要求<b>相邻的顶点颜色不同</b>。最少需要几种颜色？这个数叫色数，记作 <m>χ(G)</m>。'},
    {t:'def', lb:'色数', h:'<p><m>χ(G)</m> = 使图能正常着色的最少颜色数。</p>'},
    {t:'w', id:'color'},
    {t:'table', head:['图','色数','原因'],
      rows:[
        ['空图（无边）','1','所有点同色'],
        ['二分图（含树、偶圈）','2','两边各一色'],
        ['奇圈 <m>C<sub>2k+1</sub></m>','3','交替染到最后一格撞色'],
        ['完全图 <m>K<sub>n</sub></m>','<m>n</m>','两两相邻，必须各不相同'],
        ['平面图','≤ 4','四色定理'],
        ['轮图 <m>W<sub>n</sub></m>（n 为偶数）','3 或 4','看边界圈的长度']
      ]},
    {t:'thm', lb:'四色定理', h:'<p>任何平面图的色数不超过 <b>4</b>。</p><p>这条定理 1852 年提出，1976 年由 Appel 和 Haken 用计算机辅助证明——是第一个「必须借助计算机」才完成的主要数学定理。</p>'},
    {t:'p', h:'<b>贪心着色</b>：按某个顺序遍历顶点，每个点染上「邻居已用过的最小可用颜色」。这样得到的颜色数不超过 <m>Δ+1</m>（<m>Δ</m> 是最大度数），但不一定最优——顺序不同结果可能差很多。'},
    {t:'tip', h:'<p>着色问题和<b>地图着色</b>是一回事：把每个区域缩成一个点，相邻区域连一条边，就成了平面图。</p><p>它也和<b>排课表</b>、<b>寄存器分配</b>、<b>频率分配</b>是同一个数学模型——只要两个任务「不能同时」，它们之间就连边。'},

    {t:'exs', id:'6.8', items:[
      {q:'<m>C<sub>5</sub></m>（五边形）的色数是多少？',
       hint:'试试用 2 种颜色交替染。',
       steps:['用 2 色交替：1红 2蓝 3红 4蓝，第 5 个点与 4 和 1 都相邻。','4 是蓝、1 是红，第 5 个点两种都用不了。','必须引入第 3 色。'],
       ans:'3'},
      {q:'一个二分图的色数最多是多少？',
       hint:'二分图的两部分内部没有边。',
       steps:['把两部分分别染成两种颜色。','同一部分内部无边，不会冲突。','所以 2 色就够（除非没有边，那就 1 色）。'],
       ans:'至多 2'},
      {q:'为什么地图着色问题可以转化为图着色？',
       hint:'想想顶点和边分别对应什么。',
       steps:['把每个行政区域缩成一个顶点。','相邻（共享边界）的区域之间连一条边。','要求相邻区域颜色不同，就变成「相邻顶点颜色不同」。','地图对应平面图，所以四色定理适用。'],
       ans:'区域当顶点，相邻关系当边'}
    ]}
  ]
}

]};

CH[7] = {
  title: '树',
  en: 'Trees',
  intro: '树是「最省的连通图」——<b>n 个点，n−1 条边，不多不少</b>。这个「刚好够用」的性质让它在数据结构、文件系统、决策分析里无处不在。这一章不难，但每个结论都值得动手画一遍。',
  sections: [

{
  id:'7.1', title:'树的介绍',
  blocks:[
    {t:'lead', h:'树有很多等价定义，它们说的是同一件事的不同侧面。记住其中三个，做题时按需要切换。'},
    {t:'def', lb:'树', h:'<p><b>树</b>是连通的无向图，且<b>不含简单回路</b>。不含回路但可能不连通的图叫<b>森林</b>——它的每个连通分量都是树。</p>'},
    {t:'thm', lb:'树的等价刻画', h:'<p>对 <m>n</m> 个顶点的无向图 <m>G</m>，以下命题等价：</p><ol style="margin:6px 0 0"><li><m>G</m> 是树（连通且无回路）。</li><li><m>G</m> 连通，且恰有 <m>n−1</m> 条边。</li><li><m>G</m> 无回路，且恰有 <m>n−1</m> 条边。</li><li><m>G</m> 中任意两点之间<b>恰有一条</b>简单通路。</li><li><m>G</m> 连通，但删掉任意一条边就<b>不再连通</b>（极小连通）。</li></ol>'},
    {t:'p', h:'第 4 条最值得记：<b>「唯一路径」是树的本质特征</b>。有两条路径就构成回路，一条都没有就不连通。'},
    {t:'table', head:['概念','定义'],
      rows:[
        ['根','指定的一个特殊顶点'],
        ['叶子','度数为 1 的顶点（根也可能是叶子，如果只有它自己）'],
        ['内部顶点','有子节点的顶点'],
        ['<m>m</m> 叉树','每个内部顶点至多 <m>m</m> 个孩子'],
        ['满 <m>m</m> 叉树','每个内部顶点恰好 <m>m</m> 个孩子'],
        ['有序树','孩子的顺序有意义']
      ]},
    {t:'thm', lb:'满 m 叉树的叶子数', h:'<p>若满 <m>m</m> 叉树有 <m>i</m> 个内部顶点，则叶子数 <m>l = (m−1)i + 1</m>。</p><p>证明用度数之和：总顶点 <m>n = i + l</m>，总边数 <m>n − 1</m>（树的性质），而总边数也等于 <m>mi</m>（每个内部顶点发出 <m>m</m> 条边）。所以 <m>i + l − 1 = mi</m>，得 <m>l = (m−1)i + 1</m>。</p>'},

    {t:'exs', id:'7.1', items:[
      {q:'一棵树有 10 个顶点，它有多少条边？',
       hint:'<m>n−1</m>。',
       steps:['树的边数恒为 <m>n−1</m>。','<m>10−1 = 9</m>。'],
       ans:'9 条'},
      {q:'一棵满二叉树有 5 个内部顶点，它有多少个叶子？',
       hint:'用 <m>l = (m−1)i+1</m>，<m>m=2</m>。',
       steps:['<m>l = (2−1)×5 + 1</m>。','<m>= 6</m>。','验证：根 + 5 个内部点，每个内部点 2 个孩子，共 12 条边、11 个顶点，其中 6 个是叶子。'],
       ans:'6 个叶子'},
      {q:'一个图有 8 个顶点、7 条边，且无回路。它连通吗？',
       hint:'用等价刻画第 3 条。',
       steps:['无回路且 <m>E = n−1 = 7</m>。','由等价刻画，它是树。','树必然连通。'],
       ans:'连通（是树）'}
    ]}
  ]
},

{
  id:'7.2', title:'树的应用',
  blocks:[
    {t:'lead', h:'树之所以无处不在，是因为它用最少的边实现了「全连通」——<b>任何多余的边都是浪费</b>。'},
    {t:'h3', h:'二叉搜索树'},
    {t:'p', h:'每个节点满足：<b>左子树的所有值 &lt; 根 &lt; 右子树的所有值</b>。于是查找、插入、删除都是 <m>O(\log n)</m>（树平衡时）。'},
    {t:'p', h:'<b>中序遍历</b>二叉搜索树，得到的就是升序序列——这一点在做题时经常用到。'},
    {t:'h3', h:'哈夫曼编码'},
    {t:'p', h:'给字符设计变长编码，让出现频率高的字符编码短、频率低的编码长，从而压缩总长度。构造方法：'},
    {t:'ol', items:[
      '把每个字符按频率做成一个单节点树，放进优先队列。',
      '取出频率最小的两个，合并成一棵新树，根节点频率为两者之和。',
      '把新树放回队列，重复，直到只剩一棵树。',
      '左分支标 0、右分支标 1，从根到叶的路径就是该字符的编码。'
    ]},
    {t:'p', h:'哈夫曼编码是<b>前缀码</b>：没有任何编码是另一个的前缀。这保证了编码可以唯一解码——因为解码时不会出现「两种切分方式」的歧义。这个性质正好来自「编码对应叶子，不对应内部节点」。'},
    {t:'h3', h:'决策树与博弈树'},
    {t:'p', h:'每个内部节点是一次判断，每条边是一个结果，叶子是最终结论。排序算法的比较次数下界、井字棋的最优策略，都是在这棵树上分析的。'},

    {t:'ex', title:'例 1　哈夫曼编码', q:'字符 A、B、C、D、E 的频率分别为 0.4、0.2、0.2、0.1、0.1，构造哈夫曼编码。',
      steps:[
        '取最小的两个：D(0.1) 和 E(0.1)，合并为 0.2。',
        '现有 A(0.4)、B(0.2)、C(0.2)、DE(0.2)。取最小的两个（比如 B 和 C），合并为 0.4。',
        '现有 A(0.4)、BC(0.4)、DE(0.2)。取 0.2 和任一 0.4，合并为 0.6。',
        '最后 0.6 与剩下的 0.4 合并为 1.0。',
        '一种可能的编码：A=0，B=10，C=11，D=010，E=011。'
      ], ans:'平均码长 = 0.4×1 + 0.2×2 + 0.2×2 + 0.1×3 + 0.1×3 = 2.2 位/字符'},

    {t:'exs', id:'7.2', items:[
      {q:'为什么哈夫曼编码必须是前缀码？',
       hint:'想想解码时怎么区分边界。',
       steps:['如果某编码是另一个的前缀，例如 A=0、B=01。','读到 01 时无法判断是「B」还是「A 后面跟了个 1」。','把字符都放在叶子（而非内部节点）上，就自然避免了这种情况。'],
       ans:'否则解码有歧义'},
      {q:'二叉搜索树的中序遍历结果有什么特点？',
       hint:'左 &lt; 根 &lt; 右。',
       steps:['中序是「左 → 根 → 右」。','左子树全部小于根，右子树全部大于根。','递归下去，整个序列升序。'],
       ans:'升序排列'}
    ]}
  ]
},

{
  id:'7.3', title:'树的遍历',
  blocks:[
    {t:'lead', h:'三种遍历的区别只有一个字：<b>根被访问的时机</b>。前序先碰根，中序中间碰，后序最后碰。'},
    {t:'table', head:['遍历','顺序','典型用途'],
      rows:[
        ['前序 preorder','根 → 左 → 右','复制一棵树、前缀表达式'],
        ['中序 inorder','左 → 根 → 右','二叉搜索树排序、中缀表达式'],
        ['后序 postorder','左 → 右 → 根','释放内存、后缀表达式求值']
      ]},
    {t:'w', id:'trav'},
    {t:'p', h:'记忆锚点：<b>三种名字里的「序」指的都是根的位置</b>。前序 = 根在前，中序 = 根在中间，后序 = 根在最后。左右子树的相对顺序永远不变。'},
    {t:'p', h:'<b>表达式树</b>是最好的应用例子：<m>(a+b)×(c−d)</m> 画成树后，前序遍历得前缀表达式 <m>× + a b − c d</m>，后序遍历得后缀表达式 <m>a b + c d − ×</m>，中序得中缀（需要补括号）。'},

    {t:'ex', title:'例 1　手工推一遍', q:'树的结构：根为 A，左子树 B（其左 D、右 E），右子树 C（其左 F、右 G）。写出三种遍历。',
      steps:[
        '前序：先 A，再整棵左子树（B, D, E），再整棵右子树（C, F, G）。得 A B D E C F G。',
        '中序：先左子树（D, B, E），再 A，再右子树（F, C, G）。得 D B E A F C G。',
        '后序：先左（D, E, B），再右（F, G, C），最后 A。得 D E B F G C A。'
      ], ans:'前序 ABDECFG　中序 DBEAFCG　后序 DEBFGCA'},

    {t:'exs', id:'7.3', items:[
      {q:'已知前序 ABC、中序 BAC，还原这棵树。',
       hint:'前序第一个是根。',
       steps:['前序首字符 A 是根。','中序中 A 的位置把序列分成 B | A | C，所以左子树是 B，右子树是 C。','树为：A 的左孩子 B，右孩子 C。'],
       ans:'根 A，左 B，右 C'},
      {q:'为什么「已知前序和后序」不能唯一确定一棵二叉树？',
       hint:'想想只有一个孩子的情况。',
       steps:['前序和后序都无法区分「左孩子」和「右孩子」。','例如前序 AB、后序 BA：B 可能是 A 的左孩子，也可能是右孩子。','必须有中序才能定左右。'],
       ans:'缺少中序信息，无法区分左右'}
    ]}
  ]
},

{
  id:'7.4', title:'生成树',
  blocks:[
    {t:'lead', h:'一个连通图可能有很多边，但只需要<b>一部分</b>就能保持连通。这部分如果刚好是一棵树，就叫生成树。'},
    {t:'def', lb:'生成树', h:'<p>连通图 <m>G</m> 的<b>生成树</b>是包含 <m>G</m> 全部顶点的一个子图，且它本身是一棵树。</p><p><m>n</m> 个顶点的图，任何生成树都恰有 <m>n−1</m> 条边。</p>'},
    {t:'p', h:'<b>怎么找生成树？</b>两种基本方法：'},
    {t:'ul', items:[
      '<b>深搜（DFS）</b>：一路往下走，遇到已访问的点就退回来。走出来的边构成生成树。',
      '<b>广搜（BFS）</b>：一层层往外扩，得到的生成树叫「广度优先生成树」，它的特点是<b>从根到任一点的距离最短</b>。'
    ]},
    {t:'thm', lb:'生成树的存在性', h:'<p>一个图有生成树，当且仅当它<b>连通</b>。</p><p>不连通图的每个连通分量各有一棵生成树，合起来叫生成森林。</p>'},
    {t:'p', h:'<b>生成树的数量</b>可以用 Matrix-Tree 定理算（用到拉普拉斯矩阵的行列式），但本科阶段通常只要求会和图有关的简单计数，比如完全图 <m>K<sub>n</sub></m> 有 <m>n<sup>n−2</sup></m> 棵生成树（凯莱公式）。'},

    {t:'exs', id:'7.4', items:[
      {q:'<m>K<sub>4</sub></m> 有多少棵不同的生成树？',
       hint:'用凯莱公式 <m>n<sup>n−2</sup></m>。',
       steps:['<m>n = 4</m>。','<m>4<sup>4−2</sup> = 4<sup>2</sup> = 16</m>。'],
       ans:'16 棵'},
      {q:'一个连通图有 6 个顶点，它的任何生成树有多少条边？',
       hint:'生成树是树。',
       steps:['树的性质：<m>n</m> 个顶点有 <m>n−1</m> 条边。','<m>6−1 = 5</m>。'],
       ans:'5 条'}
    ]}
  ]
},

{
  id:'7.5', title:'最小生成树',
  blocks:[
    {t:'lead', h:'带权图上「用最小的总代价把所有点连起来」——这就是最小生成树（MST）。它是贪心算法最成功的应用之一。'},
    {t:'p', h:'<b>Kruskal 算法</b>：把所有边按权值从小到大排，依次考虑；如果这条边的两个端点当前不在同一个连通块里，就选它，否则（会成环）扔掉。选满 <m>n−1</m> 条就停。'},
    {t:'w', id:'mst'},
    {t:'p', h:'<b>Prim 算法</b>：从一个顶点开始，每次选「连接已选集合与未选集合的最小边」，把新顶点拉进来。它长得更像 Dijkstra。'},
    {t:'table', head:['','Kruskal','Prim'],
      rows:[
        ['思路','按边贪心','按点贪心'],
        ['适合','稀疏图','稠密图'],
        ['数据结构','并查集','优先队列'],
        ['复杂度','<m>O(E log E)</m>','<m>O(E log V)</m>']
      ]},
    {t:'warn', h:'<p>贪心为什么能得到全局最优？关键在于<b>切割性质</b>：对图的任意一个切割，横跨切割的最小边一定属于某棵最小生成树。</p><p>Kruskal 每次选的正是这种「安全边」，所以永远不会选错。</p>'},
    {t:'p', h:'一个容易混淆的点：<b>MST 不唯一</b>。当有多条边权值相同时，可能产生不同的最小生成树，但<b>总权值一定相同</b>。'},

    {t:'ex', title:'例 1　手算一遍 Kruskal', q:'5 个顶点 A、B、C、D、E，边为 BC=1, AB=2, DE=2, AC=3, BD=4, CD=5, CE=6。求最小生成树。',
      steps:[
        '排序后依次考虑：BC(1)、AB(2)、DE(2)、AC(3)、BD(4)、CD(5)、CE(6)。',
        'BC(1)：B 和 C 不连通，选。',
        'AB(2)：A 与 {B,C} 不连通，选。现在 {A,B,C} 连通。',
        'DE(2)：D 和 E 不连通，选。',
        'AC(3)：A 和 C 已连通，会成环，扔掉。',
        'BD(4)：{A,B,C} 与 {D,E} 不连通，选。现在 5 个点全连通，停止。',
        '总权值 1+2+2+4 = 9。'
      ], ans:'选 BC、AB、DE、BD，总权值 9'},

    {t:'exs', id:'7.5', items:[
      {q:'Kruskal 算法用什么数据结构判断「是否成环」？',
       hint:'需要快速判断两个元素是否在同一集合。',
       steps:['核心操作是「合并两个集合」和「查询某元素属于哪个集合」。','这正是并查集（Union-Find）擅长的。','配合路径压缩和按秩合并，接近常数时间。'],
       ans:'并查集'},
      {q:'一个 4 个顶点的完全图，边权分别为 AB=1, AC=4, AD=5, BC=2, BD=6, CD=3，求 MST 的总权值。',
       hint:'按 Kruskal 顺序试。',
       steps:['排序：AB(1), BC(2), CD(3), AC(4), AD(5), BD(6)。','选 AB(1)。','选 BC(2)，{A,B,C} 连通。','选 CD(3)，四点全连通。','AC(4) 会成环，跳过。'],
       ans:'1+2+3 = 6'},
      {q:'为什么 MST 可能不唯一，但总权值一定相同？',
       hint:'想想权值相同的边。',
       steps:['若存在若干条权值相同的边，Kruskal 的选择顺序可能不同。','不同顺序可能选出不同的边集合。','但 Kruskal 的每一步都是「安全边」，最终总权值必然达到最小可能值。','最小可能值唯一，所以总权值相同。'],
       ans:'选法可不同，最优值唯一'}
    ]}
  ]
}

]};

CH[8] = {
  title: '布尔代数',
  en: 'Boolean Algebra',
  intro: '布尔代数就是<b>把逻辑当成算术来算</b>：只有 0 和 1，加法是「或」，乘法是「与」。这一章看起来抽象，其实它就是你手机里那颗芯片的设计语言——每一条 <code>if</code> 判断最终都化成一堆逻辑门。',
  sections: [

{
  id:'8.1', title:'布尔函数',
  blocks:[
    {t:'lead', h:'布尔函数是从 <m>{0,1}<sup>n</sup></m> 到 <m>{0,1}</m> 的函数。输入是一串 0/1，输出是一个 0/1。就这么简单。'},
    {t:'def', lb:'布尔函数', h:'<p><m>f: {0,1}<sup>n</sup> → {0,1}</m>。它的完整描述方式是<b>真值表</b>——<m>n</m> 个变量有 <m>2<sup>n</sup></m> 行。</p>'},
    {t:'p', h:'<b>布尔运算</b>只有三种基本形式，对应逻辑里的三个联结词：'},
    {t:'table', head:['运算','记号','含义','真值'],
      rows:[
        ['布尔和（或）','<m>x + y</m>','至少一个为 1','0+0=0，其余为 1'],
        ['布尔积（与）','<m>x · y</m>','两个都为 1','1·1=1，其余为 0'],
        ['补（非）','<m>x̄</m>','取反','0̄=1，1̄=0']
      ]},
    {t:'thm', lb:'布尔代数的基本恒等式', h:'<div style="line-height:2.1"><m>x + 0 = x</m>，<m>x · 1 = x</m>（同一律）<br><m>x + 1 = 1</m>，<m>x · 0 = 0</m>（支配律）<br><m>x + x = x</m>，<m>x · x = x</m>（幂等律）<br><m>x + x̄ = 1</m>，<m>x · x̄ = 0</m>（互补律）<br><m><span style="text-decoration:overline">x+y</span> = x̄ · ȳ</m>，<m><span style="text-decoration:overline">x·y</span> = x̄ + ȳ</m>（德摩根）<br><m>x + (y·z) = (x+y)·(x+z)</m>（分配律）</div>'},
    {t:'tip', h:'<p>这套恒等式和命题逻辑的恒等式<b>完全同构</b>：把 <m>+</m> 看成 <m>∨</m>、<m>·</m> 看成 <m>∧</m>、<m>0</m> 看成 F、<m>1</m> 看成 T，就是第 1 章那张表。</p><p>所以第 1 章练熟了，这一章几乎不用重新学。</p>'},
    {t:'p', h:'<b>布尔函数一共有多少个？</b><m>n</m> 个变量有 <m>2<sup>n</sup></m> 种输入组合，每种组合的输出可以独立取 0 或 1，所以共 <m>2<sup>2<sup>n</sup></sup></m> 个不同的布尔函数。'},
    {t:'warn', h:'<p>注意这个增长速度：<m>n=2</m> 时 16 个，<m>n=3</m> 时 256 个，<m>n=4</m> 时 65536 个。</p><p>函数数量是<b>双指数</b>增长的，这解释了为什么「找最简单的电路」本质上是个很难的问题。</p>'},

    {t:'exs', id:'8.1', items:[
      {q:'写出 <m>f(x,y) = x + x̄y</m> 的真值表，并化简。',
       hint:'先化简再画表更快。',
       steps:['<m>x + x̄y = (x + x̄)(x + y)</m>（分配律）。','<m>x + x̄ = 1</m>，所以 <m>= 1·(x+y) = x + y</m>。','真值表就是「或」的表：只有 0,0 时输出 0。'],
       ans:'<m>f = x + y</m>'},
      {q:'3 个变量的布尔函数一共有多少个？',
       hint:'<m>2<sup>2<sup>n</sup></sup></m>。',
       steps:['<m>2<sup>3</sup> = 8</m> 种输入组合。','每种输出 2 种选择，共 <m>2<sup>8</sup> = 256</m>。'],
       ans:'256 个'},
      {q:'验证德摩根律 <m><span style="text-decoration:overline">x·y</span> = x̄ + ȳ</m>（用真值表）。',
       hint:'列出 4 行逐列比对。',
       steps:['(0,0)：左边 <m><span style="text-decoration:overline">0</span> = 1</m>，右边 <m>1+1 = 1</m>。','(0,1)：左边 <m><span style="text-decoration:overline">0</span> = 1</m>，右边 <m>1+0 = 1</m>。','(1,0)：左边 1，右边 1。','(1,1)：左边 <m><span style="text-decoration:overline">1</span> = 0</m>，右边 <m>0+0 = 0</m>。','四行全同，成立。'],
       ans:'成立'}
    ]}
  ]
},

{
  id:'8.2', title:'布尔函数的表示',
  blocks:[
    {t:'lead', h:'真值表能完整描述一个函数，但没法直接变成电路。所以需要把它写成<b>表达式</b>——两种标准形式。'},
    {t:'def', lb:'小项与积之和', h:'<p>对每种输入组合，构造一个「<b>小项</b>」：变量为 1 时写原变量，为 0 时写反变量，全部相乘。把小项相加，就得到<b>积之和（DNF）</b>。</p>'},
    {t:'p', h:'例：<m>f(x,y)</m> 在 (0,0)、(1,0)、(1,1) 处为 1，则'},
    {t:'f', h:'f = x̄ȳ + xȳ + xy'},
    {t:'def', lb:'大项与和之积', h:'<p>对每种输出为 0 的输入，构造一个「<b>大项</b>」：变量为 0 时写原变量，为 1 时写反变量，全部相加。把这些大项相乘，得到<b>和之积（CNF）</b>。</p>'},
    {t:'p', h:'两种形式都正确，选哪种看哪种项少。做题时先数一数：为 1 的行多就用 CNF（对 0 行取反），为 0 的行多就用 DNF。'},
    {t:'table', head:['形式','英文','构造','何时更短'],
      rows:[
        ['积之和','DNF / 最小项之和','对每个 1 行写一个乘积，相加','1 少 0 多时'],
        ['和之积','CNF / 最大项之积','对每个 0 行写一个和式，相乘','0 少 1 多时']
      ]},
    {t:'tip', h:'<p>DNF 有一个非常实用的优点：<b>它可以直接翻译成两级电路</b>——第一级是若干个与门，第二级是一个或门。这也是 FPGA 内部结构的理论基础。</p>'},

    {t:'ex', title:'例 1　从真值表写出表达式', q:'已知 <m>f(x,y,z)</m> 仅在 (0,0,1) 和 (1,1,0) 处为 1，其余为 0。写出它的 DNF。',
      steps:[
        '(0,0,1)：x=0,y=0,z=1，小项为 <m>x̄ȳz</m>。',
        '(1,1,0)：x=1,y=1,z=0，小项为 <m>xy z̄</m>。',
        '两项相加。'
      ], ans:'<m>f = x̄ȳz + xy z̄</m>'},

    {t:'exs', id:'8.2', items:[
      {q:'写出 <m>f(x,y) = x ⊕ y</m> 的 DNF。',
       hint:'异或在哪两行为 1？',
       steps:['(0,1) 和 (1,0) 处为 1。','小项分别为 <m>x̄y</m> 和 <m>xȳ</m>。'],
       ans:'<m>f = x̄y + xȳ</m>'},
      {q:'写出上题 <m>f(x,y)=x⊕y</m> 的 CNF。',
       hint:'对输出为 0 的两行构造大项。',
       steps:['输出为 0 的行：(0,0) 和 (1,1)。','(0,0) 的大项：变量为 0 写原变量、为 1 写反变量，相加 → <m>x + y</m>。','(1,1) 的大项 → <m>x̄ + ȳ</m>。','两式相乘。'],
       ans:'<m>f = (x+y)(x̄+ȳ)</m>'}
    ]}
  ]
},

{
  id:'8.3', title:'逻辑门电路',
  blocks:[
    {t:'lead', h:'布尔表达式不是纸上的东西，它对应实实在在的电路。<b>每个运算对应一个门，表达式就是接线图</b>。'},
    {t:'table', head:['门','符号','布尔运算','输出为 1 的条件'],
      rows:[
        ['非门 NOT','¬','<m>x̄</m>','x = 0'],
        ['与门 AND','∧','<m>x·y</m>','两个都为 1'],
        ['或门 OR','∨','<m>x+y</m>','至少一个为 1'],
        ['异或门 XOR','⊕','<m>xȳ + x̄y</m>','恰好一个为 1'],
        ['与非门 NAND','↑','<m><span style="text-decoration:overline">x·y</span></m>','不同时为 1'],
        ['或非门 NOR','↓','<m><span style="text-decoration:overline">x+y</span></m>','两个都为 0']
      ]},
    {t:'w', id:'gate'},
    {t:'thm', lb:'功能完备性', h:'<p>一个门集合称为<b>功能完备</b>的，如果用它能让出所有布尔函数。</p><ul style="margin:6px 0 0"><li><m>{¬, ∧, ∨}</m> 是完备的。</li><li><m>{¬, ∧}</m> 和 <m>{¬, ∨}</m> 也是完备的（用德摩根可以互相表示）。</li><li><b>单独一个 NAND 就完备</b>，单独一个 NOR 也完备。</li></ul>'},
    {t:'p', h:'这就是为什么芯片厂商特别喜欢 NAND：<b>只用一种门</b>就能做出整个处理器，工艺简单、成本低、良率高。你听到的「NAND 闪存」名字也来源于这个电路结构。'},
    {t:'p', h:'<b>怎么理解「NAND 完备」？</b>只要能用 NAND 造出非门、与门、或门，就能造出一切：'},
    {t:'ul', items:[
      '<m>x̄ = x ↑ x</m>（把同一个输入接两遍）',
      '<m>x · y = <span style="text-decoration:overline">(x ↑ y)</span> = (x ↑ y) ↑ (x ↑ y)</m>',
      '<m>x + y = x̄ ↑ ȳ</m>（先各自取反，再 NAND）'
    ]},

    {t:'ex', title:'例 1　用 NAND 实现与门', q:'如何只用 NAND 门实现 <m>x · y</m>？',
      steps:[
        '先把 x、y 接进一个 NAND 门，输出 <m><span style="text-decoration:overline">x·y</span></m>。',
        '这个输出正好是我们要的结果的反。',
        '再把它接到一个「自接成非门」的 NAND（两输入接同一个信号）上，取反。',
        '总共两个 NAND 门，输出 <m>x·y</m>。'
      ], ans:'两级 NAND：<m>(x ↑ y) ↑ (x ↑ y)</m>'},

    {t:'exs', id:'8.3', items:[
      {q:'用 NAND 门实现非门 <m>x̄</m>。',
       hint:'把同一个输入接到两个输入端。',
       steps:['NAND 的定义是 <m><span style="text-decoration:overline">x·y</span></m>。','令 <m>y = x</m>，得 <m><span style="text-decoration:overline">x·x</span> = x̄</m>（幂等律）。'],
       ans:'<m>x ↑ x</m>'},
      {q:'为什么只用与门和或门无法表示所有布尔函数？',
       hint:'试试能不能造出「非」。',
       steps:['与门和或门都是<b>单调</b>的：输入全 0 时输出必为 0。','所以没法表示「输入 0 输出 1」的函数，比如非门。','必须有取反能力（NAND 或 NOR 自带取反）。'],
       ans:'缺少取反能力，无法表示非门'}
    ]}
  ]
},

{
  id:'8.4', title:'电路的极小化',
  blocks:[
    {t:'lead', h:'同一个布尔函数可以写成很多等价的表达式，但对应的电路成本差别巨大。<b>少一个门，就少一份延迟、少一点功耗</b>。'},
    {t:'p', h:'极小化的目标是：<b>用最少的门、最少的连线</b>实现给定的函数。实践中最常用的工具是卡诺图（Karnaugh Map）。'},
    {t:'h3', h:'卡诺图的核心思想'},
    {t:'p', h:'把真值表重新排列成二维格子，让<b>相邻格子只差一个变量</b>（格雷码顺序）。这样，如果两个相邻格子都是 1，那么它们对应的两个小项可以合并，消去那个变化的变量。'},
    {t:'p', h:'例：<m>x̄ȳz + x̄yz = x̄z(ȳ + y) = x̄z</m>。两个小项变成一个，省掉了变量 <m>y</m>。'},
    {t:'p', h:'<b>合并规则</b>：'},
    {t:'ul', items:[

{ n:4, title:'高级计数', tag:'递推、分治、生成函数、容斥', html: `
<h3 style="margin-top:0">线性齐次递推</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">形式</th><th>解法</th></tr></thead><tbody>
<tr><td>特征方程</td><td><m>a<sub>n</sub> = pa<sub>n−1</sub> + qa<sub>n−2</sub></m> → <m>r<sup>2</sup> − pr − q = 0</m></td></tr>
<tr><td>两根相异</td><td><m>a<sub>n</sub> = αr₁<sup>n</sup> + βr₂<sup>n</sup></m></td></tr>
<tr><td>重根 <m>r</m></td><td><m>a<sub>n</sub> = (α + βn)r<sup>n</sup></m></td></tr>
<tr><td>非齐次</td><td>齐次通解 + 一个特解（先猜常数，代回定值）</td></tr>
<tr><td>初值</td><td>必给前 <m>k</m> 项，否则序列不唯一</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">斐波那契 <m>f<sub>n</sub> = (φ<sup>n</sup>−ψ<sup>n</sup>)/√5</m>，<m>φ=(1+√5)/2</m>。汉诺塔 <m>H(n)=2H(n−1)+1 ⟹ 2<sup>n</sup>−1</m>。</p>

<h3>分治递推与主定理</h3>
<table class="tbl dense"><thead><tr><th style="width:150px">内容</th><th>公式 / 结论</th></tr></thead><tbody>
<tr><td>标准形式</td><td><m>f(n) = a·f(n/b) + O(n<sup>d</sup>)</m></td></tr>
<tr><td><m>a &lt; b<sup>d</sup></m></td><td><m>O(n<sup>d</sup>)</m>（合并主导）</td></tr>
<tr><td><m>a = b<sup>d</sup></m></td><td><m>O(n<sup>d</sup> log n)</m>（如归并排序）</td></tr>
<tr><td><m>a &gt; b<sup>d</sup></m></td><td><m>O(n<sup>log<sub>b</sub>a</sup>)</m>（递归主导）</td></tr>
<tr><td>二分查找</td><td><m>f(n)=f(n/2)+1 ⟹ O(log n)</m></td></tr>
</tbody></table>

<h3>生成函数</h3>
<table class="tbl dense"><thead><tr><th style="width:180px">生成函数</th><th>对应序列</th></tr></thead><tbody>
<tr><td><m>1/(1−x)</m></td><td><m>1,1,1,1,…</m></td></tr>
<tr><td><m>1/(1−ax)</m></td><td><m>1,a,a<sup>2</sup>,a<sup>3</sup>,…</m></td></tr>
<tr><td><m>1/(1−x)<sup>2</sup></m></td><td><m>1,2,3,4,…</m>（第 n 项 = n+1）</td></tr>
<tr><td><m>(1+x)<sup>n</sup></m></td><td><m>C(n,0),C(n,1),…,C(n,n)</m></td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">用法：每类物品一个因子，<m>x<sup>k</sup></m> 的系数就是「取 k 个」的方案数；有上限就截断因子。</p>

<h3>容斥与两个经典应用</h3>
<table class="tbl dense"><thead><tr><th style="width:120px">内容</th><th>公式</th></tr></thead><tbody>
<tr><td>一般式</td><td><m>|A₁∪…∪A<sub>n</sub>| = Σ|A<sub>i</sub>| − Σ|A<sub>i</sub>∩A<sub>j</sub>| + Σ|A<sub>i</sub>∩A<sub>j</sub>∩A<sub>k</sub>| − …</m></td></tr>
<tr><td>符号规律</td><td>奇数个集合的交取 <b>+</b>，偶数个取 <b>−</b></td></tr>
<tr><td>满射个数</td><td><m>Σ<sub>k=0</sub><sup>n</sup>(−1)<sup>k</sup>C(n,k)(n−k)<sup>m</sup></m></td></tr>
<tr><td>错排</td><td><m>D<sub>n</sub> = n!(1 − 1/1! + 1/2! − … + (−1)<sup>n</sup>/n!) ≈ n!/e</m></td></tr>
<tr><td>错排前几项</td><td><m>D₁=0, D₂=1, D₃=2, D₄=9, D₅=44, D₆=265</m></td></tr>
</tbody></table>
`},

{ n:5, title:'关系', tag:'性质、闭包、等价、偏序', html: `
<h3 style="margin-top:0">★ 五条性质（判断的核心）</h3>
<table class="tbl dense"><thead><tr><th style="width:80px">性质</th><th>定义</th><th>矩阵上</th><th>图上看</th></tr></thead><tbody>
<tr><td>自反</td><td><m>∀a, aRa</m></td><td>对角线全 1</td><td>每点有自环</td></tr>
<tr><td>反自反</td><td><m>∀a, ¬aRa</m></td><td>对角线全 0</td><td>无自环</td></tr>
<tr><td>对称</td><td><m>aRb ⟹ bRa</m></td><td>关于对角线对称</td><td>边都是双向</td></tr>
<tr><td>反对称</td><td><m>aRb∧bRa ⟹ a=b</m></td><td>无对称的 1 对</td><td>互异点间无双向边</td></tr>
<tr><td>传递</td><td><m>aRb∧bRc ⟹ aRc</m></td><td><m>M<sup>2</sup> ≤ M</m></td><td>接力必有直达边</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)"><b>反对称 ≠ 不对称</b>。「≤」既自反又反对称，完全合法。</p>

<h3>闭包</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">闭包</th><th>公式</th><th>操作</th></tr></thead><tbody>
<tr><td>自反闭包</td><td><m>r(R) = R ∪ I<sub>A</sub></m></td><td>补对角线</td></tr>
<tr><td>对称闭包</td><td><m>s(R) = R ∪ R<sup>−1</sup></m></td><td>补反向边</td></tr>
<tr><td>传递闭包</td><td><m>t(R) = R ∪ R<sup>2</sup> ∪ … ∪ R<sup>n</sup></m></td><td>Warshall，<m>O(n<sup>3</sup>)</m></td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">Warshall：<code>W[i][j] |= W[i][k] &amp;&amp; W[k][j]</code>，逐列当中间点。与 Floyd 同骨架。</p>

<h3>等价关系</h3>
<table class="tbl dense"><thead><tr><th style="width:120px">要点</th><th>内容</th></tr></thead><tbody>
<tr><td>定义</td><td>自反 + 对称 + 传递</td></tr>
<tr><td>等价类</td><td><m>[a] = {x | xRa}</m></td></tr>
<tr><td>基本定理</td><td>等价关系 ⟺ 集合的一个<b>划分</b>；<m>[a]∩[b]=∅</m> 或 <m>[a]=[b]</m></td></tr>
<tr><td>计数</td><td><m>n</m> 元集上等价关系个数 = Bell 数 <m>B<sub>n</sub> = ΣS(n,k)</m></td></tr>
</tbody></table>

<h3>偏序</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">要点</th><th>内容</th></tr></thead><tbody>
<tr><td>定义</td><td>自反 + 反对称 + 传递</td></tr>
<tr><td>全序</td><td>任意两元素都能比较（「≤」是；「整除」不是）</td></tr>
<tr><td>哈斯图</td><td>去自环、去传递边、方向统一朝上</td></tr>
<tr><td>极大 / 最大</td><td>极大：上面没人了（可多个）；最大：比所有都大（唯一）</td></tr>
<tr><td>极小 / 最小</td><td>同理，方向相反</td></tr>
</tbody></table>
`},

{ n:6, title:'图', tag:'握手、欧拉、最短路、平面、着色', html: `
<h3 style="margin-top:0">★ 握手定理</h3>
<div class="f" style="margin:6px 0">Σ<sub>v∈V</sub> deg(v) = 2|E|</div>
<p class="kv" style="color:var(--muted)">推论：<b>奇数度顶点必为偶数个</b>。常用于快速否定「不存在这样的图」。</p>

<h3>特殊图的边数 / 度数</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">图</th><th>顶点</th><th>边数</th><th>每点度</th></tr></thead><tbody>
<tr><td>完全图 <m>K<sub>n</sub></m></td><td><m>n</m></td><td><m>n(n−1)/2</m></td><td><m>n−1</m></td></tr>
<tr><td>圈图 <m>C<sub>n</sub></m></td><td><m>n</m></td><td><m>n</m></td><td>2</td></tr>
<tr><td>轮图 <m>W<sub>n</sub></m></td><td><m>n+1</m></td><td><m>2n</m></td><td>中心 <m>n</m>，其余 3</td></tr>
<tr><td>立方体 <m>Q<sub>n</sub></m></td><td><m>2<sup>n</sup></m></td><td><m>n·2<sup>n−1</sup></m></td><td><m>n</m></td></tr>
<tr><td>完全二分 <m>K<sub>m,n</sub></m></td><td><m>m+n</m></td><td><m>mn</m></td><td>—</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">二分图判定：<b>不含奇圈</b>。连通图边数下界 <m>n−1</m>。</p>

<h3>欧拉 vs 哈密顿</h3>
<table class="tbl dense"><thead><tr><th></th><th>欧拉（走遍所有<b>边</b>）</th><th>哈密顿（走遍所有<b>点</b>）</th></tr></thead><tbody>
<tr><td>判定</td><td>有简单充要条件</td><td>无已知充要条件（NP 完全）</td></tr>
<tr><td>回路条件</td><td>连通且<b>所有</b>顶点度数为偶</td><td>狄拉克：<m>deg(v) ≥ n/2</m>（充分不必要）</td></tr>
<tr><td>通路条件</td><td>连通且<b>恰好 2 个</b>奇度顶点</td><td>—</td></tr>
</tbody></table>

<h3>最短路</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">算法</th><th>适用</th><th>复杂度</th></tr></thead><tbody>
<tr><td>Dijkstra</td><td>单源，<b>边权非负</b>，贪心</td><td><m>O(E log V)</m></td></tr>
<tr><td>Bellman-Ford</td><td>单源，可含负权，能查负环</td><td><m>O(VE)</m></td></tr>
<tr><td>Floyd</td><td>全源，可含负权（无负环）</td><td><m>O(V<sup>3</sup>)</m></td></tr>
</tbody></table>

<h3>平面图</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">结论</th><th>公式</th></tr></thead><tbody>
<tr><td>欧拉公式</td><td><m>V − E + F = 2</m>（连通平面图，<m>F</m> 含外部面）</td></tr>
<tr><td>边数上界</td><td><m>V ≥ 3</m> 的简单平面图：<m>E ≤ 3V − 6</m></td></tr>
<tr><td>无三角形</td><td><m>E ≤ 2V − 4</m></td></tr>
<tr><td>非平面</td><td><m>K<sub>5</sub></m>（<m>10 &gt; 9</m>）、<m>K<sub>3,3</sub></m>（<m>9 &gt; 8</m>）；库拉托夫斯基定理</td></tr>
</tbody></table>

<h3>图着色</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">图</th><th>色数 <m>χ</m></th></tr></thead><tbody>
<tr><td>二分图 / 树 / 偶圈</td><td>≤ 2</td></tr>
<tr><td>奇圈 <m>C<sub>2k+1</sub></m></td><td>3</td></tr>
<tr><td>完全图 <m>K<sub>n</sub></m></td><td><m>n</m></td></tr>
<tr><td>平面图</td><td>≤ 4（四色定理）</td></tr>
<tr><td>贪心上界</td><td><m>Δ + 1</m>（<m>Δ</m> 为最大度数）</td></tr>
</tbody></table>
`},

{ n:7, title:'树', tag:'等价刻画、遍历、生成树', html: `
<h3 style="margin-top:0">★ 树的等价刻画（<m>n</m> 个顶点）</h3>
<table class="tbl dense"><thead><tr><th style="width:40px">#</th><th>命题</th></tr></thead><tbody>
<tr><td>1</td><td>连通且无简单回路</td></tr>
<tr><td>2</td><td>连通且恰有 <m>n−1</m> 条边</td></tr>
<tr><td>3</td><td>无回路且恰有 <m>n−1</m> 条边</td></tr>
<tr><td>4</td><td>任意两点之间<b>恰有一条</b>简单通路</td></tr>
<tr><td>5</td><td>连通，但删掉任意一条边就不再连通（极小连通）</td></tr>
</tbody></table>

<h3>计数与遍历</h3>
<table class="tbl dense"><thead><tr><th style="width:150px">内容</th><th>结论</th></tr></thead><tbody>
<tr><td>满 <m>m</m> 叉树叶子数</td><td><m>l = (m−1)i + 1</m>（<m>i</m> 为内部顶点数）</td></tr>
<tr><td>前序</td><td>根 → 左 → 右（复制树、前缀表达式）</td></tr>
<tr><td>中序</td><td>左 → 根 → 右（BST 得升序）</td></tr>
<tr><td>后序</td><td>左 → 右 → 根（释放内存、后缀表达式）</td></tr>
<tr><td>还原</td><td>前序 + 中序可唯一确定；<b>前序 + 后序不行</b></td></tr>
</tbody></table>

<h3>生成树</h3>
<table class="tbl dense"><thead><tr><th style="width:150px">内容</th><th>结论</th></tr></thead><tbody>
<tr><td>存在性</td><td>图有生成树 ⟺ 图连通</td></tr>
<tr><td>边数</td><td>任何生成树恰 <m>n−1</m> 条边</td></tr>
<tr><td>完全图</td><td><m>K<sub>n</sub></m> 有 <m>n<sup>n−2</sup></m> 棵生成树（凯莱）</td></tr>
<tr><td>Kruskal</td><td>按边权升序，不成环就选；并查集；<m>O(E log E)</m>，适合稀疏图</td></tr>
<tr><td>Prim</td><td>从一点扩，每次选连出去的最小边；<m>O(E log V)</m>，适合稠密图</td></tr>
<tr><td>MST 唯一性</td><td>可能不唯一，但<b>总权值一定相同</b></td></tr>
</tbody></table>
`},

{ n:8, title:'布尔代数', tag:'恒等式、范式、门电路、卡诺图', html: `
<h3 style="margin-top:0">★ 布尔恒等式</h3>
<table class="tbl dense"><thead><tr><th style="width:90px">名称</th><th>等式</th></tr></thead><tbody>
<tr><td>同一律</td><td><m>x+0=x</m>　　<m>x·1=x</m></td></tr>
<tr><td>支配律</td><td><m>x+1=1</m>　　<m>x·0=0</m></td></tr>
<tr><td>幂等律</td><td><m>x+x=x</m>　　<m>x·x=x</m></td></tr>
<tr><td>互补律</td><td><m>x+x̄=1</m>　　<m>x·x̄=0</m></td></tr>
<tr><td>德摩根</td><td><m><span style="text-decoration:overline">x+y</span> = x̄·ȳ</m>　　<m><span style="text-decoration:overline">x·y</span> = x̄+ȳ</m></td></tr>
<tr><td>分配律</td><td><m>x·(y+z) = x·y + x·z</m>　　<m>x+(y·z) = (x+y)(x+z)</m></td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">与命题逻辑同构：<m>+→∨</m>、<m>·→∧</m>、<m>0→F</m>、<m>1→T</m>。</p>

<h3>两种标准形式</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">形式</th><th>构造</th><th>何时更短</th></tr></thead><tbody>
<tr><td>积之和 DNF</td><td>每个 1 行写一个小项（1 写原变量、0 写反变量，相乘），全部相加</td><td>1 少 0 多</td></tr>
<tr><td>和之积 CNF</td><td>每个 0 行写一个大项（0 写原变量、1 写反变量，相加），全部相乘</td><td>0 少 1 多</td></tr>
<tr><td>函数总数</td><td><m>n</m> 个变量共 <m>2<sup>2<sup>n</sup></sup></m> 个布尔函数</td><td>双指数增长</td></tr>
</tbody></table>

<h3>门电路与完备性</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">结论</th><th>内容</th></tr></thead><tbody>
<tr><td>基本门</td><td>NOT <m>x̄</m>、AND <m>x·y</m>、OR <m>x+y</m>、XOR <m>x⊕y</m>、NAND <m><span style="text-decoration:overline">x·y</span></m>、NOR <m><span style="text-decoration:overline">x+y</span></m></td></tr>
<tr><td>功能完备</td><td><m>{¬,∧,∨}</m>、<m>{¬,∧}</m>、<m>{¬,∨}</m>、<b>单独 NAND</b>、<b>单独 NOR</b></td></tr>
<tr><td>NAND 造非</td><td><m>x̄ = x ↑ x</m></td></tr>
<tr><td>NAND 造与</td><td><m>x·y = (x ↑ y) ↑ (x ↑ y)</m></td></tr>
<tr><td>NAND 造或</td><td><m>x+y = x̄ ↑ ȳ</m></td></tr>
</tbody></table>

<h3>卡诺图合并规则</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">圈住 1 的个数</th><th>消去变量数</th></tr></thead><tbody>
<tr><td>2 个相邻</td><td>1 个</td></tr>
<tr><td>4 个（1×4 或 2×2）</td><td>2 个</td></tr>
<tr><td>8 个</td><td>3 个</td></tr>
<tr><td colspan="2"><b>边界环绕</b>：最左列与最右列相邻，最上行与最下行相邻（格雷码首尾只差一位）</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">步骤：格雷码排表 → 填 1 → 圈尽可能大的 2 的幂方块（可重叠）→ 每圈写一项 → 相加。</p>
`}
