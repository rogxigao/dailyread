/* ================= 4.5 容斥原理 ================= */
W['incl'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>容斥原理：一加一减<em>1 到 100 里，能被哪些数整除</em></div>'+
      '<div class="w-b">'+
      '<div class="w-ctl" id="icChips"></div><div id="icBody"></div></div>'+
      '<div class="w-cap">加的时候把重叠部分多算了一次，所以要减回去；减的时候又把三重重叠减多了，所以要加回来。符号就是这样交替下去的。</div>';
  },
  mount: function(el){
    var pool = [2,3,5,7], sel = {2:true,3:true,5:true,7:false}, N = 100;
    function draw(){
      var act = pool.filter(function(x){return sel[x];});
      $('#icChips',el).innerHTML = pool.map(function(x){
        return '<span class="chip'+(sel[x]?' on':'')+'" data-k="'+x+'">被 '+x+' 整除</span>';
      }).join('');
      if(act.length===0){ $('#icBody',el).innerHTML = '<div class="verdict false">至少选一个。</div>'; return; }
      var terms = [], total = 0;
      function rec(i, lcm, sign, picked){
        if(i===act.length){
          if(!picked.length) return;
          var c = Math.floor(N/lcm);
          total += sign*c;
          terms.push({sign:sign, set:picked, lcm:lcm, c:c});
          return;
        }
        rec(i+1, lcm, sign, picked);
        rec(i+1, lcm*act[i], -sign, picked.concat(act[i]));
      }
      rec(0,1,1,[]);
      var byLevel = {};
      terms.forEach(function(t){ var k=t.set.length; (byLevel[k]=byLevel[k]||[]).push(t); });
      var html = '<div style="font-family:var(--math);font-size:15px;line-height:2.2">';
      var expl = '';
      [1,2,3,4].forEach(function(k){
        if(!byLevel[k]) return;
        var grp = byLevel[k];
        var sgn = k%2===1?'+':'−';
        var parts = grp.map(function(t){
          return '⌊'+N+'/'+t.lcm+'⌋ = '+t.c;
        });
        html += '<div>'+(k>1?'<span style="color:var(--accent)">'+sgn+'</span> ':'')+parts.join(' ' + (k%2===1?'+':'−') + ' ')+'</div>';
        expl += '<div class="kv" style="margin-top:4px">'+
          (k===1?'单个集合：':'')+
          (k===1?'直接数每个集合的大小。':(k===2?'两两交集：把多算的减掉。':(k===3?'三三交集：减法减多了，加回来。':'四四交集：再加一次。')))+
          '</div>';
      });
      html += '</div>';
      $('#icBody',el).innerHTML = html+
        '<div class="verdict" style="margin-top:12px"><b>|A₁ ∪ A₂ ∪ …| = '+fmt(total)+'</b>'+
        '<br><span style="color:var(--muted);font-size:12.5px">1 到 '+N+' 中，能被 '+act.join('、')+' 中至少一个整除的数有 '+total+' 个。'+
        '<br>补集（一个都整除不了）有 '+(N-total)+' 个。</span></div>'+
        '<div class="kv" style="margin-top:8px;color:var(--muted)">计算时用了 ⌊N / 最小公倍数⌋ ——因为同时被 2 和 3 整除，就是被 6 整除。</div>';
    }
    el.addEventListener('click', function(e){
      var c = e.target.closest('[data-k]');
      if(c){ var k=c.getAttribute('data-k'); sel[k]=!sel[k]; draw(); }
    });
    draw();
  }
};

/* ================= 5.x 关系：矩阵 + 关系图 ================= */
W['relmat'] = {

  },

        if(i===j){
          svg += '<circle cx="'+(p1.x)+'" cy="'+(p1.y-20)+'" r="11" fill="none" stroke="var(--accent)" stroke-width="1.2" marker-end="url(#rar)"/>';
        } else {
          var dx=p2.x-p1.x, dy=p2.y-p1.y, L=Math.sqrt(dx*dx+dy*dy);
          var ux=dx/L, uy=dy/L, ox=-uy*9, oy=ux*9;
          svg += '<path d="M'+(p1.x+ux*17+ox)+' '+(p1.y+uy*17+oy)+' L'+(p2.x-ux*19+ox)+' '+(p2.y-uy*19+oy)+'" stroke="var(--accent)" stroke-width="1.1" opacity=".7" fill="none" marker-end="url(#rar)"/>';

W['euler'] = {

  mount: function(el){

/* ================= 6.6 Dijkstra ================= */
W['dij'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>Dijkstra 一步一步走<em>每次都挑当前最近的</em></div>'+
      '<div class="w-b"><div class="w-ctl"><button class="w-btn" id="djNext">下一步</button><button class="w-btn" id="djReset">重置</button><span class="kv" id="djMsg"></span></div>'+
      '<div id="djSvg"></div><div class="dist" id="djDist"></div></div>'+
      '<div class="w-cap">贪心的地方在于：一旦把某个点「确定」下来，就不会再改它了。因为它们已经是从源点出发最短的，绕远路只会更长。</div>';
  },
  mount: function(el){
    var pos = {A:[45,110],B:[160,45],C:[160,175],D:[285,110],E:[400,45],F:[400,175]};
    var eds = [['A','B',4],['A','C',2],['B','C',1],['B','D',5],['C','D',8],['C','F',10],['D','E',2],['D','F',6],['E','F',3]];
    var nodes = Object.keys(pos);
    var dist, prev, done, order, step;
    function init(){
      dist = {}; prev = {}; done = {}; order = [];
      nodes.forEach(function(n){ dist[n]=Infinity; prev[n]=null; done[n]=false; });
      dist['A'] = 0; step = 0;
    }
    function nextStep(){
      var u = null, best = Infinity;
      nodes.forEach(function(n){ if(!done[n] && dist[n]<best){ best=dist[n]; u=n; } });
      if(u===null){ order.push(null); return false; }
      done[u] = true; order.push(u);
      eds.forEach(function(e){
        var a=e[0], b=e[1], w=e[2];
        if(a===u && !done[b] && dist[u]+w < dist[b]){ dist[b]=dist[u]+w; prev[b]=u; }
        if(b===u && !done[a] && dist[u]+w < dist[a]){ dist[a]=dist[u]+w; prev[a]=u; }
      });
      return true;
    }
    function draw(){
      var cs = {A:[45,110],B:[160,45],C:[160,175],D:[285,110],E:[400,45],F:[400,175]};
      var svg = '<svg viewBox="0 0 450 230" class="wsvg">';
      eds.forEach(function(e){
        var p1=cs[e[0]], p2=cs[e[1]];
        var used = done[e[0]]&&done[e[1]]&&(prev[e[0]]===e[1]||prev[e[1]]===e[0]);
        svg += '<path d="M'+p1[0]+' '+p1[1]+' L'+p2[0]+' '+p2[1]+'" stroke="'+(used?'var(--accent)':'var(--line2)')+'" stroke-width="'+(used?2:1.5)+'" fill="none" opacity="'+(used?.9:.7)+'"/>';
        var mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
        svg += '<rect x="'+(mx-8)+'" y="'+(my-8)+'" width="16" height="14" rx="3" fill="var(--surface)"/>'+
          '<text x="'+mx+'" y="'+(my+2)+'" text-anchor="middle" font-size="10.5" font-family="var(--math)" fill="var(--muted)">'+e[2]+'</text>';
      });
      nodes.forEach(function(n){
        var p = cs[n], d = done[n];
        svg += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="'+(d?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="1.3"/>'+
          '<text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="12.5" font-family="var(--math)" fill="'+(d?'#fff':'var(--accent)')+'">'+n+'</text>';
      });
      svg += '</svg>';
      $('#djSvg',el).innerHTML = svg;
      $('#djDist',el).innerHTML = nodes.map(function(n){
        return '<div class="d'+(done[n]?' fin':'')+(order[order.length-1]===n?' cur':'')+'">'+n+
          '<small>'+(dist[n]===Infinity?'∞':dist[n])+'</small></div>';
      }).join('');
      var last = order[order.length-1];
      $('#djMsg',el).textContent = last ? '第 '+order.length+' 步：确定 '+last+'，距离 '+dist[last] : '点「下一步」开始';
      if(order.length>=nodes.length || (order.length && order[order.length-1]===null)){
        $('#djMsg',el).textContent = '完成。A 到各点最短路：'+nodes.map(function(n){return n+'='+dist[n];}).join('，');
      }
    }
    $('#djNext',el).onclick = function(){ if(order.length<nodes.length) nextStep(); draw(); };
    $('#djReset',el).onclick = function(){ init(); draw(); };
    init(); draw();
  }
};

    var pos = [[80,60],[200,40],[280,140],[170,215],[60,160]];
    var cols = ['transparent','#A63E2B','#2C5F6E','#3E7550','#9A6D16'];
    var names = ['未染','红','青','绿','黄'];
    var col = [0,0,0,0,0];
    function draw(){
      var bad = [];
      order5.forEach(function(e){ if(col[e[0]] && col[e[0]]===col[e[1]]) bad.push(e); });
      var svg = '<svg viewBox="0 0 340 250" class="wsvg" style="max-width:340px;margin:0 auto">';
      order5.forEach(function(e){
        var p1=pos[e[0]], p2=pos[e[1]];
        var isBad = bad.some(function(b){return b[0]===e[0]&&b[1]===e[1];});
        svg += '<path d="M'+p1[0]+' '+p1[1]+' L'+p2[0]+' '+p2[1]+'" stroke="'+(isBad?'#E24B4A':'var(--line2)')+'" stroke-width="'+(isBad?3:1.6)+'" fill="none"/>';
      });
      pos.forEach(function(p,i){
        var c = col[i]?cols[col[i]]:'var(--surface)';
        svg += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="19" fill="'+c+'" stroke="var(--ink2)" stroke-width="1.2" style="cursor:pointer" data-v="'+i+'"/>'+
          '<text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="12" font-family="var(--math)" fill="'+(col[i]?'#fff':'var(--muted)')+'" style="pointer-events:none">'+(i+1)+'</text>';
      });
      svg += '</svg>';
      $('#clSvg',el).innerHTML = svg;
      var used = col.filter(function(x){return x>0;}).length;
      var distinct = {};
      col.forEach(function(c){ if(c) distinct[c]=1; });
      var nd = Object.keys(distinct).length;
      var msg = bad.length ? '<b style="color:#E24B4A">有 '+bad.length+' 条边两端同色</b>，还不是合法着色。'
        : (used===5 ? '<b>合法着色！</b>用了 '+nd+' 种颜色。' : '目前没有冲突，继续染完剩下的顶点。');
      $('#clOut',el).innerHTML = '<div class="verdict '+(bad.length?'false':(used===5?'true':''))+'">'+msg+
        '<br><span style="color:var(--muted);font-size:12.5px">这个图是五边形 C₅，χ(C₅) = 3。最少 3 色，2 色一定失败。</span></div>';
    }
    el.addEventListener('click', function(e){
      var v = e.target.closest('[data-v]');
      if(v){ var i=+v.getAttribute('data-v'); col[i]=(col[i]+1)%5; draw(); }
    });
    $('#clClear',el).onclick = function(){ col=[0,0,0,0,0]; draw(); };
    draw();
  }
};

/* ================= 7.3 树的遍历 ================= */
W['trav'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>前序 / 中序 / 后序<em>名字里的「序」指的是根的位置</em></div>'+
      '<div class="w-b"><div class="w-ctl"><button class="w-btn" data-m="pre">前序</button><button class="w-btn" data-m="in">中序</button><button class="w-btn" data-m="post">后序</button><button class="w-btn" id="tvReset">重来</button></div>'+
      '<div id="tvSvg"></div><div id="tvOut"></div></div>'+
      '<div class="w-cap">前序：根 → 左 → 右。中序：左 → 根 → 右。后序：左 → 右 → 根。三者的区别只是根被访问的时机。</div>';
  },
  mount: function(el){
    var nodes = {A:[170,30],B:[95,90],C:[245,90],D:[50,155],E:[135,155],F:[205,155],G:[290,155]};
    var edges = [['A','B'],['A','C'],['B','D'],['B','E'],['C','F'],['C','G']];
    var seqs = {pre:['A','B','D','E','C','F','G'], in:['D','B','E','A','F','C','G'], post:['D','E','B','F','G','C','A']};
    var names = {pre:'前序', in:'中序', post:'后序'};
    var idx = -1, mode = 'pre', timer = null;
    function draw(){
      var seq = seqs[mode];
      var shown = idx>=0 ? seq.slice(0, idx+1) : [];
      var svg = '<svg viewBox="0 0 340 200" class="wsvg" style="max-width:340px;margin:0 auto">';
      edges.forEach(function(e){
        var p1=nodes[e[0]], p2=nodes[e[1]];
        svg += '<path d="M'+p1[0]+' '+p1[1]+' L'+p2[0]+' '+p2[1]+'" stroke="var(--line2)" stroke-width="1.4" fill="none"/>';
      });
      Object.keys(nodes).forEach(function(k){
        var p = nodes[k];
        var isOn = shown.indexOf(k)>=0;
        var isCur = shown[shown.length-1]===k;
        svg += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="'+(isCur?'var(--accent)':(isOn?'var(--accent-soft)':'var(--surface)'))+'" stroke="var(--accent)" stroke-width="1.2"/>'+
          '<text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="12.5" font-family="var(--math)" fill="'+(isCur?'#fff':'var(--accent)')+'">'+k+'</text>';
      });
      svg += '</svg>';
      $('#tvSvg',el).innerHTML = svg+
        '<div class="stepline" style="justify-content:center">'+seq.map(function(k,i){
          var c = i<=(idx<0?-1:idx);
          return '<span class="s'+(c?' ok':'')+(i===idx?' on':'')+'">'+k+'</span>';
        }).join('<span style="color:var(--line2)">→</span>')+'</div>'+
        '<div class="verdict" style="margin-top:10px"><b>'+names[mode]+'</b> 序列：'+seq.join(' → ')+
        '<br><span style="color:var(--muted);font-size:12.5px">'+(
          mode==='pre'?'先访问根，再整棵左子树，最后整棵右子树。':mode==='in'?'先走完左子树，再访问根，再走右子树。二叉搜索树的中序是升序。':'先走完左子树和右子树，最后才碰根——所以根永远在最后。')+'</span></div>';
    }
    function play(m){
      mode = m; idx = -1;
      if(timer) clearInterval(timer);
      draw();
      timer = setInterval(function(){
        idx++;
        if(idx >= seqs[mode].length){ clearInterval(timer); idx = seqs[mode].length-1; draw(); return; }
        draw();
      }, 520);
    }
    el.addEventListener('click', function(e){
      var b = e.target.closest('[data-m]');
      if(b) play(b.getAttribute('data-m'));
      if(e.target.closest('#tvReset')){ if(timer) clearInterval(timer); idx=-1; draw(); }
    });
    draw();
  }
};

/* ================= 7.5 Kruskal ================= */
W['mst'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>Kruskal：从最小的边开始捡<em>成环就扔掉</em></div>'+
      '<div class="w-b"><div class="w-ctl"><button class="w-btn" id="ksNext">下一条边</button><button class="w-btn" id="ksReset">重置</button><span class="kv" id="ksMsg"></span></div>'+
      '<div id="ksSvg"></div><div id="ksSeq"></div></div>'+
      '<div class="w-cap">Kruskal 是贪心：每次拿剩下的最小边，只要它不跟已选的边构成环就保留。选满 n−1 条就停。</div>';
  },
  mount: function(el){
    var pos = {A:[45,50],B:[175,30],C:[105,150],D:[290,70],E:[215,190]};
    var eds = [['B','C',1],['A','B',2],['D','E',2],['A','C',3],['B','D',4],['C','D',5],['C','E',6]];
    var nodes = Object.keys(pos);
    var state, ptr, picked, total;
    function init(){ state = eds.map(function(){return 'pending';}); ptr=0; picked=0; total=0; }
    function parent(){
      var p = {}; nodes.forEach(function(n){p[n]=n;});
      function find(x){ while(p[x]!==x){ p[x]=p[p[x]]; x=p[x]; } return x; }
      return {find:find, p:p};
    }
    function step(){
      if(ptr>=eds.length || picked>=nodes.length-1) return;
      var e = eds[ptr];
      var uf = parent();
      eds.forEach(function(x,i){ if(state[i]==='take'){ var a=uf.find(x[0]), b=uf.find(x[1]); if(a!==b) uf.p[a]=b; } });
      var ra = uf.find(e[0]), rb = uf.find(e[1]);
      if(ra===rb){ state[ptr]='drop'; }
      else { state[ptr]='take'; picked++; total+=e[2]; }
      ptr++;
    }
    function draw(){
      var svg = '<svg viewBox="0 0 350 230" class="wsvg" style="max-width:350px;margin:0 auto">';
      eds.forEach(function(e,i){
        var p1=pos[e[0]], p2=pos[e[1]], s=state[i];
        var c = s==='take'?'var(--accent)':(s==='drop'?'var(--line)':'var(--line2)');
        svg += '<path d="M'+p1[0]+' '+p1[1]+' L'+p2[0]+' '+p2[1]+'" stroke="'+c+'" stroke-width="'+(s==='take'?2.6:1.5)+'" fill="none" opacity="'+(s==='drop'?.5:1)+'"/>';
        var mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
        svg += '<rect x="'+(mx-9)+'" y="'+(my-8)+'" width="18" height="15" rx="3" fill="var(--surface)"/>'+
          '<text x="'+mx+'" y="'+(my+2.5)+'" text-anchor="middle" font-size="11" font-family="var(--math)" fill="'+(s==='take'?'var(--accent)':(s==='drop'?'var(--muted)':'var(--ink2)'))+'">'+e[2]+'</text>';
      });
      nodes.forEach(function(n){
        var p = pos[n];
        svg += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="15" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.3"/>'+
          '<text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="12" font-family="var(--math)" fill="var(--accent)">'+n+'</text>';
      });
      svg += '</svg>';
      $('#ksSvg',el).innerHTML = svg;
      $('#ksSeq',el).innerHTML = '<div class="stepline" style="justify-content:center">'+eds.map(function(e,i){
        return '<span class="s '+(state[i]==='take'?'ok':(state[i]==='drop'?'no':'')).replace('  ',' ')+'">'+e[0]+e[1]+' <span style="opacity:.6">('+e[2]+')</span></span>';
      }).join('')+'</div>'+
      '<div class="verdict" style="margin-top:10px">已选 <b>'+picked+'</b> 条边，总权值 <b style="color:var(--accent);font-size:16px">'+total+'</b>'+
      (picked===nodes.length-1?'　—　最小生成树完成。':'')+
      '<br><span style="color:var(--muted);font-size:12.5px">5 个顶点需要 4 条边。所以一旦选满 4 条，剩下的边就不用看了。</span></div>';
      $('#ksMsg',el).textContent = picked>=nodes.length-1 ? '完成' : '已处理 '+ptr+' / '+eds.length+' 条';
    }
    $('#ksNext',el).onclick = function(){ step(); draw(); };
    $('#ksReset',el).onclick = function(){ init(); draw(); };
    init(); draw();
  }
};

/* ================= 8.3 逻辑门 ================= */
W['gate'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>逻辑门：把真值表做成电路<em>拨开关看输出</em></div>'+
      '<div class="w-b"><div class="w-ctl" id="gtCtl"></div>'+
      '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px" id="gtCircuit"></div>'+
      '<div id="gtTable"></div></div>'+
      '<div class="w-cap">门电路就是真值表的另一种写法。反相器（NOT）、与门（AND）、或门（OR）三种基本门，可以拼出所有布尔函数。</div>';
  },
  mount: function(el){
    var gates = [
      {k:'and', n:'与门 ∧', f:function(a,b){return a&&b;}, one:false},
      {k:'or',  n:'或门 ∨', f:function(a,b){return a||b;}, one:false},
      {k:'xor', n:'异或门 ⊕', f:function(a,b){return a!==b;}, one:false},
      {k:'nand',n:'与非 ↑', f:function(a,b){return !(a&&b);}, one:false},
      {k:'not', n:'非门 ¬', f:function(a){return !a;}, one:true}
    ];
    var cur='and', av=true, bv=false;
    function sw(v,label,change){
      return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px">'+
        '<button class="w-btn '+(v?'on':'')+'" data-sw="'+change+'" style="min-width:54px;font-family:var(--math);font-size:14px">'+(v?'1':'0')+'</button>'+
        '<span class="kv" style="color:var(--muted);font-size:11px">'+label+'</span></div>';
    }
    function draw(){
      $('#gtCtl',el).innerHTML = gates.map(function(g){
        return '<span class="chip'+(g.k===cur?' on':'')+'" data-k="'+g.k+'">'+g.n+'</span>';
      }).join('');
      var g = gates.filter(function(x){return x.k===cur;})[0];
      var out = g.one ? g.f(av) : g.f(av,bv);

      var wires = '<svg viewBox="0 0 120 90" style="width:120px;height:90px"><path d="M4 24H34M4 66H34" stroke="var(--line2)" stroke-width="2" fill="none"/>'+
        '<path d="M76 45H112" stroke="'+(out?'var(--accent)':'var(--line2)')+'" stroke-width="2" fill="none"/></svg>';
      if(g.one) wires = '<svg viewBox="0 0 120 90" style="width:120px;height:90px"><path d="M4 45H34" stroke="var(--line2)" stroke-width="2" fill="none"/>'+
        '<path d="M76 45H112" stroke="'+(out?'var(--accent)':'var(--line2)')+'" stroke-width="2" fill="none"/></svg>';

      $('#gtCircuit',el).innerHTML =
        '<div style="display:flex;flex-direction:column;gap:20px">'+
          sw(av,'A','a') + (g.one?'':'<div style="height:0"></div>'+sw(bv,'B','b'))+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:0">'+wires+
          '<div style="padding:14px 18px;border-radius:9px;border:1.5px solid var(--accent);background:var(--accent-soft);font-family:var(--math);font-size:20px;color:var(--accent);margin-left:-46px;margin-right:34px;position:relative;z-index:2">'+
          (g.one?'¬':'')+'</div></div>'+
        '<div style="display:flex;flex-direction:column;align-items:center;gap:5px">'+
          '<div style="width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--math);font-size:20px;font-weight:600;'+
          'background:'+(out?'var(--accent)':'var(--surface-2)')+';color:'+(out?'#fff':'var(--muted)')+';border:1.5px solid '+(out?'var(--accent)':'var(--line2)')+'">'+(out?1:0)+'</div>'+
          '<span class="kv" style="color:var(--muted);font-size:11px">输出</span></div>';

      var rows = g.one ? [[true],[false]] : [[true,true],[true,false],[false,true],[false,false]];
      $('#gtTable',el).innerHTML = '<table class="tt"><thead><tr><th>A</th>'+(g.one?'':'<th>B</th>')+'<th>输出</th></tr></thead><tbody>'+
        rows.map(function(r){
          var v = g.one?g.f(r[0]):g.f(r[0],r[1]);
          var hit = g.one ? (r[0]===av) : (r[0]===av && r[1]===bv);
          return '<tr'+(hit?' style="outline:2px solid var(--accent);outline-offset:-2px"':'')+'><td>'+(r[0]?'1':'0')+'</td>'+
            (g.one?'':'<td>'+(r[1]?'1':'0')+'</td>')+'<td class="'+(v?'res':'')+'">'+(v?'1':'0')+'</td></tr>';
        }).join('')+'</tbody></table>';
    }
    el.addEventListener('click', function(e){
      var c = e.target.closest('[data-k]'), s = e.target.closest('[data-sw]');
      if(c){ cur = c.getAttribute('data-k'); draw(); }
      if(s){ var w=s.getAttribute('data-sw'); if(w==='a') av=!av; else bv=!bv; draw(); }
    });
    draw();
  }
};

    {t:'warn', h:'<p>整章最容易翻车的就是蕴含 <m>p → q</m>。<b>前件为假时，蕴含式为真</b>，这不是约定俗成的怪癖，而是有实际含义的。</p><p>设想承诺：「如果明天下雨，我就带伞」。如果明天没下雨（前件假），我没带伞，你也不能说我违背了承诺——因为我从来没承诺过不下雨时也带伞。</p>'},

    {t:'p', h:'把 T/F 换成 1/0，联结词就变成了位运算：<m>∧</m> 是按位与，<m>∨</m> 是按位或，<m>⊕</m> 是按位异或，<m>¬</m> 是按位取反。所以逻辑表达式可以直接用来描述电路和掩码运算。'},

    {t:'exs', id:'1.1', items:[

},

{
  id:'1.2', title:'命题逻辑的应用',
  blocks:[
    {t:'lead', h:'符号不是拿来玩的。这一节看它在四个地方实际派上用场：翻译、规范说明、搜索、电路。'},
    {t:'h3', h:'语句翻译'},
    {t:'p', h:'翻译的关键是<b>抓准「且」「或」「如果」的边界</b>，尤其是中文里「或」有时是相容的（至少一个），有时是排他的（恰一个）。数学习惯上默认是相容或，除非明确写「要么…要么…」。'},
    {t:'table', head:['中文','逻辑式','备注'],
      rows:[
        ['p 但是 q','p ∧ q','「但是」在逻辑上就是「且」'],
        ['p 除非 q','¬q → p，即 p ∨ q','除非 q 成立，否则 p'],
        ['p 仅当 q','p → q','注意方向！不是 q → p'],
        ['p 当 q','q → p','「当」在后面，方向相反'],
        ['p 当且仅当 q','p ↔ q','双向'],
        ['p 的必要条件','p → q','q 是 p 的必要条件'],
        ['p 的充分条件','p → q','p 是 q 的充分条件']
      ]},
    {t:'warn', h:'<p>「p 仅当 q」译成 <m>p → q</m>，而「p 当 q」译成 <m>q → p</m>。两个字的差别，方向完全相反。</p><p>记忆：<b>「仅当」后面的条件是必要的</b>——p 成立就必须 q 成立，所以 p 推出 q。</p>'},
    {t:'h3', h:'系统规范说明'},
    {t:'p', h:'给软件写需求时，几条规范必须<b>彼此一致</b>：不能出现「无论变量取什么值，总有一条规范被违反」的情况。检验方法就是把它们写成合取式，看是否可满足。'},
    {t:'h3', h:'布尔搜索'},
    {t:'p', h:'搜索引擎的 <code>AND</code> / <code>OR</code> / <code>NOT</code> 就是联结词。「大学 AND (计算机 OR 软件) AND NOT 专科」这条查询可以直接写成一个逻辑表达式，再对每个网页求值。'},
    {t:'h3', h:'逻辑电路'},
    {t:'p', h:'每个联结词对应一个门：<m>¬</m> 是非门，<m>∧</m> 是与门，<m>∨</m> 是或门。多个门串起来就是复合命题的物理实现。第 8 章会把这件事讲透。'},

    {t:'ex', title:'例 1　骑士与骗子', q:'某岛上有两种人：骑士永远说真话，骗子永远说假话。你遇到 A、B 两人。A 说：「我们两人中至少有一个是骗子。」问 A、B 各是什么身份？',
      steps:[
        '设 <m>p</m> 表示「A 是骑士」，<m>q</m> 表示「B 是骑士」。A 的陈述是「A 是骗子或 B 是骗子」，即 <m>¬p ∨ ¬q</m>。',
        '若 A 是骑士（<m>p</m> 真），则他的陈述为真：<m>¬p ∨ ¬q</m> 真。因 <m>¬p</m> 假，故 <m>¬q</m> 必须真，即 B 是骗子。',
        '若 A 是骗子（<m>p</m> 假），则他的陈述为假：<m>¬p ∨ ¬q</m> 假。这要求 <m>¬p</m> 和 <m>¬q</m> 都假，即 <m>p</m> 真——与假设矛盾。',
        '所以 A 只能是骑士，B 是骗子。'
      ], ans:'A 是骑士，B 是骗子'},

    {t:'exs', id:'1.2', items:[
      {q:'把「你及格仅当你的分数不低于 60」翻译成逻辑式（p：你及格，q：分数不低于 60）。',
       hint:'「仅当」表示后者是前者的必要条件。',
       steps:['「p 仅当 q」= p 成立必须有 q 成立。','即 <m>p → q</m>。','注意不是 <m>q → p</m>：分数够了不一定及格（可能缺考）。'],
       ans:'<m>p → q</m>'},
      {q:'把「如果我复习了并且没生病，我就能通过考试」翻译成逻辑式并写出它的否定。',
       hint:'否定一个蕴含式：<m>¬(A → B) ≡ A ∧ ¬B</m>。',
       steps:['设 r：复习了，s：没生病，t：通过。原式为 <m>(r ∧ s) → t</m>。','否定：<m>¬((r ∧ s) → t) ≡ (r ∧ s) ∧ ¬t</m>。','翻译回去：「我复习了、没生病，但没通过考试。」'],
       ans:'原式 <m>(r ∧ s) → t</m>；否定为 <m>r ∧ s ∧ ¬t</m>'},
      {q:'某公司有四条规范：① 若系统升级则数据库备份；② 若数据库备份则暂停服务；③ 系统升级；④ 不暂停服务。这四条规范是否一致？',
       hint:'把它们写成合取式，看能否同时为真。',
       steps:['设 u：升级，b：备份，s：暂停服务。','规范为 <m>(u→b) ∧ (b→s) ∧ u ∧ ¬s</m>。','由 ③ <m>u</m> 真，配合 ① 得 <m>b</m> 真；配合 ② 得 <m>s</m> 真。','但 ④ 要求 <m>¬s</m> 真——矛盾。'],
       ans:'不一致（<m>s</m> 与 <m>¬s</m> 冲突）'}
    ]}
  ]
},

{
  id:'1.3', title:'命题等价式',
  blocks:[
    {t:'lead', h:'两个复合命题如果在<b>所有</b>赋值下真值都相同，就称它们等价，记作 <m>≡</m>。这一节是一张表加一个用途：把复杂的式子化简成好懂的形式。'},
    {t:'table', head:['名称','恒等式'],
      rows:[
        ['幂等律','<m>p ∨ p ≡ p</m>　　<m>p ∧ p ≡ p</m>'],
        ['支配律','<m>p ∨ T ≡ T</m>　　<m>p ∧ F ≡ F</m>'],
        ['同一律','<m>p ∧ T ≡ p</m>　　<m>p ∨ F ≡ p</m>'],
        ['双重否定','<m>¬(¬p) ≡ p</m>'],
        ['交换律','<m>p ∨ q ≡ q ∨ p</m>　　<m>p ∧ q ≡ q ∧ p</m>'],
        ['结合律','<m>(p∨q)∨r ≡ p∨(q∨r)</m>'],
        ['分配律','<m>p∨(q∧r) ≡ (p∨q)∧(p∨r)</m>'],
        ['德摩根律','<m>¬(p∧q) ≡ ¬p∨¬q</m>　　<m>¬(p∨q) ≡ ¬p∧¬q</m>'],
        ['吸收律','<m>p∨(p∧q) ≡ p</m>　　<m>p∧(p∨q) ≡ p</m>'],
        ['否定律','<m>p∨¬p ≡ T</m>　　<m>p∧¬p ≡ F</m>'],
        ['蕴含等价','<m>p→q ≡ ¬p∨q</m>'],
        ['逆否','<m>p→q ≡ ¬q→¬p</m>'],
        ['双条件','<m>p↔q ≡ (p→q)∧(q→p)</m>'],
        ['归谬','<m>p→q ≡ ¬p∨q</m>（同蕴含）']
      ]},
    {t:'tip', h:'<p>这张表不用死记，但<b>德摩根律和蕴含等价必须条件反射</b>——它们出现在后面每一章的证明里。</p><p>德摩根律的直觉：把「并非（都要）」变成「至少一个不要」。<m>¬(A ∧ B) ≡ ¬A ∨ ¬B</m>。</p>'},
    {t:'def', lb:'可满足性', h:'<p>一个复合命题是<b>可满足的</b>，如果存在一种赋值使它为真；如果所有赋值下都为假，称它为<b>不可满足的</b>（永假式）。</p><p>判断两个命题是否等价，等价于判断 <m>p ↔ q</m> 是否永真，也等价于 <m>¬(p↔q)</m> 是否不可满足。</p>'},

    {t:'ex', title:'例 1　用恒等式化简', q:'证明 <m>¬(p → q) ≡ p ∧ ¬q</m>。',
      steps:[
        '先把蕴含展开：<m>p → q ≡ ¬p ∨ q</m>。',
        '所以 <m>¬(p → q) ≡ ¬(¬p ∨ q)</m>。',
        '对括号用德摩根律：<m>¬(¬p ∨ q) ≡ ¬(¬p) ∧ ¬q</m>。',
        '双重否定：<m>p ∧ ¬q</m>。'
      ], ans:'得证'},

    {t:'exs', id:'1.3', items:[
      {q:'用恒等式证明 <m>p → (q → r) ≡ (p ∧ q) → r</m>。',
       hint:'两边都展开成只有 ¬ 和 ∨ 的形式。',
       steps:['左边：<m>p → (q→r) ≡ ¬p ∨ (¬q ∨ r)</m>。','右边：<m>(p∧q) → r ≡ ¬(p∧q) ∨ r ≡ (¬p ∨ ¬q) ∨ r</m>。','两者都等于 <m>¬p ∨ ¬q ∨ r</m>（结合律），所以等价。'],
       ans:'得证'},
      {q:'化简 <m>(p ∧ q) ∨ (p ∧ ¬q)</m>。',
       hint:'提取公因子 p。',
       steps:['用分配律反向：<m>p ∧ (q ∨ ¬q)</m>。','由否定律 <m>q ∨ ¬q ≡ T</m>。','由同一律 <m>p ∧ T ≡ p</m>。'],
       ans:'<m>p</m>'},
      {q:'判断 <m>(p → q) ∧ (p → ¬q)</m> 是否可满足。',
       hint:'先化简，再看它和什么等价。',
       steps:['展开：<m>(¬p ∨ q) ∧ (¬p ∨ ¬q)</m>。','分配：<m>¬p ∨ (q ∧ ¬q)</m>。','<m>q ∧ ¬q ≡ F</m>，所以得 <m>¬p ∨ F ≡ ¬p</m>。','当 p 为假时它为真，所以可满足。'],
       ans:'可满足（等价于 <m>¬p</m>）'}
    ]}
  ]
},

{
  id:'1.4', title:'谓词和量词',
  blocks:[
    {t:'lead', h:'命题逻辑有个短板：<b>它拆不开句子内部的结构</b>。「所有人都会死」「苏格拉底是人」「苏格拉底会死」在这套语言里是三个无关的原子，推不出关系。谓词逻辑就是来补这个洞的。'},
    {t:'def', lb:'谓词', h:'<p>含变量的陈述句 <m>P(x)</m> 称为<b>谓词</b>。它不是命题——因为没给 <m>x</m> 具体值时无法判断真假。一旦给 <m>x</m> 赋值，它就变成命题。</p>'},
    {t:'def', lb:'量词', h:'<p><b>全称量词</b> <m>∀x P(x)</m>：论域中<b>所有</b> <m>x</m> 都使 <m>P(x)</m> 成立。</p><p><b>存在量词</b> <m>∃x P(x)</m>：论域中<b>至少存在一个</b> <m>x</m> 使 <m>P(x)</m> 成立。</p>'},
    {t:'p', h:'当论域是有限集 <m>{x<sub>1</sub>, …, x<sub>n</sub>}</m> 时，量词其实就是合取和析取：<div class="f" style="margin:8px 0">∀x P(x) ≡ P(x<sub>1</sub>) ∧ ⋯ ∧ P(x<sub>n</sub>)　　∃x P(x) ≡ P(x<sub>1</sub>) ∨ ⋯ ∨ P(x<sub>n</sub>)</div>把这句话记住，量词的一切性质都能从联结词推出来。'},
    {t:'w', id:'quant'},
    {t:'thm', lb:'量词的否定（德摩根）', h:'<div class="f" style="margin:4px 0">¬∀x P(x) ≡ ∃x ¬P(x)　　¬∃x P(x) ≡ ∀x ¬P(x)</div><p>否定一个量词，就是把量词翻面，再把里面的谓词取反。</p>'},
    {t:'warn', h:'<p>「否定」不等于「相反的谓词」。<m>¬∀x P(x)</m> 不是 <m>∀x ¬P(x)</m>，后者强得多。</p><p>「不是所有人都及格」≠「所有人都没及格」。前者只要求「有人没及格」，后者要求「一个都没及格」。</p>'},

    {t:'ex', title:'例 1　量词的否定', q:'写出 <m>∀x (x<sup>2</sup> &gt; x)</m> 的否定，并判断原式真假（论域为实数）。',
      steps:['否定：<m>∃x (x<sup>2</sup> ≤ x)</m>。','原式在实数上为假——取 <m>x = 0.5</m>，<m>0.25 &gt; 0.5</m> 不成立。','这也说明否定式 <m>∃x(x<sup>2</sup> ≤ x)</m> 为真，与 x = 0.5 这个见证一致。'],
      ans:'否定为 <m>∃x(x<sup>2</sup> ≤ x)</m>；原式假'},

    {t:'exs', id:'1.4', items:[
      {q:'用谓词逻辑表达「每个学生都有一台电脑」（S(x)：x 是学生，C(x)：x 有电脑）。',
       hint:'「每个…都有」是 ∀ 后接 ∃。',
       steps:['对每个对象：若它是学生，则它有一台电脑。','<m>∀x (S(x) → C(x))</m>。','不能用 <m>∀x(S(x) ∧ C(x))</m>——那表示「所有人都是学生且都有电脑」。'],
       ans:'<m>∀x (S(x) → C(x))</m>'},
      {q:'写出 <m>∃x (P(x) ∧ Q(x))</m> 的否定。',
       hint:'先翻量词，再对内部用德摩根。',
       steps:['<m>¬∃x(P(x) ∧ Q(x)) ≡ ∀x ¬(P(x) ∧ Q(x))</m>。','<m>¬(P∧Q) ≡ ¬P ∨ ¬Q</m>。'],
       ans:'<m>∀x (¬P(x) ∨ ¬Q(x))</m>，也可写成 <m>∀x (P(x) → ¬Q(x))</m>'},
      {q:'论域是整数，判断 <m>∃x (x<sup>2</sup> = 2)</m> 的真值。',
       hint:'想想有没有整数的平方等于 2。',
       steps:['<m>1<sup>2</sup> = 1 &lt; 2</m>，<m>2<sup>2</sup> = 4 &gt; 2</m>。','整数中不存在 x 使 <m>x<sup>2</sup> = 2</m>（<m>√2</m> 是无理数）。'],
       ans:'假（F）'}
    ]}
  ]
},

{
  id:'1.5', title:'嵌套量词',
  blocks:[
    {t:'lead', h:'两个量词叠在一起时，<b>顺序会改变意思</b>。这不是数学上的细枝末节，而是日常语言里也真实存在的差别。'},
    {t:'p', h:'对比这两句：'},
    {t:'grid', items:[
      {t:'∀x ∃y　每人都有一个母亲', h:'对每个人，都存在一个人是他的母亲。<b>不同的人可以对应不同的 y</b>。这是真的。'},
      {t:'∃y ∀x　存在一个人是所有人的母亲', h:'存在一个人，对所有人都成立——同一个人要当所有人的母亲。<b>这是假的</b>。'}
    ]},
    {t:'w', id:'nestq'},
    {t:'thm', lb:'量词顺序的基本关系', h:'<div class="f" style="margin:4px 0">∃y ∀x P(x,y)　⟹　∀x ∃y P(x,y)</div><p>箭头是单向的，反过来不成立。前者是「有一把万能钥匙」，后者只是「每扇门都有一把能开的钥匙」。</p>'},
    {t:'p', h:'否定嵌套量词时，<b>逐个翻面，从左到右扫一遍</b>：<div class="f" style="margin:8px 0">¬∀x∃y P(x,y) ≡ ∃x∀y ¬P(x,y)</div>'},

    {t:'ex', title:'例 1　翻译', q:'用 <m>L(x,y)</m> 表示「x 喜欢 y」，论域是所有人。翻译「每个人都被某个人喜欢」和「存在一个人被所有人喜欢」。',
      steps:[
        '「每个人都被某个人喜欢」：对每个 x，存在 y 使 y 喜欢 x。即 <m>∀x ∃y L(y,x)</m>（注意 L 的参数顺序：y 喜欢 x）。',
        '「存在一个人被所有人喜欢」：存在 x，对所有 y，y 喜欢 x。即 <m>∃x ∀y L(y,x)</m>。',
        '后者的要求明显更强，它蕴含前者，反之不成立。'
      ], ans:'<m>∀x∃y L(y,x)</m>　和　<m>∃x∀y L(y,x)</m>'},

    {t:'exs', id:'1.5', items:[
      {q:'写出 <m>∀x∃y (x + y = 0)</m> 的否定（论域为实数），并判断原式真假。',
       hint:'否定时量词逐个翻面。',
       steps:['否定：<m>∃x∀y (x + y ≠ 0)</m>。','原式为真——对任意 x，取 y = −x 即可。','所以其否定为假：不存在某个 x 使得所有 y 都满足 x + y ≠ 0。'],
       ans:'否定为 <m>∃x∀y(x+y≠0)</m>；原式为真'},
      {q:'判断 <m>∃y∀x (x + y = 0)</m> 的真假（论域为实数）。',
       hint:'是否存在一个固定的 y，对所有 x 都使 x + y = 0？',
       steps:['若有这样的 y，则对 x = 0 要求 y = 0，对 x = 1 要求 y = −1。','同一个 y 无法同时满足，矛盾。'],
       ans:'假'},
      {q:'把「没有最大的整数」用法则表达出来。',
       hint:'「没有最大的」= 不是「存在一个最大的」= …',
       steps:['「存在最大的整数」：<m>∃x∀y (y ≤ x)</m>。','否定：<m>∀x∃y (y &gt; x)</m>。'],
       ans:'<m>∀x∃y (y &gt; x)</m>'}
    ]}
  ]
},

{
  id:'1.6', title:'推理规则',
  blocks:[
    {t:'lead', h:'证明是由已知推出未知的过程。<b>推理规则</b>就是允许你走的每一步——它们是合法的「变形动作」，用错了整段证明就作废。'},
    {t:'table', head:['规则','形式','中文'],
      rows:[
        ['假言推理（肯定前件）','<m>p，p→q　⊢　q</m>','如果 p 成立且 p 蕴含 q，则 q 成立'],
        ['取拒式（否定后件）','<m>¬q，p→q　⊢　¬p</m>','q 不成立，则 p 也不能成立'],
        ['假言三段论','<m>p→q，q→r　⊢　p→r</m>','蕴含可以「接龙」'],
        ['析取三段论','<m>p∨q，¬p　⊢　q</m>','排除一个，剩下那个'],
        ['附加律','<m>p　⊢　p∨q</m>','可以往弱的方向放宽'],
        ['化简律','<m>p∧q　⊢　p</m>','合取可以拆'],
        ['合取律','<m>p，q　⊢　p∧q</m>','两个都能推出，就能合并'],
        ['消解律','<m>p∨q，¬p∨r　⊢　q∨r</m>','消去互补的文字']
      ]},
    {t:'warn', h:'<p><b>两个经典谬误</b>，长得像假言推理但完全无效：</p><ul><li><b>肯定后件</b>：<m>q，p→q ⊬ p</m>。例：「下雨则地湿；地湿了；所以下雨了」——错，也可能是洒水车。</li><li><b>否定前件</b>：<m>¬p，p→q ⊬ ¬q</m>。例：「不下雨则地不湿；现在没下雨；所以地不湿」——错，理由同上。</li></ul>'},
    {t:'p', h:'<b>消解律</b>值得单独记：它是自动定理证明的基础。把两个子句里互补的文字（<m>p</m> 和 <m>¬p</m>）消掉，剩下的合并。反复做，如果最后消出空子句，就说明原式不可满足。'},

    {t:'ex', title:'例 1　拼一条证明链', q:'已知：① 如果今天下雨，篮球赛就取消；② 如果篮球赛取消，我们就去看电影；③ 今天下雨。证明：我们去看电影。',
      steps:[
        '设 r：下雨，c：取消，m：看电影。前提为 <m>r→c</m>、<m>c→m</m>、<m>r</m>。',
        '由 ① 和 ③ 用假言推理：<m>c</m>。',
        '由 ② 和 <m>c</m> 用假言推理：<m>m</m>。',
        '（也可以先用假言三段论得 <m>r→m</m>，再配 ③ 得 <m>m</m>。）'
      ], ans:'得证'},

    {t:'exs', id:'1.6', items:[
      {q:'从前提「如果我学习，我就通过」「我没通过」，能推出什么？用了哪条规则？',
       hint:'后件被否定。',
       steps:['设 s：学习，p：通过。前提：<m>s→p</m>，<m>¬p</m>。','这正是取拒式的形式：<m>¬q, p→q ⊢ ¬p</m>，对应 <m>¬p, s→p ⊢ ¬s</m>。'],
       ans:'推出「我没学习」，用的是取拒式'},
      {q:'判断这个推理是否有效：「如果他是党员，他就年满 18 岁；他年满 18 岁；所以他是党员。」',
       hint:'检查是不是肯定后件。',
       steps:['形式为 <m>p→q, q ⊢ p</m>。','这是肯定后件谬误，不有效。','反例：一个 20 岁的非党员，前提都为真但结论为假。'],
       ans:'无效（肯定后件谬误）'},
      {q:'用消解律从 <m>(p ∨ q)</m> 和 <m>(¬p ∨ r)</m> 推出什么？',
       hint:'找互补的文字消掉。',
       steps:['两个子句中 <m>p</m> 与 <m>¬p</m> 互补。','消去后把剩余文字合并：<m>q ∨ r</m>。'],
       ans:'<m>q ∨ r</m>'}
    ]}
  ]
},

{
  id:'1.7', title:'证明导论',
  blocks:[
    {t:'lead', h:'定理不是「看起来对的句子」，而是<b>被证明过的命题</b>。这一节讲三种最基本的证明骨架。'},
    {t:'def', lb:'术语', h:'<ul style="margin:6px 0 0"><li><b>定理</b>：能被证明为真的命题。</li><li><b>引理</b>：为了证明定理而先证的小结论。</li><li><b>推论</b>：从定理直接推出的小结论。</li><li><b>猜想</b>：尚未被证明或推翻的命题。</li></ul>'},
    {t:'h3', h:'直接证明'},
    {t:'p', h:'要证 <m>p → q</m>，就假设 <m>p</m> 为真，用定义、已知定理、代数变形，一路推到 <m>q</m>。这是最自然的方式，能用就用它。'},
    {t:'h3', h:'反证法'},
    {t:'p', h:'要证命题 <m>P</m>，假设 <m>¬P</m>，推出矛盾（推出 <m>r ∧ ¬r</m> 这样的式子）。既然 <m>¬P</m> 不可能成立，<m>P</m> 就只能为真。'},
    {t:'h3', h:'归谬法'},
    {t:'p', h:'要证 <m>p → q</m>，假设 <m>p ∧ ¬q</m>（前件真而后件假），推出矛盾。它本质上是反证法用在蕴含式上的特化版本。'},
    {t:'tip', h:'<p><b>怎么选？</b>看到「是无理数」「不存在」「无穷多个」这类<b>否定性</b>结论，优先反证；看到「若…则…」的<b>结构性</b>结论，优先直接证明。</p>'},

    {t:'ex', title:'例 1　√2 是无理数', q:'证明 <m>√2</m> 不是有理数。',
      steps:[
        '反证：假设 <m>√2</m> 是有理数，则可写成最简分数 <m>√2 = a/b</m>，其中 <m>a, b</m> 为整数、<m>b ≠ 0</m>，且 <m>a, b</m> 互素。',
        '两边平方：<m>2b<sup>2</sup> = a<sup>2</sup></m>。所以 <m>a<sup>2</sup></m> 是偶数，推出 <m>a</m> 是偶数。',
        '设 <m>a = 2c</m>，代入得 <m>2b<sup>2</sup> = 4c<sup>2</sup></m>，即 <m>b<sup>2</sup> = 2c<sup>2</sup></m>。同理 <m>b</m> 也是偶数。',
        '<m>a</m> 和 <m>b</m> 都是偶数，与「互素」矛盾。故假设不成立。'
      ], ans:'<m>√2</m> 是无理数'},

    {t:'exs', id:'1.7', items:[
      {q:'用直接证明法证明：若 n 是奇数，则 <m>n<sup>2</sup></m> 也是奇数。',
       hint:'奇数写成 <m>2k+1</m>。',
       steps:['设 <m>n = 2k+1</m>（k 为整数）。','<m>n<sup>2</sup> = 4k<sup>2</sup>+4k+1 = 2(2k<sup>2</sup>+2k)+1</m>。','括号内是整数，所以 <m>n<sup>2</sup></m> 形如 <m>2m+1</m>，是奇数。'],
       ans:'得证'},
      {q:'用反证法证明：不存在最大的素数。',
       hint:'假设存在，把它们乘起来再加 1。',
       steps:['假设素数只有有限个：<m>p<sub>1</sub>, …, p<sub>n</sub></m>。','构造 <m>N = p<sub>1</sub>p<sub>2</sub>⋯p<sub>n</sub> + 1</m>。','<m>N</m> 被任何 <m>p<sub>i</sub></m> 除都余 1，所以它没有素因子。','但任何大于 1 的整数都有素因子，矛盾。'],
       ans:'得证'},
      {q:'证明：若 <m>3n + 2</m> 是奇数，则 <m>n</m> 是奇数。',
       hint:'直接证明不好走时，试试逆否命题。',
       steps:['用逆否：证明「若 n 是偶数，则 <m>3n+2</m> 是偶数」。','设 <m>n = 2k</m>，则 <m>3n+2 = 6k+2 = 2(3k+1)</m>，是偶数。','逆否命题与原命题等价，故原命题成立。'],
       ans:'得证（用逆否命题）'}
    ]}
  ]
},

{
  id:'1.8', title:'证明的方法和策略',
  blocks:[
    {t:'lead', h:'证明题没有万能公式，但有几套常用的「起手式」。看到题目的形状，就知道该从哪儿下手。'},
    {t:'table', head:['情形','策略','典型信号'],
      rows:[
        ['论域很小、有限','穷举证明','「对 1 到 10 的所有整数」'],
        ['结论适用于多种情况','分情形证明','绝对值、奇偶、正负'],
        ['结论是「存在」','构造性证明（给出例子）','「存在一个…使得」'],
        ['存在但不好构造','非构造性证明','用鸽巢或中间值定理'],
        ['结论是「唯一」','先证存在，再证任意两个相等','「恰有一个」'],
        ['怀疑命题是假的','找一个反例','「对所有…」'],
        ['结论前后对称','不妨设…','不等式、排序问题']
      ]},
    {t:'p', h:'<b>分情形证明</b>的关键是覆盖完整：所有情况都要说到，不能漏。常见分法是按奇偶（2 种）、按正负零（3 种）、按除以 3 的余数（3 种）。'},
    {t:'p', h:'<b>唯一性证明</b>的标准套路是两步：先<b>存在</b>（构造或论证有一个），再<b>唯一</b>（假设有两个，证明它们相等）。两步缺一不可。'},
    {t:'warn', h:'<p>证明里最忌讳的一句话是「显然」。它往往意味着两种情况：要么真的显然（那就不用写这句），要么你其实没想清楚。</p><p>老师批改时看到「显然」，第一反应是划掉并扣分。</p>'},

    {t:'ex', title:'例 1　分情形证明', q:'证明：对任意整数 n，<m>n<sup>2</sup> + n</m> 一定是偶数。',
      steps:[
        '分两种情形：n 为偶数，n 为奇数。',
        '情形 1：设 <m>n = 2k</m>，则 <m>n<sup>2</sup>+n = 4k<sup>2</sup>+2k = 2(2k<sup>2</sup>+k)</m>，是偶数。',
        '情形 2：设 <m>n = 2k+1</m>，则 <m>n<sup>2</sup>+n = n(n+1) = (2k+1)(2k+2) = 2(2k+1)(k+1)</m>，也是偶数。',
        '两种情形覆盖了所有整数，故命题成立。'
      ], ans:'得证'},
    {t:'tip', h:'<p>另一个更快的写法：<m>n<sup>2</sup>+n = n(n+1)</m> 是连续两个整数之积，其中必有一个偶数，所以乘积是偶数。这属于「换一个角度看」，比分类讨论省事得多。</p><p>做题时不妨先停 10 秒，问自己：<b>这个式子能不能改写成有组合意义的形式？</b></p>'},

    {t:'exs', id:'1.8', items:[
      {q:'证明：任意三个连续整数之积能被 6 整除。',
       hint:'6 = 2 × 3，分别论证能被 2 和 3 整除。',
       steps:['设三数为 <m>n, n+1, n+2</m>。','三个连续整数中必有一个偶数，所以乘积能被 2 整除。','三个连续整数中必有一个是 3 的倍数，所以乘积能被 3 整除。','2 和 3 互素，故乘积能被 6 整除。'],
       ans:'得证'},
      {q:'证明方程 <m>x<sup>3</sup> + x − 1 = 0</m> 恰有一个实数根。',
       hint:'存在性用介值定理，唯一性用单调性。',
       steps:['存在：设 <m>f(x)=x<sup>3</sup>+x−1</m>，<m>f(0)=−1 &lt; 0</m>，<m>f(1)=1 &gt; 0</m>，由连续性存在根。','唯一：<m>f\'(x) = 3x<sup>2</sup>+1 &gt; 0</m> 恒成立，<m>f</m> 严格递增，所以至多一个根。','两者合起来：恰有一个。'],
       ans:'得证'},
      {q:'判断命题「对所有正整数 n，<m>n<sup>2</sup> − n + 41</m> 都是素数」是否成立。',
       hint:'试几个值，别急着证。',
       steps:['n=1 得 41，素数；n=2 得 43，素数；……前若干项确实都是素数。','取 <m>n = 41</m>：<m>41<sup>2</sup> − 41 + 41 = 41<sup>2</sup> = 1681 = 41 × 41</m>。','不是素数，命题被推翻。'],
       ans:'不成立，反例 n = 41'}
    ]}
  ]
}

]};

CH[2] = {
  title: '基本结构：集合、函数、序列、求和与矩阵',
  short: '基本结构',
  en: 'Basic Structures',
  intro: '这一章是全书<b>词汇量最大</b>的一章。集合、函数、序列、求和、矩阵——每一个后面都会反复出现，但都只是「用一下」。所以别陷进去，重点是：符号认得、定义说得清、几个关键区分（单射 / 满射、可数 / 不可数）不含糊。',
  sections: [

{
  id:'2.1', title:'集合',
  blocks:[
    {t:'lead', h:'集合是数学里最基础的对象，基础到很难再往下定义。只能这样描述：<b>一堆确定的东西凑在一起</b>。'},
    {t:'def', lb:'集合', h:'<p><b>集合</b>是对象的无序聚集。对象 <m>a</m> 在集合 <m>A</m> 中记作 <m>a ∈ A</m>，不在其中记作 <m>a ∉ A</m>。</p><p>关键点在于「<b>无序</b>」和「<b>不重复</b>」：<m>{1,2,3}</m> 和 <m>{3,1,2}</m> 是同一个集合，<m>{1,1,2}</m> 也还是 <m>{1,2}</m>。</p>'},
    {t:'p', h:'描述一个集合有两种写法：<b>列举法</b> <m>{1,3,5,7}</m>，和<b>集合构造器</b> <m>{x | x 是小于 10 的正奇数}</m>。后者在元素多或无穷时更常用。'},
    {t:'table', head:['记号','含义'],
      rows:[
        ['<m>ℕ = {0,1,2,…}</m>','自然数集'],
        ['<m>ℤ = {…,−1,0,1,…}</m>','整数集'],
        ['<m>ℤ<sup>+</sup> = {1,2,3,…}</m>','正整数集'],
        ['<m>ℚ</m>','有理数集'],
        ['<m>ℝ</m>','实数集'],
        ['<m>∅</m>','空集（不含任何元素）']
      ]},
    {t:'warn', h:'<p><m>∅</m> 和 <m>{∅}</m> 完全不同。前者一个元素都没有，后者有<b>一个</b>元素（那个元素是空集）。所以 <m>|∅| = 0</m> 而 <m>|{∅}| = 1</m>。</p><p>同理，<m>∅ ∈ {∅}</m> 为真，而 <m>∅ ∈ ∅</m> 为假。</p>'},
    {t:'def', lb:'子集与相等', h:'<p><m>A ⊆ B</m> 表示 <m>A</m> 的每个元素都在 <m>B</m> 中。两个集合相等当且仅当 <m>A ⊆ B</m> 且 <m>B ⊆ A</m>——这是证明集合相等最常用的方法。</p>'},
    {t:'def', lb:'幂集', h:'<p><m>A</m> 的<b>幂集</b> <m>P(A)</m> 是 <m>A</m> 所有子集构成的集合。若 <m>|A| = n</m>，则 <m>|P(A)| = 2<sup>n</sup></m>。</p>'},
    {t:'p', h:'为什么是 <m>2<sup>n</sup></m>？因为构造一个子集，就是对每个元素做一次「选或不选」的二元决定，<m>n</m> 个元素就有 <m>2<sup>n</sup></m> 种决定方式。这也解释了第 3 章那个恒等式 <m>ΣC(n,k) = 2<sup>n</sup></m>——按子集大小分类数，结果当然一样。'},
    {t:'def', lb:'笛卡尔积', h:'<p><m>A × B = {(a,b) | a ∈ A, b ∈ B}</m>，是有序对的集合。注意 <m>(a,b) ≠ (b,a)</m>，而且 <m>|A × B| = |A| · |B|</m>。</p>'},

    {t:'exs', id:'2.1', items:[
      {q:'设 <m>A = {1, 2, 3}</m>，写出 <m>P(A)</m> 并验证元素个数。',
       hint:'按大小从 0 到 3 依次列出。',
       steps:['0 个元素：<m>∅</m>。','1 个元素：<m>{1}, {2}, {3}</m>。','2 个元素：<m>{1,2}, {1,3}, {2,3}</m>。','3 个元素：<m>{1,2,3}</m>。'],
       ans:'共 <m>1+3+3+1 = 8 = 2<sup>3</sup></m> 个'},
      {q:'判断对错：① <m>∅ ⊆ {1,2}</m>；② <m>∅ ∈ {1,2}</m>；③ <m>{1} ⊆ {1,{1}}</m>；④ <m>{1} ∈ {1,{1}}</m>。',
       hint:'区分「是元素」和「是子集」。',
       steps:['① 对，空集是任何集合的子集。','② 错，{1,2} 的元素只有 1 和 2。','③ 对，1 属于 {1,{1}}。','④ 对，{1} 确实是 {1,{1}} 的一个元素。'],
       ans:'① 对　② 错　③ 对　④ 对'},
      {q:'求 <m>|P(∅)|</m> 和 <m>|P(P(∅))|</m>。',
       hint:'<m>|P(A)| = 2<sup>|A|</sup></m>。',
       steps:['<m>|∅| = 0</m>，所以 <m>|P(∅)| = 2<sup>0</sup> = 1</m>（即 <m>{∅}</m>）。','<m>|P(∅)| = 1</m>，所以 <m>|P(P(∅))| = 2<sup>1</sup> = 2</m>。'],
       ans:'1 和 2'}
    ]}
  ]
},

{
  id:'2.2', title:'集合运算',
  blocks:[
    {t:'lead', h:'并、交、差、补——四个运算，配一张文氏图，基本就够了。真正要练的是把文字描述翻译成集合表达式。'},
    {t:'def', lb:'四种基本运算', h:'<ul style="margin:6px 0 0"><li><b>并集</b> <m>A ∪ B = {x | x ∈ A 或 x ∈ B}</m></li><li><b>交集</b> <m>A ∩ B = {x | x ∈ A 且 x ∈ B}</m></li><li><b>差集</b> <m>A − B = {x | x ∈ A 且 x ∉ B}</m></li><li><b>补集</b> <m>Ā = {x ∈ U | x ∉ A}</m>（依赖全集 <m>U</m>）</li></ul>'},
    {t:'w', id:'venn'},
    {t:'thm', lb:'集合恒等式', h:'<div style="line-height:2.2"><m>A ∪ B = B ∪ A</m>，<m>A ∩ B = B ∩ A</m>（交换）<br><m>A ∪ (B ∪ C) = (A ∪ B) ∪ C</m>（结合）<br><m>A ∩ (B ∪ C) = (A∩B) ∪ (A∩C)</m>（分配）<br><m><span style="text-decoration:overline">A ∪ B</span> = Ā ∩ B̄</m>，<m><span style="text-decoration:overline">A ∩ B</span> = Ā ∪ B̄</m>（德摩根）<br><m>A ∪ (A ∩ B) = A</m>（吸收）</div>'},
    {t:'tip', h:'<p>集合恒等式和命题逻辑的恒等式是<b>一一对应</b>的：<m>∪ ↔ ∨</m>，<m>∩ ↔ ∧</m>，<m>补 ↔ ¬</m>，<m>U ↔ T</m>，<m>∅ ↔ F</m>。</p><p>所以第 1 章那张表可以直接搬过来用，一个字都不用改。</p>'},
    {t:'def', lb:'对称差', h:'<p><m>A ⊕ B = (A − B) ∪ (B − A)</m>，即「恰好属于其中一个」的元素。</p><p>它对应逻辑里的异或，也对应「只在一个集合里出现」的那两块。</p>'},

    {t:'exs', id:'2.2', items:[
      {q:'设 <m>U = {1,…,10}</m>，<m>A = {1,2,3,4,5}</m>，<m>B = {4,5,6,7}</m>。求 <m>A ∪ B</m>、<m>A ∩ B</m>、<m>A − B</m>、<m>Ā</m>。',
       hint:'逐个按定义挑元素。',
       steps:['并：<m>{1,2,3,4,5,6,7}</m>。','交：<m>{4,5}</m>。','差：<m>{1,2,3}</m>。','补：<m>{6,7,8,9,10}</m>。'],
       ans:'见解析'},
      {q:'证明 <m>A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)</m>。',
       hint:'用「互相包含」法，或逐元素论证。',
       steps:['取 <m>x ∈ A ∩ (B∪C)</m>，则 <m>x ∈ A</m> 且（<m>x ∈ B</m> 或 <m>x ∈ C</m>）。','若 <m>x ∈ B</m>，则 <m>x ∈ A∩B</m>；若 <m>x ∈ C</m>，则 <m>x ∈ A∩C</m>。','无论如何 <m>x ∈ (A∩B) ∪ (A∩C)</m>，得 <m>⊆</m>。','反过来同理，得 <m>⊇</m>，故相等。'],
       ans:'得证'},
      {q:'化简 <m>(A ∪ B) ∩ (A ∪ B̄)</m>。',
       hint:'反过来用分配律，把 A 提出来。',
       steps:['<m>(A∪B) ∩ (A∪B̄) = A ∪ (B ∩ B̄)</m>。','<m>B ∩ B̄ = ∅</m>。','<m>A ∪ ∅ = A</m>。'],
       ans:'<m>A</m>'}
    ]}
  ]
},

{
  id:'2.3', title:'函数',
  blocks:[
    {t:'lead', h:'函数的定义里有两个「每个」，这两个字是后面一切讨论的根基。'},
    {t:'def', lb:'函数', h:'<p>从 <m>A</m> 到 <m>B</m> 的<b>函数</b> <m>f: A → B</m> 是一种对应关系，满足：<b>对 <m>A</m> 中的每个元素，都恰好对应 <m>B</m> 中的一个元素</b>。</p><p>「每个」保证没有遗漏，「恰好一个」保证不会一对应多。</p>'},
    {t:'p', h:'所以「<m>f(x) = ±√x</m>」不是函数（一个 x 对应两个值），而「<m>f(x) = 1/x</m>」在 <m>ℝ → ℝ</m> 上也不是函数（<m>x=0</m> 没有对应）。'},
    {t:'def', lb:'三种特殊性', h:'<ul style="margin:6px 0 0"><li><b>单射</b>（injective）：不同的输入给出不同的输出。<m>f(a)=f(b) ⟹ a=b</m>。</li><li><b>满射</b>（surjective）：<m>B</m> 中每个元素都被指到。</li><li><b>双射</b>（bijective）：既单射又满射。</li></ul>'},
    {t:'w', id:'inject'},
    {t:'thm', lb:'可逆的充要条件', h:'<p><m>f</m> 有反函数 <m>f<sup>−1</sup></m> 当且仅当 <m>f</m> 是<b>双射</b>。</p><p>单射保证反函数不会「一对多」，满射保证反函数的定义域覆盖整个 <m>B</m>。缺一个都补不上。</p>'},
    {t:'p', h:'<b>复合函数</b> <m>(f ∘ g)(x) = f(g(x))</m>，先作用 <m>g</m> 再作用 <m>f</m>。注意顺序——<m>f ∘ g</m> 里 <m>g</m> 先算，这和写法的左右顺序是反的，很多人第一次会搞错。'},

    {t:'exs', id:'2.3', items:[
      {q:'判断 <m>f: ℤ → ℤ</m>，<m>f(n) = 2n</m> 是单射还是满射？',
       hint:'看 <m>ℤ</m> 里的奇数有没有被指到。',
       steps:['单射：若 <m>2a = 2b</m>，则 <m>a = b</m>，所以是单射。','满射：3 是整数，但不存在整数 n 使 <m>2n = 3</m>，所以不是满射。','因此不是双射，没有反函数（在 <m>ℤ → ℤ</m> 上）。'],
       ans:'单射但不是满射'},
      {q:'设 <m>f(x) = x + 1</m>，<m>g(x) = x<sup>2</sup></m>，求 <m>(f ∘ g)(x)</m> 和 <m>(g ∘ f)(x)</m>。',
       hint:'注意谁先作用。',
       steps:['<m>(f∘g)(x) = f(g(x)) = f(x<sup>2</sup>) = x<sup>2</sup>+1</m>。','<m>(g∘f)(x) = g(f(x)) = g(x+1) = (x+1)<sup>2</sup></m>。','两者不同，说明复合不满足交换律。'],
       ans:'<m>x<sup>2</sup>+1</m>　和　<m>(x+1)<sup>2</sup></m>'},
      {q:'求 <m>f(x) = 3x − 5</m> 的反函数。',
       hint:'令 <m>y = 3x−5</m>，解出 x。',
       steps:['<m>y = 3x − 5</m>。','<m>x = (y+5)/3</m>。','所以 <m>f<sup>−1</sup>(y) = (y+5)/3</m>，即 <m>f<sup>−1</sup>(x) = (x+5)/3</m>。'],
       ans:'<m>f<sup>−1</sup>(x) = (x+5)/3</m>'}
    ]}
  ]
},

{
  id:'2.4', title:'序列与求和',
  blocks:[
    {t:'lead', h:'序列是「按顺序排的一列数」，求和是「把它们加起来」。两者组合起来会产生很多漂亮的闭式公式，第 4 章会用它们解递推。'},
    {t:'def', lb:'序列', h:'<p><b>序列</b>是从整数子集（通常是 <m>ℕ</m> 或 <m>ℤ<sup>+</sup></m>）到某个集合的函数，记作 <m>a<sub>1</sub>, a<sub>2</sub>, a<sub>3</sub>, …</m> 或 <m>{a<sub>n</sub>}</m>。</p>'},
    {t:'table', head:['类型','通项','求和公式'],
      rows:[
        ['等差数列','<m>a<sub>n</sub> = a + (n−1)d</m>','<m>Σ<sub>k=1</sub><sup>n</sup> a<sub>k</sub> = n(a<sub>1</sub>+a<sub>n</sub>)/2</m>'],
        ['等比数列','<m>a<sub>n</sub> = ar<sup>n−1</sup></m>','<m>Σ<sub>k=0</sub><sup>n</sup> ar<sup>k</sup> = a(r<sup>n+1</sup>−1)/(r−1)</m>，<m>r ≠ 1</m>'],
        ['自然数','<m>1,2,3,…</m>','<m>Σ<sub>k=1</sub><sup>n</sup> k = n(n+1)/2</m>'],
        ['平方数','<m>1,4,9,…</m>','<m>Σ<sub>k=1</sub><sup>n</sup> k<sup>2</sup> = n(n+1)(2n+1)/6</m>'],
        ['立方数','<m>1,8,27,…</m>','<m>Σ<sub>k=1</sub><sup>n</sup> k<sup>3</sup> = [n(n+1)/2]<sup>2</sup></m>']
      ]},
    {t:'tip', h:'<p>立方和公式特别值得记，因为它等于「自然数和的平方」：<m>1<sup>3</sup>+2<sup>3</sup>+⋯+n<sup>3</sup> = (1+2+⋯+n)<sup>2</sup></m>。</p><p>看到这个等式，脑子里应该浮现出一个画面：把 <m>n<sup>3</sup></m> 拆成 <m>n</m> 个连续奇数之和（<m>n<sup>3</sup> = (n<sup>2</sup>−n+1) + ⋯ + (n<sup>2</sup>+n−1)</m>），前 <m>n</m> 个奇数之和恰好是 <m>n<sup>2</sup></m>。</p>'},
    {t:'p', h:'<b>双重求和</b>在计数里很常见：<m>Σ<sub>i=1</sub><sup>m</sup> Σ<sub>j=1</sub><sup>n</sup> a<sub>ij</sub></m> 就是把一个 <m>m × n</m> 的表格全部加起来。求和次序可以交换，这在后面算二项式系数时常用。'},

    {t:'exs', id:'2.4', items:[
      {q:'求 <m>1 + 2 + 3 + ⋯ + 100</m>。',
       hint:'套等差数列求和公式。',
       steps:['<m>n = 100</m>，首项 1，末项 100。','<m>100 × 101 / 2</m>。'],
       ans:'5050'},
      {q:'求 <m>Σ<sub>k=1</sub><sup>10</sup> 2<sup>k</sup></m>。',
       hint:'这是等比数列，注意下标从 1 开始。',
       steps:['<m>Σ<sub>k=1</sub><sup>10</sup> 2<sup>k</sup> = 2 + 2<sup>2</sup> + ⋯ + 2<sup>10</sup></m>。','用公式 <m>a(r<sup>n</sup>−1)/(r−1)</m>，此处 <m>a=2, r=2, n=10</m>。','<m>2(2<sup>10</sup>−1)/(2−1) = 2(1024−1)</m>。'],
       ans:'2046'},
      {q:'求 <m>Σ<sub>k=1</sub><sup>n</sup> (2k − 1)</m>，即前 n 个奇数之和。',
       hint:'拆成两个求和，或者观察 1, 4, 9, 16…',
       steps:['<m>Σ(2k−1) = 2Σk − Σ1 = 2·n(n+1)/2 − n</m>。','<m>= n(n+1) − n = n<sup>2</sup></m>。','验证：n=1 得 1，n=2 得 1+3=4，n=3 得 9。'],
       ans:'<m>n<sup>2</sup></m>'}
    ]}
  ]
},

{
  id:'2.5', title:'基数',
  blocks:[
    {t:'lead', h:'「无穷大有大小之分」这件事，是数学史上最反直觉的发现之一。这一节只讲一个核心思想：<b>用「能不能一一配对」来比较集合大小</b>。'},
    {t:'def', lb:'基数与等势', h:'<p>集合 <m>A</m> 和 <m>B</m> <b>等势</b>，如果存在从 <m>A</m> 到 <m>B</m> 的双射。此时记 <m>|A| = |B|</m>。</p><p>对有限集，这等价于元素个数相同；对无限集，「双射」是唯一可靠的定义方式。</p>'},
    {t:'def', lb:'可数', h:'<p>一个集合是<b>可数</b>的（countable），如果它是有限的，或者它与 <m>ℤ<sup>+</sup></m> 等势——也就是能把元素<b>一个个排成队</b>列出来。</p>'},
    {t:'p', h:'反直觉的地方来了：<b>偶数和自然数一样多</b>。因为 <m>f(n) = 2n</m> 是 <m>ℕ → {偶数}</m> 的双射。虽然偶数看起来「只有一半」，但配对能配上，就是一样多。'},
    {t:'p', h:'更夸张的是：<b>有理数也是可数的</b>。虽然有理数在数轴上密密麻麻，但可以按「分子 + 分母」的和分组，蛇形遍历整个网格，把每个有理数排进队列——所以它和自然数等势。'},
    {t:'thm', lb:'康托定理', h:'<p>实数集 <m>ℝ</m> <b>不可数</b>。全体无限集合的幂集 <m>P(A)</m> 的基数严格大于 <m>A</m> 的基数。</p>'},
    {t:'p', h:'证明用的是<b>对角线法</b>：假设 <m>(0,1)</m> 内的实数能排成 <m>r<sub>1</sub>, r<sub>2</sub>, …</m>，每个写成小数。构造一个新数 <m>d</m>，让它的第 <m>k</m> 位小数不等于 <m>r<sub>k</sub></m> 的第 <m>k</m> 位。这个 <m>d</m> 和列表里每一个都不同，但列表号称包含全部——矛盾。'},
    {t:'tip', h:'<p>对角线法是<b>万能的反证套路</b>：凡是遇到「假设可以一一列举」的命题，都可以试试构造一个「在每一位上都跟对应元素不同」的对象。</p><p>它在可计算性理论里还会再出现一次（停机问题）。</p>'},

    {t:'exs', id:'2.5', items:[
      {q:'证明整数集 <m>ℤ</m> 是可数的。',
       hint:'构造一个把 <m>ℤ</m> 排成队列的双射。',
       steps:['按 <m>0, 1, −1, 2, −2, 3, −3, …</m> 的顺序排列。','这实际上给出了一个 <m>ℕ → ℤ</m> 的双射：偶数下标对应正数，奇数下标对应负数。','每个整数都在队列中的某个确定位置，所以可数。'],
       ans:'得证'},
      {q:'<m>(0,1)</m> 与 <m>(0,2)</m> 等势吗？',
       hint:'找一个双射。',
       steps:['<m>f(x) = 2x</m> 是从 <m>(0,1)</m> 到 <m>(0,2)</m> 的双射。','单射：<m>2a=2b ⟹ a=b</m>。满射：任取 <m>y ∈ (0,2)</m>，<m>y/2 ∈ (0,1)</m>。'],
       ans:'等势，<m>f(x) = 2x</m>'},
      {q:'判断：所有 0/1 无限序列构成的集合是否可数？',
       hint:'想想对角线法能不能用。',
       steps:['假设可数，把它排成 <m>s<sub>1</sub>, s<sub>2</sub>, …</m>。','构造新序列 <m>d</m>，令 <m>d</m> 的第 k 位与 <m>s<sub>k</sub></m> 的第 k 位相反。','<m>d</m> 与每个 <m>s<sub>k</sub></m> 都不同，矛盾。'],
       ans:'不可数'}
    ]}
  ]
},

{
  id:'2.6', title:'矩阵',
  blocks:[
    {t:'lead', h:'这一节内容不多，但后面第 5 章（关系）和第 6 章（图）都会用到矩阵，尤其是<b>布尔矩阵</b>。'},
    {t:'def', lb:'矩阵', h:'<p>一个 <m>m × n</m> 的<b>矩阵</b>是 <m>m</m> 行 <m>n</m> 列的数表，第 <m>i</m> 行第 <m>j</m> 列的元素记作 <m>a<sub>ij</sub></m>。</p>'},
    {t:'p', h:'<b>矩阵乘法</b>：<m>C = AB</m> 中，<m>c<sub>ij</sub> = Σ<sub>k</sub> a<sub>ik</sub>b<sub>kj</sub></m>，即「<m>A</m> 的第 <m>i</m> 行」与「<m>B</m> 的第 <m>j</m> 列」逐项相乘再求和。注意要求 <m>A</m> 的列数等于 <m>B</m> 的行数，而且<b>一般不满足交换律</b>。'},
    {t:'def', lb:'布尔矩阵', h:'<p>元素只取 0 和 1 的矩阵。它的「乘法」把加法换成<b>或</b>、乘法换成<b>与</b>：</p><div class="f" style="margin:10px 0 4px">c<sub>ij</sub> = (a<sub>i1</sub> ∧ b<sub>1j</sub>) ∨ (a<sub>i2</sub> ∧ b<sub>2j</sub>) ∨ ⋯</div>'},
    {t:'p', h:'布尔矩阵乘法为什么重要？因为关系可以用矩阵表示，而<b>关系的复合恰好对应布尔矩阵乘法</b>。第 5 章会用到这一点来算传递闭包。'},
    {t:'table', head:['运算','定义','用途'],
      rows:[
        ['转置 <m>A<sup>t</sup></m>','行列互换，<m>(A<sup>t</sup>)<sub>ij</sub> = a<sub>ji</sub></m>','判断对称关系'],
        ['幂 <m>A<sup>n</sup></m>','<m>n</m> 次连乘','表示路径长度'],
        ['布尔积','加法取或、乘法取与','关系复合、可达性']
      ]},

    {t:'exs', id:'2.6', items:[
      {q:'设 <m>A = [[1,2],[3,4]]</m>，<m>B = [[0,1],[1,0]]</m>，求 <m>AB</m>。',
       hint:'逐行乘逐列。',
       steps:['<m>c<sub>11</sub> = 1·0 + 2·1 = 2</m>。','<m>c<sub>12</sub> = 1·1 + 2·0 = 1</m>。','<m>c<sub>21</sub> = 3·0 + 4·1 = 4</m>。','<m>c<sub>22</sub> = 3·1 + 4·0 = 3</m>。'],
       ans:'<m>AB = [[2,1],[4,3]]</m>'},
      {q:'布尔矩阵乘法：<m>A = [[1,0],[1,1]]</m>，<m>B = [[0,1],[1,0]]</m>，求布尔积。',
       hint:'把加法当「或」、乘法当「与」。',
       steps:['<m>c<sub>11</sub> = (1∧0)∨(0∧1) = 0∨0 = 0</m>。','<m>c<sub>12</sub> = (1∧1)∨(0∧0) = 1∨0 = 1</m>。','<m>c<sub>21</sub> = (1∧0)∨(1∧1) = 0∨1 = 1</m>。','<m>c<sub>22</sub> = (1∧1)∨(1∧0) = 1∨0 = 1</m>。'],
       ans:'<m>[[0,1],[1,1]]</m>'}
    ]}
  ]
}

]};

CH[3] = {
  title: '计数',
  en: 'Counting',
  intro: '这一章只有一件事：<b>数得又快又不错</b>。前面两章在讲「怎么说得严谨」，这一章开始讲「怎么算得干净」。所有公式背后都只有一个动作——把一个问题拆成几步，或者拆成几类。拆得对，答案自己就出来了。',
  sections: [

/* ---------------- 3.1 ---------------- */
{
  id:'3.1', title:'计数的基础',
  blocks:[
    {t:'lead', h:'计数的全部工具，其实只有两条原理。剩下的公式都是从这两条推出来的，忘了公式可以现推，忘了这两条就没救了。'},
    {t:'def', lb:'加法原理', h:'<p>如果一件任务可以分成 <m>m</m> 种<b>互斥</b>的情况，第 <m>i</m> 种情况有 <m>n<sub>i</sub></m> 种做法，那么完成这件任务共有</p><div class="f" style="margin:10px 0 4px">n<sub>1</sub> + n<sub>2</sub> + … + n<sub>m</sub></div>'},
    {t:'def', lb:'乘法原理', h:'<p>如果一件任务要分成 <m>m</m> 个<b>依次进行</b>的步骤，第 <m>i</m> 步有 <m>n<sub>i</sub></m> 种做法，那么完成这件任务共有</p><div class="f" style="margin:10px 0 4px">n<sub>1</sub> × n<sub>2</sub> × … × n<sub>m</sub></div>'},
    {t:'tip', h:'<p>一句话记住区别：<b>分类用加法，分步用乘法</b>。判断标准是——做完其中一种情况，任务就结束了吗？如果是，那是「类」，相加；如果不是，还得接着做下一步，那是「步」，相乘。</p>'},
    {t:'p', h:'这个区别听起来简单，但绝大多数计数错误都出在把它搞混上。看两个只差一个字的题目：'},
    {t:'table', head:['题','拆法','答案'],
      rows:[
        ['从广州到北京，可以坐飞机（3 个航班）或坐高铁（5 趟车）','两类，互斥','3 + 5 = 8'],
        ['从广州到北京，先到武汉（4 条路）再到北京（6 条路）','两步，依次','4 × 6 = 24']
      ]},
    {t:'h3', h:'树图：把乘法原理画出来'},
    {t:'p', h:'当步骤少、选项少的时候，画一棵树是最稳的办法。每一层是一个步骤，从根到叶的一条路径就是一种完整方案，路径总数就是答案。'},
    {t:'p', h:'比如「3 件上衣、2 条裤子有几种搭配」：树的第一层分出 3 个枝，每个枝再分出 2 个枝，一共 <m>3 × 2 = 6</m> 条路径。树图的好处是它不会漏、也不会重复——每个方案恰好对应一条路径。'},
    {t:'warn', h:'<p>用乘法原理时有个隐藏前提：<b>每一步的可选数量不能受前面选择的影响</b>。如果受影响，要么重新划分步骤，要么就用后面的排列公式。</p><p>比如「从 10 个人里选 3 个当正副组长和组员」，第一步有 10 种，但第二步有 9 种、第三步有 8 种——数量在变，这已经不是简单的乘法原理了，而是排列。</p>'},

    {t:'ex', title:'例 1　车牌计数', q:'某地车牌格式为「粤 A · 5 位字符」，其中前 2 位是英文字母（不区分大小写、可重复），后 3 位是数字（可重复）。一共能发出多少块不同的车牌？',
      steps:[
        '这是典型的分步问题：字母位和数字位互相独立，先填字母再填数字，用乘法原理。',
        '第 1 位字母：26 种；第 2 位字母：26 种。字母部分共 <m>26 × 26 = 676</m> 种。',
        '后 3 位数字，每位 10 种，共 <m>10 × 10 × 10 = 1000</m> 种。',
        '两部分相乘：<m>676 × 1000 = 676000</m>。'
      ], ans:'676 000 块'},

    {t:'exs', id:'3.1', items:[
      {q:'从学校到地铁站有 3 条路，从地铁站到火车站有 4 条路，从学校直接到火车站还有 2 条直达线路。从学校到火车站共有多少种走法？',
       hint:'注意「经地铁站」和「直达」是两类互斥的情况。',
       steps:['经地铁站：这是两步，<m>3 × 4 = 12</m> 种。','直达：2 种。','两类互斥（要么经地铁站要么不经），相加。'],
       ans:'<m>12 + 2 = 14</m> 种'},
      {q:'一个 8 位二进制串，要求以 101 开头。这样的串有多少个？',
       hint:'前 3 位已经固定，还剩几位可以自由选？',
       steps:['前 3 位固定为 101，没有选择。','剩下 <m>8 − 3 = 5</m> 位，每一位都可以是 0 或 1。','每位 2 种，5 位独立。'],
       ans:'<m>2<sup>5</sup> = 32</m> 个'},
      {q:'从 1 到 100 的整数中任取一个，它是 2 的倍数或 3 的倍数的有多少个？',
       hint:'直接加会把「既是 2 又是 3 的倍数」算两次。',
       steps:['2 的倍数：<m>⌊100/2⌋ = 50</m> 个。','3 的倍数：<m>⌊100/3⌋ = 33</m> 个。','6 的倍数被数了两遍：<m>⌊100/6⌋ = 16</m> 个，要减掉一次。'],
       ans:'<m>50 + 33 − 16 = 67</m> 个'},
      {q:'一个密码由 2 位字母（区分大小写）和 4 位数字组成，字母和数字都不允许重复。这样的密码有多少个？',
       hint:'字母区分大小写意味着有 52 种可选，且不能重复选。',
       steps:['第 1 位字母：52 种；第 2 位：51 种（不能和第一位相同）。','第 1 位数字：10 种；之后依次 9、8、7 种。','全部相乘。'],
       ans:'<m>(52×51) × (10×9×8×7) = 2652 × 5040 = 13 366 080</m> 个'}
    ]}
  ]
},

/* ---------------- 3.2 ---------------- */
{
  id:'3.2', title:'鸽巢原理',
  blocks:[
    {t:'lead', h:'这是全书最不像数学的一条定理：它不告诉你具体哪个盒子满，只说「一定有一个满」。但正是这种「不具体」，让它能证明很多看起来无从下手的存在性问题。'},
    {t:'def', lb:'鸽巢原理（基本形式）', h:'<p>把 <m>n</m> 只鸽子放进 <m>m</m> 个巢，若 <m>n > m</m>，则至少有一个巢里至少有 <b>2</b> 只鸽子。</p>'},
    {t:'thm', lb:'广义鸽巢原理', h:'<p>把 <m>n</m> 个物体放进 <m>m</m> 个盒子，则至少有一个盒子含有不少于</p><div class="f" style="margin:10px 0 4px">⌈ n / m ⌉</div><p>个物体。</p>'},
    {t:'p', h:'证明只有一句话：如果每个盒子都少于 <m>⌈n/m⌉</m> 个，那每个盒子最多 <m>⌈n/m⌉ − 1</m> 个，总共最多 <m>m(⌈n/m⌉ − 1) < n</m> 个——和总共有 <m>n</m> 个矛盾。'},
    {t:'w', id:'pigeon'},
    {t:'tip', h:'<p>做题的关键不是套公式，而是<b>先想清楚谁是鸽子、谁是巢</b>。巢往往不是题目里明说的东西，而是你要自己造出来的。</p><p>常见套路：按「余数」造巢、按「区间」造巢、把元素两两配对造巢。</p>'},

    {t:'ex', title:'例 1　用余数造巢', q:'证明：任意 5 个整数中，必有 2 个数的差是 4 的倍数。',
      steps:[
        '任何整数除以 4 的余数只可能是 0、1、2、3，一共 4 种——这 4 个余数就是 4 个「巢」。',
        '5 个整数是 5 只「鸽子」，放进 4 个巢里，必有一个巢里至少 2 个数。',
        '这两个数除以 4 余数相同，所以它们的差被 4 整除。'
      ], ans:'得证。'},

    {t:'exs', id:'3.2', items:[
      {q:'一个班有 40 人，证明至少有多少人出生在同一个月？',
       hint:'月份是巢，人是鸽子。',
       steps:['12 个月是 12 个巢，40 人是 40 只鸽子。','<m>⌈40/12⌉ = ⌈3.33⌉ = 4</m>。'],
       ans:'至少有 <b>4</b> 人同月出生'},
      {q:'从 1 到 10 这 10 个整数中任取 6 个，证明必有两个数之和为 11。',
       hint:'把和为 11 的数配成对：1 和 10、2 和 9……',
       steps:['可以配成 5 对：{1,10}、{2,9}、{3,8}、{4,7}、{5,6}。','这 5 对就是 5 个巢。','取 6 个数放进 5 个巢，必有一对的两个数都被取到。','这一对的和就是 11。'],
       ans:'得证'},
      {q:'袋中有红、黄、蓝三种颜色的球足够多，至少取出多少个球，才能保证有 3 个同色？',
       hint:'反过来想：最多取多少个还能保证没有 3 个同色？',
       steps:['没有 3 个同色时，每种颜色最多 2 个。','三种颜色共最多 <m>3 × 2 = 6</m> 个。','取 7 个时必然突破这个上限。'],
       ans:'至少取 <b>7</b> 个'},
      {q:'证明：任意 <m>n+1</m> 个取自 {1, 2, …, 2n} 的整数中，必有两个数互素。',
       hint:'相邻的两个整数一定互素。把 1..2n 按相邻关系配对。',
       steps:['把 {1,…,2n} 分成 <m>n</m> 对：{1,2}、{3,4}、…、{2n−1, 2n}。','这 <m>n</m> 对就是 <m>n</m> 个巢。','取 <m>n+1</m> 个数，必有一对的两个数都被取到。','同一对里的两个数相邻，而相邻整数必互素（它们的公约数整除 1）。'],
       ans:'得证'}
    ]}
  ]
},

/* ---------------- 3.3 ---------------- */
{
  id:'3.3', title:'排列与组合',
  blocks:[
    {t:'lead', h:'排列和组合只差一件事：<b>顺序算不算不同</b>。想清楚这一点，两个公式其实是同一个公式。'},
    {t:'def', lb:'排列', h:'<p>从 <m>n</m> 个不同元素中取 <m>r</m> 个排成一列（<b>顺序不同算不同</b>），方案数为</p><div class="f" style="margin:10px 0 4px">P(n,r) = n(n−1)⋯(n−r+1) = <span class="frac"><span>n!</span><span>(n−r)!</span></span></div>'},
    {t:'def', lb:'组合', h:'<p>从 <m>n</m> 个不同元素中取 <m>r</m> 个组成一组（<b>顺序不同算相同</b>），方案数为</p><div class="f" style="margin:10px 0 4px">C(n,r) = <span class="binom"><span class="pn">(</span><span class="st"><span>n</span><span>r</span></span><span class="pn">)</span></span> = <span class="frac"><span>n!</span><span>r!(n−r)!</span></span></div>'},
    {t:'p', h:'两者的桥梁是这一行：<div class="f">P(n,r) = C(n,r) × r!</div>先选出 <m>r</m> 个（组合），再把这 <m>r</m> 个内部排序（<m>r!</m> 种），就得到排列。所以组合 = 排列 ÷ <m>r!</m>。'},
    {t:'w', id:'permcomb'},
    {t:'warn', h:'<p>做题时最容易错的地方不是套错公式，而是<b>没看清题目要的是哪一种</b>。判断口诀：</p><ul><li>题目里出现「排列」「排队」「顺序」「第几名」「分别担任」——要顺序，用 <m>P</m>。</li><li>出现「选几个」「组成小组」「集合」「任取」——不要顺序，用 <m>C</m>。</li></ul>'},
    {t:'h3', h:'两个必须掌握的组合技巧'},
    {t:'p', h:'<b>捆绑法（处理「必须相邻」）</b>：把要求相邻的几个元素捆成一个整体，先当一个大元素参与排列，再乘上整体内部的排列数。'},
    {t:'p', h:'<b>插空法（处理「互不相邻」）</b>：先排好没有限制的元素，再把受限制的元素插入它们之间的空隙（包括两端）。'},

    {t:'ex', title:'例 1　5 男 4 女排成一排，女生必须站在一起', q:'有多少种排法？',
      steps:[
        '把 4 个女生捆成 1 个「大元素」。现在相当于 5 个男生 + 1 个大元素 = 6 个元素排列，共 <m>6!</m> 种。',
        '大元素内部，4 个女生自己还有 <m>4!</m> 种排法。',
        '两步相乘：<m>6! × 4! = 720 × 24</m>。'
      ], ans:'17 280 种'},

    {t:'ex', title:'例 2　同上一题，但女生互不相邻', q:'有多少种排法？',
      steps:[
        '先排 5 个男生：<m>5! = 120</m> 种。',
        '5 个男生排好后形成 6 个空隙（含两端）：_男_男_男_男_男_。',
        '从这 6 个空隙里选 4 个放女生，且女生之间要区分顺序，所以是 <m>P(6,4) = 6×5×4×3 = 360</m>。',
        '相乘：<m>120 × 360</m>。'
      ], ans:'43 200 种'},

    {t:'exs', id:'3.3', items:[
      {q:'10 名同学中选 4 人排成一排照相，有多少种排法？',
       hint:'「排成一排」说明顺序要紧。',
       steps:['从 10 人里依次选 4 人并排序。','<m>P(10,4) = 10×9×8×7</m>。'],
       ans:'5 040 种'},
      {q:'10 名同学中选 4 人组成一个委员会，有多少种选法？',
       hint:'委员会里没有职务差别。',
       steps:['只关心选了哪 4 个人，不关心顺序。','<m>C(10,4) = 10!/(4!6!) = 210</m>。'],
       ans:'210 种'},
      {q:'从 8 个人里选出一个 3 人小组，其中甲、乙两人至少有一人在组内。有多少种选法？',
       hint:'用总数减去「甲乙都不在」的情况，比分类讨论快。',
       steps:['不加限制：<m>C(8,3) = 56</m>。','甲乙都不在：等于从剩下 6 人里选 3 人，<m>C(6,3) = 20</m>。','相减。'],
       ans:'<m>56 − 20 = 36</m> 种'},
      {q:'由数字 1、2、3、4、5 组成没有重复数字的五位数，其中奇数有多少个？',
       hint:'先定位个位（决定奇偶），再排其余位。',
       steps:['个位必须是 1、3、5 之一：3 种选法。','剩下 4 个位置由剩下 4 个数字任意排列：<m>4! = 24</m> 种。','相乘。'],
       ans:'<m>3 × 24 = 72</m> 个'}
    ]}
  ]
},

/* ---------------- 3.4 ---------------- */
{
  id:'3.4', title:'二项式系数',
  blocks:[
    {t:'lead', h:'<m>C(n,r)</m> 之所以叫「二项式系数」，是因为它正好是 <m>(x+y)<sup>n</sup></m> 展开式的系数。这一节讲的是它们的恒等式——而证明恒等式最好的方法往往不是代数，是「数两遍」。'},
    {t:'thm', lb:'二项式定理', h:'<div class="f" style="margin:4px 0">(x+y)<sup>n</sup> = <span style="font-size:15px">Σ</span><sub style="font-size:11px">k=0</sub><sup style="font-size:11px">n</sup> <span class="binom"><span class="pn">(</span><span class="st"><span>n</span><span>k</span></span><span class="pn">)</span></span> x<sup>n−k</sup> y<sup>k</sup></div><p>展开 <m>(x+y)(x+y)⋯(x+y)</m> 时，每个括号里要么取 <m>x</m> 要么取 <m>y</m>。要得到 <m>x<sup>n−k</sup>y<sup>k</sup></m>，必须恰好有 <m>k</m> 个括号取了 <m>y</m>，选法数是 <m>C(n,k)</m>。</p>'},
    {t:'thm', lb:'帕斯卡恒等式', h:'<div class="f" style="margin:4px 0"><span class="binom"><span class="pn">(</span><span class="st"><span>n</span><span>k</span></span><span class="pn">)</span></span> = <span class="binom"><span class="pn">(</span><span class="st"><span>n−1</span><span>k−1</span></span><span class="pn">)</span></span> + <span class="binom"><span class="pn">(</span><span class="st"><span>n−1</span><span>k</span></span><span class="pn">)</span></span></div>'},
    {t:'p', h:'组合证明：从 <m>n</m> 个人里选 <m>k</m> 个。盯住某个人甲——甲被选中，则还要从其余 <m>n−1</m> 人里选 <m>k−1</m> 个；甲没被选中，则从其余 <m>n−1</m> 人里选 <m>k</m> 个。两种情况互斥且穷尽。'},
    {t:'w', id:'pascal'},
    {t:'tip', h:'<p><b>组合证明（双计数法）</b>是这一节的灵魂：同一个量用两种方式数，结果必然相等，恒等式就得证了。它比代数变形优雅得多，也不容易算错。</p><p>常用套路：数「选一个子集」、「数一条路径」、「数一个二元组」。</p>'},
    {t:'f', h:'Σ<sub style="font-size:11px">k=0</sub><sup style="font-size:11px">n</sup> <span class="binom"><span class="pn">(</span><span class="st"><span>n</span><span>k</span></span><span class="pn">)</span></span> = 2<sup>n</sup>　　<span class="binom"><span class="pn">(</span><span class="st"><span>m+n</span><span>r</span></span><span class="pn">)</span></span> = Σ<sub style="font-size:11px">k</sub> <span class="binom"><span class="pn">(</span><span class="st"><span>m</span><span>k</span></span><span class="pn">)</span></span><span class="binom"><span class="pn">(</span><span class="st"><span>n</span><span>r−k</span></span><span class="pn">)</span></span>', note:'左边是「子集总数 = 每个元素选或不选」；右边是范德蒙德恒等式，按「从前 m 个里选几个」分类。'},

    {t:'ex', title:'例 1　求展开式中的系数', q:'求 <m>(x+y)<sup>7</sup></m> 展开式中 <m>x<sup>4</sup>y<sup>3</sup></m> 的系数。',
      steps:['要出现 <m>x<sup>4</sup>y<sup>3</sup></m>，需要在 7 个括号里恰好选 3 个取 <m>y</m>。','系数就是选法数 <m>C(7,3)</m>。','<m>C(7,3) = 7×6×5/(3×2×1) = 35</m>。'],
      ans:'35'},

    {t:'exs', id:'3.4', items:[
      {q:'计算 <m>C(11,3)</m>，并说明它为什么等于 <m>C(10,3) + C(10,2)</m>。',
       hint:'先算数值，再用帕斯卡恒等式解释。',
       steps:['<m>C(11,3) = 11×10×9/6 = 165</m>。','<m>C(10,3) = 120</m>，<m>C(10,2) = 45</m>，和为 165。','这正是帕斯卡恒等式 <m>n=11, k=3</m> 的情形。'],
       ans:'165'},
      {q:'用组合证明说明：<m>Σ<sub>k=0</sub><sup>n</sup> C(n,k) = 2<sup>n</sup></m>。',
       hint:'数一个 n 元集合有多少个子集，两种数法。',
       steps:['按子集大小分类：大小为 k 的子集有 <m>C(n,k)</m> 个，全部加起来就是子集总数。','换一种数法：每个元素有「选」或「不选」两种状态，n 个元素共 <m>2<sup>n</sup></m> 种，每种恰好对应一个子集。','两种数法数的是同一个东西，所以相等。'],
       ans:'<m>Σ C(n,k) = 2<sup>n</sup></m>'},
      {q:'证明 <m>C(2n,n) = Σ<sub>k=0</sub><sup>n</sup> C(n,k)<sup>2</sup></m>。',
       hint:'从 2n 个（n 男 n 女）里选 n 个，按「选了几个女生」分类。',
       steps:['左边：从 <m>2n</m> 人里选 <m>n</m> 人。','右边按「选了 k 个女生」分类：选 k 个女生有 <m>C(n,k)</m> 种，同时要选 <m>n−k</m> 个男生，有 <m>C(n,n−k) = C(n,k)</m> 种。','每一类有 <m>C(n,k)<sup>2</sup></m> 种，全部相加。'],
       ans:'得证（这是范德蒙德恒等式取 <m>m=r=n</m> 的特例）'},
      {q:'求 <m>(1+x)<sup>10</sup></m> 展开式中所有系数之和。',
       hint:'令 x = 1。',
       steps:['系数之和 = <m>Σ C(10,k)</m>。','代入 <m>x=1</m> 得 <m>(1+1)<sup>10</sup></m>。'],
       ans:'<m>2<sup>10</sup> = 1024</m>'}
    ]}
  ]
},

/* ---------------- 3.5.1 ---------------- */
{
  id:'3.5.1', title:'有重复的排列',
  blocks:[
    {t:'lead', h:'从这里开始进入 <b>3.5 广义排列与组合</b>。所谓「广义」，就是把前面两个限制放松：允许重复取，允许同类不可区分。一放松，四个公式就冒出来了，特别容易记混——所以这一节我会把每一个都追到同一个根上。'},
    {t:'def', lb:'有重复的排列', h:'<p>从 <m>n</m> 个不同元素中取 <m>r</m> 个排成一列，<b>每次取完放回</b>（允许重复），方案数为</p><div class="f" style="margin:10px 0 4px">n<sup>r</sup></div>'},
    {t:'p', h:'推导只用乘法原理，一步都不用多想：有 <m>r</m> 个位置，每个位置都能从 <m>n</m> 种里任选，互不影响，所以乘 <m>r</m> 次。'},
    {t:'tip', h:'<p>注意这里 <m>r</m> 可以大于 <m>n</m>。这正是和 <m>P(n,r)</m> 最大的区别：因为每次选完放回去了，所以不怕「不够选」。</p><p><m>P(n,r)</m> 要求 <m>r ≤ n</m>，<m>n<sup>r</sup></m> 没有这个要求。</p>'},
    {t:'p', h:'识别信号：题目里出现「密码」「编号」「字符串」「每位可以是」「可重复」——基本就是 <m>n<sup>r</sup></m>。'},

    {t:'ex', title:'例 1　DNA 序列', q:'一段长度为 6 的 DNA 序列由 A、T、C、G 四种碱基组成，每个位置可以是任意一种。共有多少种不同的序列？',
      steps:['6 个位置，每个位置 4 种选择，互相独立。','<m>4<sup>6</sup> = 4096</m>。'],
      ans:'4 096 种'},

    {t:'exs', id:'3.5.1', items:[
      {q:'用字母 A、B、C 组成长度为 5 的字符串，每个位置任选，共有多少个？',
       hint:'直接套 <m>n<sup>r</sup></m>。',
       steps:['n = 3 种字母，r = 5 个位置。','<m>3<sup>5</sup> = 243</m>。'],
       ans:'243 个'},
      {q:'一个 4 位 PIN 码，每位是 0–9 的数字，但要求不能全部相同。有多少个？',
       hint:'用总数减去「全部相同」的。',
       steps:['不加限制：<m>10<sup>4</sup> = 10000</m>。','全部相同的情况：0000、1111、…、9999，共 10 种。','相减。'],
       ans:'<m>10000 − 10 = 9990</m> 个'},
      {q:'把 3 封不同的信投入 4 个不同的邮筒，共有多少种投法？',
       hint:'每封信独立选择邮筒——谁是「位置」，谁是「选项」？',
       steps:['以信为单位考虑：每封信都有 4 个邮筒可选。','3 封信互相独立，所以是 <m>4<sup>3</sup></m>，不是 <m>3<sup>4</sup></m>。','<m>4<sup>3</sup> = 64</m>。'],
       ans:'64 种'}
    ]}
  ]
},

/* ---------------- 3.5.2 ---------------- */
{
  id:'3.5.2', title:'有重复的组合',
  blocks:[
    {t:'lead', h:'这是 3.5 里最反直觉的一条。允许重复、又不计顺序，听起来无从下手，但换成「星星和隔板」的画面之后，它就是一道普通的组合题。'},
    {t:'def', lb:'有重复的组合', h:'<p>从 <m>n</m> 类元素中取 <m>r</m> 个，<b>同类元素不可区分、允许重复、不计顺序</b>，方案数为</p><div class="f" style="margin:10px 0 4px"><span class="binom"><span class="pn">(</span><span class="st"><span>n+r−1</span><span>r</span></span><span class="pn">)</span></span> = <span class="binom"><span class="pn">(</span><span class="st"><span>n+r−1</span><span>n−1</span></span><span class="pn">)</span></span></div>'},
    {t:'h3', h:'为什么是 n+r−1 选 r：隔板法的推导'},
    {t:'p', h:'把问题翻译成方程：设第 <m>i</m> 类取了 <m>x<sub>i</sub></m> 个，那么'},
    {t:'f', h:'x<sub>1</sub> + x<sub>2</sub> + … + x<sub>n</sub> = r，　x<sub>i</sub> ≥ 0'},
    {t:'p', h:'现在用 <m>r</m> 颗星星表示这 <m>r</m> 个物品，用 <m>n−1</m> 根隔板把它们分成 <m>n</m> 段。比如 <m>n=4, r=6</m> 时，<span class="mono">★★│★│★★★│</span> 表示解 <m>(2, 1, 3, 0)</m>。'},
    {t:'p', h:'关键在于：<b>每一种星星和隔板的排列，唯一对应一个解；每一个解，也唯一对应一种排列</b>。所以数解 = 数排列。'},
    {t:'p', h:'一共有 <m>r</m> 颗星加 <m>n−1</m> 根隔板，共 <m>n+r−1</m> 个位置。从中挑 <m>r</m> 个位置放星星（剩下的自然是隔板），方案数就是 <m>C(n+r−1, r)</m>。'},
    {t:'w', id:'stars'},
    {t:'warn', h:'<p><b>两个最常见的错法：</b></p><ul><li>把 <m>C(n+r−1, r)</m> 写成 <m>C(n+r−1, n)</m> —— 下标应该是 <m>r</m> 或 <m>n−1</m>，不是 <m>n</m>。</li><li>题目明明要求「每类至少一个」，却还用了非负的公式。这时要<b>先给每类垫 1 个</b>：令 <m>y<sub>i</sub> = x<sub>i</sub> − 1 ≥ 0</m>，方程变成 <m>Σy<sub>i</sub> = r − n</m>，答案变成 <m>C(r−1, n−1)</m>。</li></ul>'},

    {t:'ex', title:'例 1　买甜甜圈', q:'一家店有 4 种甜甜圈，买 6 个（只关心每种买几个，不关心拿的顺序）。有多少种买法？',
      steps:[
        '设 4 种各买 <m>x<sub>1</sub>, x<sub>2</sub>, x<sub>3</sub>, x<sub>4</sub></m> 个，满足 <m>x<sub>1</sub>+x<sub>2</sub>+x<sub>3</sub>+x<sub>4</sub> = 6</m>，<m>x<sub>i</sub> ≥ 0</m>。',
        '这就是允许重复的组合：<m>n = 4, r = 6</m>。',
        '<m>C(4+6−1, 6) = C(9, 6) = C(9, 3) = 84</m>。'
      ], ans:'84 种'},

    {t:'ex', title:'例 2　带下限的方程', q:'求 <m>x<sub>1</sub>+x<sub>2</sub>+x<sub>3</sub> = 11</m> 的正整数解个数。',
      steps:[
        '直接套非负公式不对——这里要求 <m>x<sub>i</sub> ≥ 1</m>。',
        '换元：令 <m>y<sub>i</sub> = x<sub>i</sub> − 1 ≥ 0</m>，则 <m>y<sub>1</sub>+y<sub>2</sub>+y<sub>3</sub> = 11 − 3 = 8</m>。',
        '现在是标准的非负问题：<m>C(8+3−1, 8) = C(10, 8) = C(10, 2) = 45</m>。'
      ], ans:'45 个'},

    {t:'exs', id:'3.5.2', items:[
      {q:'从 5 种饮料中买 8 杯（只记种类和杯数），有多少种买法？',
       hint:'<m>n = 5, r = 8</m>，套公式。',
       steps:['<m>C(5+8−1, 8) = C(12, 8)</m>。','<m>C(12,8) = C(12,4) = 495</m>。'],
       ans:'495 种'},
      {q:'求 <m>x<sub>1</sub>+x<sub>2</sub>+x<sub>3</sub>+x<sub>4</sub> = 10</m> 的非负整数解个数。',
       hint:'四个变量，相当于 4 个盒子。',
       steps:['<m>n = 4</m> 个变量，<m>r = 10</m>。','<m>C(4+10−1, 10) = C(13, 10) = C(13, 3)</m>。','<m>C(13,3) = 13×12×11/6 = 286</m>。'],
       ans:'286 个'},
      {q:'承上题，若要求每个 <m>x<sub>i</sub> ≥ 1</m>，有多少个解？',
       hint:'先给每个变量垫 1。',
       steps:['令 <m>y<sub>i</sub> = x<sub>i</sub> − 1</m>，则 <m>Σy<sub>i</sub> = 10 − 4 = 6</m>。','<m>C(6+4−1, 6) = C(9, 6) = C(9, 3)</m>。','<m>C(9,3) = 84</m>。','也可以直接用 <m>C(r−1, n−1) = C(9, 3) = 84</m>。'],
       ans:'84 个'},
      {q:'一个袋子里有足够多的 5 种糖果，要取出 6 颗，其中每种至少 1 颗。有多少种取法？',
       hint:'「每种至少 1 颗」= 正整数解。',
       steps:['设 5 种各取 <m>x<sub>i</sub> ≥ 1</m>，<m>Σx<sub>i</sub> = 6</m>。','换元后 <m>Σy<sub>i</sub> = 6 − 5 = 1</m>。','<m>C(1+5−1, 1) = C(5,1) = 5</m>。','直观验证：6 颗分给 5 种、每种至少 1 颗，必然是某一种拿 2 颗其余各 1 颗，共 5 种。'],
       ans:'5 种'}
    ]}
  ]
},

/* ---------------- 3.5.3 ---------------- */
{
  id:'3.5.3', title:'四个公式的汇总',
  blocks:[
    {t:'lead', h:'到这里，四个公式全齐了。它们不是四条要背的规则，而是一张二维表的四个格子——只要你能回答两个问题，就永远不会用错。'},
    {t:'p', h:'<b>问题一：顺序算不算不同？</b>（排成一列 / 有职务差别 → 有序；组成一组 / 只关心选了谁 → 无序）'},
    {t:'p', h:'<b>问题二：能不能重复取？</b>（选完放回 / 允许同类 → 可重复；选走就没了 / 各不相同 → 不重复）'},
    {t:'w', id:'grid4'},
    {t:'table', head:['','不重复','可重复'],
      rows:[
        [{h:'<b>有序</b>'}, {h:'<m>P(n,r) = n!/(n−r)!</m><br><span style="font-size:12px;color:var(--muted)">排队、排名、职务分配</span>'}, {h:'<m>n<sup>r</sup></m><br><span style="font-size:12px;color:var(--muted)">密码、编号、字符串</span>'}],
        [{h:'<b>无序</b>'}, {h:'<m>C(n,r) = n!/(r!(n−r)!)</m><br><span style="font-size:12px;color:var(--muted)">选小组、选菜</span>'}, {h:'<m>C(n+r−1, r)</m><br><span style="font-size:12px;color:var(--muted)">买几个、非负整数解</span>'}]
      ]},
    {t:'tip', h:'<p>检验答案的一个土办法：<b>换数字试小规模</b>。比如怀疑自己用的是 <m>C(n,r)</m> 还是 <m>C(n+r−1,r)</m>，就把 <m>n=2, r=2</m> 代进去手工枚举一遍。前者的答案是 1，后者是 3——差得很明显，一眼就能发现错。</p>'},
    {t:'warn', h:'<p>还有一个高频陷阱：<b>「至少」条件</b>。遇到「至少一个」「不少于」这类字眼，优先考虑<b>容斥</b>或<b>补集</b>，别硬套公式。</p><p>例如「5 人分到 3 个房间，每间至少 1 人」，直接用 <m>3<sup>5</sup></m> 就错了，那是允许空房的答案。</p>'}
  ]
},

/* ---------------- 3.5.4 ---------------- */
{
  id:'3.5.4', title:'有不可区分物体的排列',
  blocks:[
    {t:'lead', h:'「把 n 个东西全排上，但其中有些长得一模一样」——这类题的关键是<b>先假装它们都不一样，再把重复数的部分除掉</b>。'},
    {t:'thm', lb:'定理', h:'<p>设 <m>n</m> 个物体中有 <m>n<sub>1</sub></m> 个属于第 1 类、<m>n<sub>2</sub></m> 个属于第 2 类……<m>n<sub>k</sub></m> 个属于第 <m>k</m> 类，同类物体不可区分，且 <m>n<sub>1</sub>+…+n<sub>k</sub> = n</m>。则这 <m>n</m> 个物体的不同排列数为</p><div class="f" style="margin:10px 0 4px"><span class="frac"><span>n!</span><span>n<sub>1</sub>! n<sub>2</sub>! ⋯ n<sub>k</sub>!</span></span></div>'},
    {t:'p', h:'<b>为什么除以这些阶乘？</b>先把所有物体当成不同的，有 <m>n!</m> 种排列。但对每一种真正的排列，第 1 类的 <m>n<sub>1</sub></m> 个物体可以在它们占的位置上任意互换（<m>n<sub>1</sub>!</m> 种），而排出来的样子完全一样。所以每种真实排列被数了 <m>n<sub>1</sub>!n<sub>2</sub>!⋯n<sub>k</sub>!</m> 次，除掉即可。'},
    {t:'w', id:'permdup'},
    {t:'tip', h:'<p>这个公式还有另一个名字：<b>多项式系数</b>。它就是 <m>(x<sub>1</sub>+x<sub>2</sub>+…+x<sub>k</sub>)<sup>n</sup></m> 展开式中 <m>x<sub>1</sub><sup>n<sub>1</sub></sup>x<sub>2</sub><sup>n<sub>2</sub></sup>⋯x<sub>k</sub><sup>n<sub>k</sub></sup></m> 的系数。</p><p>一个记忆锚点：二项式系数 <m>C(n,r)</m> 其实是 <m>k=2</m> 的特例，即 <m>n!/(r!(n−r)!)</m>。同一条公式，换了名字而已。</p>'},

    {t:'ex', title:'例 1　MISSISSIPPI', q:'单词 MISSISSIPPI 的字母全部重新排列，能得到多少个不同的字符串？',
      steps:[
        '数一数：M 出现 1 次，I 出现 4 次，S 出现 4 次，P 出现 2 次，总共 11 个字母。',
        '代入公式：<m>11! / (1!·4!·4!·2!)</m>。',
        '<m>11! = 39 916 800</m>，分母 <m>4!×4!×2! = 24×24×2 = 1152</m>。',
        '<m>39 916 800 / 1152 = 34 650</m>。'
      ], ans:'34 650 个'},

    {t:'exs', id:'3.5.4', items:[
      {q:'单词 STATISTICS 的字母重新排列，有多少种不同结果？',
       hint:'先数清每个字母出现几次。',
       steps:['S 出现 3 次，T 出现 3 次，A 出现 1 次，I 出现 2 次，C 出现 1 次，共 10 个字母。','<m>10! / (3!·3!·2!·1!·1!) = 3 628 800 / 72</m>。'],
       ans:'50 400 个'},
      {q:'把 3 个红球、2 个蓝球、1 个白球排成一排（同色球不可区分），有多少种排法？',
       hint:'总共 6 个球。',
       steps:['<m>n = 6</m>，各类数量为 3、2、1。','<m>6!/(3!2!1!) = 720/12</m>。'],
       ans:'60 种'},
      {q:'在 <m>(x+y+z)<sup>6</sup></m> 的展开式中，<m>x<sup>2</sup>y<sup>3</sup>z</m> 的系数是多少？',
       hint:'这正是多项式系数的定义。',
       steps:['指数的和 <m>2+3+1 = 6</m>，符合。','系数 = <m>6!/(2!3!1!)</m>。','<m>720/(2×6×1) = 60</m>。'],
       ans:'60'},
      {q:'一个 4×4 的方格网，从左上角走到右下角，只能向右或向下走，有多少条路径？',
       hint:'每条路径都是 4 个「右」和 4 个「下」的排列。',
       steps:['总共要走 8 步，其中 4 步向右、4 步向下。','一条路径就是这个多重集合的一个排列。','<m>8!/(4!4!) = C(8,4) = 70</m>。'],
       ans:'70 条'}
    ]}
  ]
},

/* ---------------- 3.5.5 ---------------- */
{
  id:'3.5.5', title:'把物体放入盒子',
  blocks:[
    {t:'lead', h:'这一小节看起来是「又一张表」，其实它是整个 3.5 的收口。前面四个公式，在这里全部落地成四种具体的场景。你现在卡在这里，多半是因为书上直接给了结论，没把「为什么是这四种」讲开。那我们从最朴素的问题重新问一遍。'},
    {t:'p', h:'问题本身很简单：<b>把 <m>m</m> 个物体放进 <m>n</m> 个盒子，有多少种放法？</b>'},
    {t:'p', h:'但它其实是个「问题模板」，答案取决于三个前提。第一个前提决定了这是不是 3.5 的内容：'},
    {t:'def', lb:'先问三句话', h:'<ol style="margin:6px 0 0"><li><b>物体彼此是否可区分？</b>——是有编号的球（每个都不一样），还是一模一样的球？</li><li><b>盒子彼此是否可区分？</b>——是有编号的盒子（盒 1、盒 2），还是没有名字的三个筐？</li><li><b>允许不允许空盒？</b>——每个盒子都必须有东西，还是可以空着？</li></ol>'},
    {t:'p', h:'前两句形成一个 2×2，四个格子对应四种本质不同的情境；第三句在每个格子里再分成两行「允许空 / 不允许空」。这就是那张表。'},
    {t:'w', id:'boxes'},
    {t:'h3', h:'四个格子分别是什么，为什么'},
    {t:'p', h:'<b>① 物体可区分、盒子可区分。</b>每个物体独立地挑一个盒子，<m>m</m> 个物体就有 <m>n<sup>m</sup></m> 种。这就是 3.5.1 的重复排列——把「盒子」看成「可选的字母」，把「物体」看成「位置」，一模一样。要求不空盒，就是数<b>满射函数</b>的个数，得用容斥：先不管空不空，再扣掉「指定某些盒子为空」的情况。'},
    {t:'f', h:'<span class="binom"><span class="pn">(</span><span class="st"><span>n</span><span>k</span></span><span class="pn">)</span></span> 型容斥：　Σ<sub style="font-size:11px">k=0</sub><sup style="font-size:11px">n</sup> (−1)<sup>k</sup> C(n,k)(n−k)<sup>m</sup>', note:'当 m = 5, n = 3 时：3⁵ − 3·2⁵ + 3·1⁵ = 243 − 96 + 3 = 150'},
    {t:'p', h:'<b>② 物体可区分、盒子不可区分。</b>盒子没名字了，所以不再关心「放进哪个盒子」，只关心<b>把 <m>m</m> 个球切成几堆</b>。切成恰好 <m>n</m> 个非空堆的方案数，就是第二类 Stirling 数 <m>S(m,n)</m>。如果允许空盒，实际用到的堆数可以是 1 到 <m>n</m> 之间的任何值，于是答案是把 <m>S(m,1)+S(m,2)+…+S(m,n)</m> 全加起来。'},
    {t:'p', h:'<b>③ 物体不可区分、盒子可区分。</b>球都一样了，于是只关心每个盒子里装几个，也就是方程 <m>x<sub>1</sub>+⋯+x<sub>n</sub> = m</m> 的解。这正是 3.5.2 的隔板法：<b>非负</b>整数解对应允许空盒，<m>C(n+m−1, m)</m>；<b>正</b>整数解对应不允许空盒，<m>C(m−1, n−1)</m>。'},
    {t:'p', h:'<b>④ 物体不可区分、盒子也不可区分。</b>两个都不可区分，剩下纯粹的「把 <m>m</m> 写成几个正整数之和」——整数分拆。这个数没有闭式公式，只能枚举或递推，所以考试里通常只让你列举，不会要你代公式。'},
    {t:'table', head:['','盒子可区分','盒子不可区分'],
      rows:[
        [{h:'<b>物体可区分</b>'}, {h:'允许空：<m>n<sup>m</sup></m><br>非空：容斥（满射数）'}, {h:'允许空：<m>Σ<sub>k≤n</sub>S(m,k)</m><br>非空：<m>S(m,n)</m>'}],
        [{h:'<b>物体不可区分</b>'}, {h:'允许空：<m>C(n+m−1,m)</m><br>非空：<m>C(m−1,n−1)</m>'}, {h:'允许空：分拆 ≤ n 部分<br>非空：分拆恰 n 部分'}]
      ]},
    {t:'tip', h:'<p><b>怎么快速判断物体可不可区分？</b>看题目在不在意「哪一个」。</p><ul><li>「5 个<b>不同的</b>球」「5 个人」「5 封信」——可区分。</li><li>「5 个<b>相同的</b>球」「5 个相同的苹果」——不可区分。</li></ul><p><b>怎么判断盒子可不可区分？</b>看盒子有没有编号或名字。「3 个<b>不同的</b>盒子」「3 个房间」——可区分；「分成 3 <b>组</b>」「分成 3 堆」——不可区分。</p>'},
    {t:'warn', h:'<p>最典型的坑：<b>「5 个人分成 3 组」和「5 个人住进 3 个房间」是两个完全不同的题。</b></p><p>人说「分成 3 组」时，组是没有名字的，交换两组不算新方案——答案 25。说「住进 3 个房间」时，房间有编号，A 住 1 号房和 A 住 2 号房是不同方案——答案是 150。</p><p>差了 6 倍，正好是 <m>3!</m> ——因为 3 个组贴上 3 个标签有 <m>3!</m> 种贴法。</p>'},

    {t:'ex', title:'例 1　同一批球，四种问法', q:'现有 5 个球、3 个盒子。分别求以下四种情形的方案数：(a) 球不同、盒不同、允许空；(b) 球不同、盒不同、不许空；(c) 球相同、盒不同、允许空；(d) 球相同、盒不同、不许空。',
      steps:[
        '(a) 每个球独立选盒：<m>3<sup>5</sup> = 243</m>。',
        '(b) 容斥：<m>3<sup>5</sup> − C(3,1)·2<sup>5</sup> + C(3,2)·1<sup>5</sup> = 243 − 96 + 3 = 150</m>。',
        '(c) 隔板法：<m>C(3+5−1, 5) = C(7,5) = 21</m>。',
        '(d) 正整数解：<m>C(5−1, 3−1) = C(4,2) = 6</m>。'
      ], ans:'(a) 243　(b) 150　(c) 21　(d) 6'},

    {t:'ex', title:'例 2　把人分组', q:'把 5 个不同的人分成 3 个没有名字的小组，每组至少一人。有多少种分法？',
      steps:[
        '盒子（组）不可区分，物体（人）可区分，且不许空——对应第二种情形的非空行，即 <m>S(5,3)</m>。',
        '用容斥的思路算：先按「组有编号、不许空」得 150 种。',
        '但组的编号是我们硬加的：3 个组有 <m>3! = 6</m> 种编号方式，每一种真实分法都被数了 6 次。',
        '所以 <m>S(5,3) = 150 / 6 = 25</m>。'
      ], ans:'25 种'},

    {t:'exs', id:'3.5.5', items:[
      {q:'6 个相同的球放进 4 个不同的盒子，允许空盒，有多少种放法？',
       hint:'球相同、盒不同、允许空 → 非负整数解。',
       steps:['设 4 个盒子各放 <m>x<sub>i</sub> ≥ 0</m>，<m>Σx<sub>i</sub> = 6</m>。','<m>C(4+6−1, 6) = C(9, 6) = C(9, 3)</m>。','<m>C(9,3) = 84</m>。'],
       ans:'84 种'},
      {q:'承上题，若每个盒子至少放 1 个球，有多少种放法？',
       hint:'正整数解，或直接用 <m>C(m−1, n−1)</m>。',
       steps:['要求 <m>x<sub>i</sub> ≥ 1</m>：<m>C(6−1, 4−1) = C(5,3)</m>。','<m>C(5,3) = 10</m>。','用换元验证：<m>y<sub>i</sub>=x<sub>i</sub>−1</m>，<m>Σy<sub>i</sub>=2</m>，<m>C(2+4−1,2)=C(5,2)=10</m>，一致。'],
       ans:'10 种'},
      {q:'5 个不同的球放进 3 个不同的盒子，每个盒子至少一个球，有多少种放法？',
       hint:'这是满射数，用容斥。',
       steps:['不加限制：<m>3<sup>5</sup> = 243</m>。','减去「至少一个盒子空」：指定 1 个盒子空有 <m>C(3,1)=3</m> 种选法，每种剩下 <m>2<sup>5</sup>=32</m>，得 96。','加回「至少两个盒子空」（被减了两次）：<m>C(3,2)=3</m> 种，每种 <m>1<sup>5</sup>=1</m>，得 3。','<m>243 − 96 + 3 = 150</m>。'],
       ans:'150 种'},
      {q:'5 个不同的球放进 3 个相同的盒子，允许空盒，有多少种放法？',
       hint:'先算不许空，再加上用了 1 个、2 个盒子的情况。',
       steps:['不许空：<m>S(5,3) = 25</m>（见例 2）。','只用 2 个盒子且都不空：<m>S(5,2) = 15</m>。','只用 1 个盒子：<m>S(5,1) = 1</m>。','允许空 = 三种情况之和：<m>1 + 15 + 25 = 41</m>。'],
       ans:'41 种'},
      {q:'把 6 本不同的书分成 3 堆，每堆 2 本。有多少种分法？',
       hint:'分堆没有编号，注意别把堆的顺序算进去。',
       steps:['先按「有编号的 3 堆」分：从 6 本选 2 本给第一堆，再选 2 本给第二堆，剩下 2 本给第三堆，得 <m>C(6,2)C(4,2)C(2,2) = 15×6×1 = 90</m>。','但三堆没有编号，每一种真实分法被数了 <m>3! = 6</m> 次。','<m>90 / 6 = 15</m>。'],
       ans:'15 种'}
    ]}
  ]
},

/* ---------------- 3.6 ---------------- */
{
  id:'3.6', title:'生成排列与组合',
  blocks:[
    {t:'lead', h:'前面都在「数」有多少种，这一节换成「按顺序列出来」。用途很实际：只要你能系统地生成，就一定能不重不漏地数完——这也是写回溯算法的原型。'},
    {t:'h3', h:'字典序'},
    {t:'p', h:'把排列按字典里的顺序排：先比第一个元素，小的在前；第一个相同再比第二个，依此类推。例如 <m>{1,2,3}</m> 的全部排列按字典序是：'},
    {t:'f', h:'123　132　213　231　312　321'},
    {t:'h3', h:'下一个排列的算法'},
    {t:'p', h:'给定一个排列，求字典序中紧挨着它的下一个。四步：'},
    {t:'ol', items:[
      '<b>从右往左</b>找第一对相邻的升序，即找到最大的 <m>i</m> 使 <m>a<sub>i</sub> &lt; a<sub>i+1</sub></m>。找不到说明已经是最后一个（完全降序）。',
      '在 <m>a<sub>i+1</sub>, …, a<sub>n</sub></m> 中<b>从右往左</b>找第一个大于 <m>a<sub>i</sub></m> 的元素 <m>a<sub>j</sub></m>。',
      '交换 <m>a<sub>i</sub></m> 与 <m>a<sub>j</sub></m>。',
      '把 <m>a<sub>i+1</sub></m> 到 <m>a<sub>n</sub></m> 这一段<b>反转</b>（此时它一定是降序的，反转后变升序，即最小）。'
    ]},
    {t:'ex', title:'例 1　求 13542 的下一个排列', q:'按字典序，13542 之后紧接着的是哪个排列？',
      steps:[
        '从右往左找升序对：4&gt;2，5&gt;4，3&lt;5 —— 所以 <m>i</m> 指向 3（第 2 位）。',
        '在 5、4、2 中从右往左找第一个大于 3 的：2 不行，4 可以。所以 <m>j</m> 指向 4。',
        '交换 3 和 4，得到 14532。',
        '把 i 之后的 5、3、2 反转成 2、3、5，得到 14235。'
      ], ans:'14235'},
    {t:'h3', h:'生成组合：用位串'},
    {t:'p', h:'生成 <m>{1,…,n}</m> 的全部组合，最直接的办法是给每个元素配一个 0/1 位：第 <m>k</m> 位为 1 表示选中。于是组合与长度为 <m>n</m> 的位串一一对应，二进制从 <m>00⋯0</m> 数到 <m>11⋯1</m> 就遍历完了全部 <m>2<sup>n</sup></m> 个组合。'},
    {t:'p', h:'这恰好是上一节 <m>ΣC(n,k) = 2<sup>n</sup></m> 的构造性证明——两种数法不仅结果相同，连过程都能对上。'},

    {t:'exs', id:'3.6', items:[
      {q:'按字典序，1234 的下一个排列是什么？',
       hint:'从右往左找第一个升序对。',
       steps:['从右往左：3&lt;4，所以 <m>i</m> 指向 3。','右侧只有 4，大于 3，交换得 1243。','i 之后只剩一个元素，反转无变化。'],
       ans:'1243'},
      {q:'按字典序，求 321 的下一个排列。',
       hint:'检查它是不是已经完全降序。',
       steps:['从右往左找升序对：2&gt;1，3&gt;2，找不到任何 <m>a<sub>i</sub> &lt; a<sub>i+1</sub></m>。','说明 321 是 3 个元素的最后一个排列。','下一个排列不存在（若要求循环，则回到 123）。'],
       ans:'不存在，321 已是最大排列'},
      {q:'用位串方法，写出集合 {a, b, c} 的全部组合。',
       hint:'三位二进制从 000 数到 111。',
       steps:['000 → ∅　001 → {c}　010 → {b}　011 → {b,c}','100 → {a}　101 → {a,c}　110 → {a,b}　111 → {a,b,c}','共 <m>2<sup>3</sup> = 8</m> 个，与 <m>C(3,0)+C(3,1)+C(3,2)+C(3,3) = 1+3+3+1 = 8</m> 一致。'],
       ans:'∅、{c}、{b}、{b,c}、{a}、{a,c}、{a,b}、{a,b,c}'}
    ]}
  ]
}

]};

CH[4] = {
  title: '高级计数技术',
  en: 'Advanced Counting',
  intro: '这一章解决 3.5 之后剩下的难题：<b>答案自己出现在自己里面怎么办</b>。递推关系就是「用前一项算后一项」，解递推就是把它变成「直接代 n 就能算」的闭式。中间还会学两个新工具：生成函数和容斥。',
  sections: [

{
  id:'4.1', title:'递推关系的应用',
  blocks:[
    {t:'lead', h:'很多计数问题的答案不是「一个公式」，而是「一个自己依赖自己的公式」。这不是缺陷，而是一个可解的方程。'},
    {t:'def', lb:'递推关系', h:'<p>把序列 <m>{a<sub>n</sub>}</m> 的第 <m>n</m> 项用前面的项表示出来的方程，称为<b>递推关系</b>。配合<b>初始条件</b>（前几项的具体值），就能唯一确定整个序列。</p>'},
    {t:'warn', h:'<p>只有递推关系不够，<b>必须给初始条件</b>。同一个递推 <m>a<sub>n</sub> = 2a<sub>n−1</sub></m>，配 <m>a<sub>1</sub>=1</m> 得 <m>2<sup>n−1</sup></m>，配 <m>a<sub>1</sub>=5</m> 得 <m>5·2<sup>n−1</sup></m>——完全不同的序列。</p>'},
    {t:'w', id:'hanoi'},
    {t:'h3', h:'三个必须会建的模型'},
    {t:'p', h:'<b>① 斐波那契（兔子问题）</b>：<m>f<sub>n</sub> = f<sub>n−1</sub> + f<sub>n−2</sub></m>，<m>f<sub>1</sub>=f<sub>2</sub>=1</m>。每个月的兔子数 = 上个月已有的 + 上上个月新生的（因为每对成年兔每月生一对，且需要一个月成熟）。'},
    {t:'p', h:'<b>② 汉诺塔</b>：<m>H(n) = 2H(n−1) + 1</m>，<m>H(1)=1</m>，解得 <m>H(n) = 2<sup>n</sup> − 1</m>。'},
    {t:'p', h:'<b>③ 字符串计数</b>：长度为 <m>n</m> 且不含连续两个 0 的二进制串有多少个？设 <m>a<sub>n</sub></m> 为答案。按最后一位分类：末位是 1，前 <m>n−1</m> 位任意（<m>a<sub>n−1</sub></m>）；末位是 0，则倒数第二位必须是 1，前 <m>n−2</m> 位任意（<m>a<sub>n−2</sub></m>）。于是 <m>a<sub>n</sub> = a<sub>n−1</sub> + a<sub>n−2</sub></m>，又是斐波那契。'},

    {t:'ex', title:'例 1　带限制的字符串', q:'用 A、B、C 组成长度为 n 的字符串，要求不能出现连续两个 A。求递推关系。',
      steps:[
        '设 <m>a<sub>n</sub></m> 为符合条件的串数。按最后一位分类。',
        '末位不是 A（是 B 或 C）：前 <m>n−1</m> 位只需满足条件，有 <m>a<sub>n−1</sub></m> 种，末位 2 种选法，贡献 <m>2a<sub>n−1</sub></m>。',
        '末位是 A：则倒数第二位不能是 A，即前 <m>n−1</m> 位必须以 B 或 C 结尾。换个角度：末两位是 BA 或 CA，前 <m>n−2</m> 位只需满足条件，贡献 <m>2a<sub>n−2</sub></m>。',
        '所以 <m>a<sub>n</sub> = 2a<sub>n−1</sub> + 2a<sub>n−2</sub></m>，初值 <m>a<sub>1</sub>=3, a<sub>2</sub>=8</m>。'
      ], ans:'<m>a<sub>n</sub> = 2a<sub>n−1</sub> + 2a<sub>n−2</sub></m>'},

    {t:'exs', id:'4.1', items:[
      {q:'一个 1×n 的走廊要铺 1×1 和 1×2 的瓷砖，有多少种铺法？',
       hint:'看最左边那一块铺的是哪种。',
       steps:['设 <m>a<sub>n</sub></m> 为铺法数。','若最左放 1×1，剩下 n−1 长度：<m>a<sub>n−1</sub></m> 种。','若最左放 1×2，剩下 n−2 长度：<m>a<sub>n−2</sub></m> 种。','<m>a<sub>n</sub> = a<sub>n−1</sub>+a<sub>n−2</sub></m>，<m>a<sub>1</sub>=1, a<sub>2</sub>=2</m>——又是斐波那契（偏移一位）。'],
       ans:'<m>a<sub>n</sub> = a<sub>n−1</sub>+a<sub>n−2</sub></m>，<m>a<sub>n</sub> = f<sub>n+1</sub></m>'},
      {q:'求 <m>H(10)</m>，其中 <m>H(n)=2H(n−1)+1</m>，<m>H(1)=1</m>。',
       hint:'用闭式 <m>2<sup>n</sup>−1</m>。',
       steps:['<m>H(10) = 2<sup>10</sup> − 1</m>。','<m>= 1024 − 1</m>。'],
       ans:'1023'},
      {q:'数列 <m>a<sub>n</sub> = a<sub>n−1</sub> + n</m>，<m>a<sub>1</sub> = 1</m>，求 <m>a<sub>n</sub></m> 的闭式。',
       hint:'把它展开成求和。',
       steps:['<m>a<sub>n</sub> = a<sub>n−1</sub>+n = a<sub>n−2</sub>+(n−1)+n = ⋯</m>','<m>= a<sub>1</sub> + 2 + 3 + ⋯ + n</m>','<m>= 1 + (2+3+⋯+n) = n(n+1)/2</m>'],
       ans:'<m>a<sub>n</sub> = n(n+1)/2</m>'}
    ]}
  ]
},

{
  id:'4.2', title:'求解线性递推关系',
  blocks:[
    {t:'lead', h:'形如 <m>a<sub>n</sub> = c<sub>1</sub>a<sub>n−1</sub> + ⋯ + c<sub>k</sub>a<sub>n−k</sub></m> 的递推，有一套机械的解法：<b>把递推变成特征方程，解方程求根，再按根的形式写通解</b>。'},
    {t:'thm', lb:'二阶齐次递推的解法', h:'<p>对 <m>a<sub>n</sub> = pa<sub>n−1</sub> + qa<sub>n−2</sub></m>，写出<b>特征方程</b></p><div class="f" style="margin:8px 0">r<sup>2</sup> − pr − q = 0</div><p>设两根为 <m>r<sub>1</sub>, r<sub>2</sub></m>：</p><ul style="margin:6px 0 0"><li>若 <m>r<sub>1</sub> ≠ r<sub>2</sub></m>（实根）：<m>a<sub>n</sub> = αr<sub>1</sub><sup>n</sup> + βr<sub>2</sub><sup>n</sup></m></li><li>若 <m>r<sub>1</sub> = r<sub>2</sub> = r</m>（重根）：<m>a<sub>n</sub> = (α + βn)r<sup>n</sup></m></li></ul><p><m>α, β</m> 由初始条件确定。</p>'},
    {t:'p', h:'<b>为什么是 <m>r<sup>n</sup></m>？</b>因为如果假设解形如 <m>a<sub>n</sub> = r<sup>n</sup></m>，代入递推得 <m>r<sup>n</sup> = pr<sup>n−1</sup> + qr<sup>n−2</sup></m>，两边除以 <m>r<sup>n−2</sup></m> 就得 <m>r<sup>2</sup> = pr + q</m>——正是特征方程。'},
    {t:'w', id:'linrec'},
    {t:'warn', h:'<p><b>重根时为什么要乘 <m>n</m>？</b>因为两个根相同时，<m>r<sup>n</sup></m> 和 <m>r<sup>n</sup></m> 是同一个解，凑不出所有初值组合。乘个 <m>n</m> 就得到了线性无关的第二个解——这和微分方程里重根要乘 <m>x</m> 是同一回事。</p>'},
    {t:'p', h:'<b>非齐次情形</b>（右边多一项，如 <m>a<sub>n</sub> = 2a<sub>n−1</sub> + 1</m>）的处理是：先求齐次通解，再猜一个特解，两者相加。汉诺塔就属于这一类，猜 <m>a<sub>n</sub> = c</m> 得 <m>c = 2c+1</m>，即 <m>c = −1</m>，所以解形如 <m>α·2<sup>n</sup> − 1</m>。'},

    {t:'ex', title:'例 1　斐波那契的通项', q:'解 <m>f<sub>n</sub> = f<sub>n−1</sub> + f<sub>n−2</sub></m>，<m>f<sub>1</sub>=f<sub>2</sub>=1</m>。',
      steps:[
        '特征方程 <m>r<sup>2</sup> − r − 1 = 0</m>，根为 <m>r = (1 ± √5)/2</m>。记 <m>φ = (1+√5)/2</m>，<m>ψ = (1−√5)/2</m>。',
        '通解 <m>f<sub>n</sub> = αφ<sup>n</sup> + βψ<sup>n</sup></m>。',
        '代入初值解出 <m>α = 1/√5</m>，<m>β = −1/√5</m>。',
        '所以 <m>f<sub>n</sub></m> 是整数，却要用无理数表示——这就是著名的比内公式。'
      ], ans:'<m>f<sub>n</sub> = (φ<sup>n</sup> − ψ<sup>n</sup>)/√5</m>'},
