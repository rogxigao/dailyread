<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>离散数学 · 逐章精读 | Rosen 8e 本科教学版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F5F1E8; --surface:#FFFDF7; --surface-2:#FBF8F0;
  --ink:#22252A; --ink2:#4C5057; --muted:#807D75;
  --line:#E4DDCE; --line2:#D5CCB8;
  --accent:#A63E2B; --accent-soft:#FAEDE8; --accent-line:#E8C9BE;
  --teal:#2C5F6E; --teal-soft:#E9F1F3;
  --green:#3E7550; --green-soft:#EBF3EC;
  --amber:#9A6D16; --amber-soft:#FBF1DC;
  --shadow:0 1px 2px rgba(40,32,20,.05),0 8px 24px -12px rgba(40,32,20,.12);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --math:"Cambria Math",Cambria,Georgia,"Times New Roman",serif;
}
[data-theme="dark"]{
  --paper:#15171B; --surface:#1C1F24; --surface-2:#212429;
  --ink:#E9E5DC; --ink2:#BDB9B0; --muted:#8A867E;
  --line:#2C3037; --line2:#3A3F47;
  --accent:#E0795F; --accent-soft:#2B2120; --accent-line:#4A3330;
  --teal:#7FB4C2; --teal-soft:#1D282C;
  --green:#7FB48C; --green-soft:#1C2620;
  --amber:#D6A94E; --amber-soft:#2A2418;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15.5px; line-height:1.9; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-line);color:var(--ink)}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{
  width:274px;flex:0 0 274px;height:100vh;position:sticky;top:0;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;
}
.brand{
  padding:22px 20px 16px;border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;flex:0 0 auto;
}
.mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:9px;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:0;
  box-shadow:var(--shadow);
}
.brand h1{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.03em;line-height:1.35}
.brand p{font-size:11px;color:var(--muted);letter-spacing:.02em;line-height:1.5;margin-top:2px}

.gauge{padding:14px 20px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.gauge-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.02em}
.gauge-row b{color:var(--accent);font-family:var(--serif);font-size:14px;font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.gauge-sub{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}

#sumBtn{
  margin:10px 12px 2px;padding:9px 12px;border-radius:8px;border:1px dashed var(--line2);
  background:var(--surface-2);cursor:pointer;display:flex;align-items:center;gap:9px;
  transition:.15s;flex:0 0 auto;
}
#sumBtn:hover{border-color:var(--accent);color:var(--accent)}
#sumBtn.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
#sumBtn b{display:block;font-size:12.5px;font-weight:500;color:var(--ink2);line-height:1.4;letter-spacing:.01em}
#sumBtn span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.02em;line-height:1.4}
#sumBtn.on b{color:var(--accent)}
#sumBtn svg{flex:0 0 auto;opacity:.55}

#tree{overflow-y:auto;flex:1 1 auto;padding:12px 10px 28px}
#tree::-webkit-scrollbar{width:6px}
#tree::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.ch{margin-bottom:2px}
.ch-h{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  cursor:pointer;user-select:none;transition:background .15s;
}
.ch-h:hover{background:var(--surface-2)}
.ch-n{
  width:21px;height:21px;flex:0 0 21px;border-radius:5px;display:grid;place-items:center;
  font-family:var(--serif);font-size:12px;font-weight:600;
  background:var(--line);color:var(--ink2);transition:.2s;
}
.ch.on .ch-n{background:var(--accent);color:#fff}
.ch-h b{font-size:13.5px;font-weight:500;flex:1;line-height:1.4;letter-spacing:.01em}
.ch-h svg{flex:0 0 auto;opacity:.4;transition:transform .2s}
.ch.open .ch-h svg{transform:rotate(90deg)}
.ch-s{display:none;padding:2px 0 8px 0}
.ch.open .ch-s{display:block}
.sec{
  display:flex;align-items:flex-start;gap:8px;padding:6px 10px 6px 32px;border-radius:6px;
  cursor:pointer;font-size:13px;color:var(--ink2);line-height:1.5;transition:background .15s,color .15s;
  border-left:2px solid transparent;margin-left:2px;
}
.sec:hover{background:var(--surface-2);color:var(--ink)}
.sec.on{background:var(--accent-soft);color:var(--accent);font-weight:500;border-left-color:var(--accent)}
.sec .dot{
  width:5px;height:5px;flex:0 0 5px;border-radius:50%;margin-top:9px;
  border:1px solid var(--line2);background:transparent;transition:.2s;
}
.sec.v .dot{background:var(--line2);border-color:var(--line2)}
.sec.d .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#bar{
  position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;gap:14px;
  padding:0 34px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:0 0 auto;
}
#bar .crumb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
#bar .crumb b{color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .sp{flex:1}
.iconbtn{
  width:31px;height:31px;border-radius:7px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:.15s;
}
.iconbtn:hover{border-color:var(--line2);color:var(--accent);transform:translateY(-1px)}
#burger{display:none}

#doc{padding:44px 34px 20px;max-width:820px;width:100%;margin:0 auto;flex:1 1 auto}
#pager{
  max-width:820px;width:100%;margin:0 auto;padding:8px 34px 56px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.pg{
  display:flex;flex-direction:column;gap:3px;padding:13px 16px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);cursor:pointer;transition:.18s;text-decoration:none;
}
.pg:hover{border-color:var(--accent-line);box-shadow:var(--shadow);transform:translateY(-1px)}
.pg span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.pg b{font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.4}
.pg.next{text-align:right;grid-column:2}
.pg.empty{visibility:hidden}
footer{border-top:1px solid var(--line);padding:22px 34px 40px;text-align:center;font-size:11.5px;color:var(--muted);line-height:2}

/* ---------- typography ---------- */
.ch-head{margin-bottom:34px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.ch-kicker{
  font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:500;
  text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:12px;
}
.ch-kicker::after{content:"";flex:1;height:1px;background:var(--accent-line)}
.ch-head h1{
  font-family:var(--serif);font-size:33px;font-weight:600;line-height:1.35;
  letter-spacing:.01em;margin-bottom:10px;
}
.ch-head h1 em{font-style:normal;color:var(--accent)}
.ch-desc{font-size:14px;color:var(--ink2);line-height:1.85;max-width:640px}

h2#sec-title{
  font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.4;
  margin:0 0 6px;letter-spacing:.01em;scroll-margin-top:70px;
}
.sec-meta{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:26px;display:flex;gap:14px;align-items:center}
.sec-meta::after{content:"";flex:1;height:1px;background:var(--line)}

h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:34px 0 12px;letter-spacing:.02em;line-height:1.5}
h3::before{content:"§";color:var(--accent);font-size:13px;margin-right:8px;opacity:.7}
p{margin:0 0 13px}
p.lead{font-size:15px;color:var(--ink2)}
ul,ol{margin:0 0 14px;padding-left:1.5em}
li{margin-bottom:6px}
li::marker{color:var(--muted)}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-line)}
a:hover{border-bottom-color:var(--accent)}
b,strong{font-weight:600;color:var(--ink)}
k{font-weight:600;color:var(--accent);font-style:normal}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:30px 0}

/* math */
m{font-family:var(--math);font-size:1.06em;letter-spacing:.01em;white-space:nowrap}
.f{
  display:block;text-align:center;font-family:var(--math);font-size:19px;
  margin:18px 0;padding:16px 12px;background:var(--surface-2);border-radius:9px;
  border:1px solid var(--line);line-height:2.1;overflow-x:auto;
}
.f small{font-size:11px;font-family:var(--sans);color:var(--muted);display:block;margin-top:8px;line-height:1.7;white-space:normal}
.frac{display:inline-grid;vertical-align:-.48em;text-align:center;margin:0 .16em;font-size:.95em}
.frac>span:first-child{border-bottom:1.2px solid currentColor;padding:0 .32em .06em}
.frac>span:last-child{padding:.06em .32em 0}
.binom{display:inline-flex;align-items:stretch;vertical-align:-.5em;margin:0 .1em}
.binom>.st{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:0 .1em;line-height:1.12;font-size:.9em}
.binom>.pn{display:flex;align-items:center;font-size:1.75em;line-height:1;font-family:Georgia,serif;font-weight:300}

/* callouts */
.def,.thm,.tip,.warn{
  border-radius:9px;padding:15px 18px 14px;margin:20px 0;font-size:14.5px;line-height:1.85;
  border:1px solid var(--line);background:var(--surface);position:relative;
}
.def{border-left:3px solid var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.thm{border-left:3px solid var(--teal);background:var(--teal-soft);border-color:var(--teal)}
.tip{border-left:3px solid var(--green);background:var(--green-soft);border-color:var(--green)}
.warn{border-left:3px solid var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.def .lb,.thm .lb,.tip .lb,.warn .lb{
  display:block;font-size:10.5px;letter-spacing:.14em;font-weight:600;margin-bottom:6px;
  text-transform:uppercase;font-family:var(--sans);
}
.def .lb{color:var(--accent)} .thm .lb{color:var(--teal)}
.tip .lb{color:var(--green)} .warn .lb{color:var(--amber)}
.def p:last-child,.thm p:last-child,.tip p:last-child,.warn p:last-child{margin-bottom:0}
.def b,.thm b{color:inherit}

/* table */
.tbl{width:100%;border-collapse:collapse;margin:18px 0;font-size:13.5px;background:var(--surface);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.tbl th{background:var(--surface-2);font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--ink2);text-align:left;padding:10px 13px;border-bottom:1px solid var(--line2)}
.tbl td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.75}
.tbl tr:last-child td{border-bottom:0}
.tbl td.c,.tbl th.c{text-align:center}
.tbl code{font-size:.85em}
.tbl-wrap{overflow-x:auto;margin:18px 0;border-radius:9px}
.tbl-wrap .tbl{margin:0;min-width:520px}

/* exercise */
.exs{margin:26px 0 8px}
.exs-h{
  display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.14em;
  color:var(--muted);font-weight:600;margin-bottom:12px;text-transform:uppercase;
}
.exs-h::after{content:"";flex:1;height:1px;background:var(--line)}
.exs-h em{font-style:normal;letter-spacing:0;color:var(--accent);font-size:11px}
.ex{
  border:1px solid var(--line);border-radius:10px;background:var(--surface);
  margin-bottom:10px;overflow:hidden;transition:border-color .2s;
}
.ex:hover{border-color:var(--line2)}
.ex.done{border-color:var(--green);background:var(--surface)}
.ex-q{display:flex;gap:12px;padding:15px 17px 12px;font-size:14.5px;line-height:1.85}
.ex-n{
  width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1px solid var(--line2);
  display:grid;place-items:center;font-size:11px;font-family:var(--serif);color:var(--muted);
  margin-top:3px;transition:.2s;
}
.ex.done .ex-n{background:var(--green);border-color:var(--green);color:#fff}
.ex-body{flex:1;min-width:0}
.ex-body p:last-child{margin-bottom:0}
.ex-tools{display:flex;gap:8px;padding:0 17px 14px 49px;flex-wrap:wrap}
.tbtn{
  font-family:var(--sans);font-size:12px;padding:4px 11px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line2);background:transparent;color:var(--ink2);transition:.15s;letter-spacing:.02em;
}
.tbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ex-hint,.ex-sol{display:none;margin:0 17px 14px 49px;padding:13px 15px;border-radius:8px;font-size:13.5px;line-height:1.85}
.ex-hint{background:var(--amber-soft);border:1px solid var(--amber)}
.ex-hint .lb{color:var(--amber);font-size:10.5px;letter-spacing:.12em;font-weight:600;display:block;margin-bottom:5px}
.ex-sol{background:var(--surface-2);border:1px solid var(--line2)}
.ex-sol .lb{color:var(--teal);font-size:10.5px;letter-spacing:.12em;font-weight:600;display:block;margin-bottom:9px}
.ex-sol .st{display:flex;gap:9px;margin-bottom:8px}
.ex-sol .st>i{
  font-style:normal;width:17px;height:17px;flex:0 0 17px;border-radius:4px;background:var(--teal);
  color:#fff;font-size:10px;display:grid;place-items:center;margin-top:3px;font-family:var(--sans);
}
.ex-sol .st>div{flex:1;min-width:0}
.ex-sol .an{
  margin-top:11px;padding-top:10px;border-top:1px dashed var(--line2);font-size:13.5px;
}
.ex-sol .an b{color:var(--accent)}
.ex-mark{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mbtn{
  font-size:11.5px;padding:3px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);transition:.15s;
}
.mbtn.yes:hover,.mbtn.yes.on{background:var(--green);border-color:var(--green);color:#fff}
.mbtn.no:hover,.mbtn.no.on{background:var(--amber);border-color:var(--amber);color:#fff}

/* mark studied */
.markdone{
  display:flex;align-items:center;justify-content:space-between;gap:16px;margin:38px 0 8px;
  padding:16px 20px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface-2);
  font-size:13px;color:var(--ink2);
}
.markdone button{
  font-size:12.5px;padding:7px 16px;border-radius:7px;cursor:pointer;border:1px solid var(--accent);
  background:var(--accent);color:#fff;transition:.15s;font-family:var(--sans);white-space:nowrap;
}
.markdone button:hover{filter:brightness(1.08)}
.markdone.done{border-style:solid;border-color:var(--green);background:var(--green-soft)}
.markdone.done button{background:var(--green);border-color:var(--green)}
.chapend{text-align:center;margin:20px 0 6px}
.chapend button{
  font-family:var(--sans);font-size:12.5px;padding:8px 20px;border-radius:20px;
  border:1px dashed var(--line2);background:transparent;color:var(--muted);cursor:pointer;transition:.15s;
}
.chapend button:hover{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- widgets ---------- */
.w{
  margin:24px 0;border:1px solid var(--line2);border-radius:11px;background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow);
}
.w-h{
  display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--line);
  background:var(--surface-2);font-size:12px;letter-spacing:.06em;color:var(--ink2);font-weight:600;
}
.w-h .sq{width:7px;height:7px;border-radius:2px;background:var(--accent);flex:0 0 7px}
.w-h em{font-style:normal;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.02em;margin-left:auto}
.w-b{padding:18px}
.w-cap{font-size:11.5px;color:var(--muted);line-height:1.75;padding:0 16px 14px;letter-spacing:.01em}
.w-ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:16px}
.w-ctl label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.w-ctl output{font-family:var(--math);font-size:14px;color:var(--accent);min-width:26px;display:inline-block;text-align:center;font-weight:600}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:var(--line2);
  width:118px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);
  border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;
}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:pointer}
.w-btn{
  font-family:var(--sans);font-size:12px;padding:5px 13px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2);transition:.15s;
}
.w-btn:hover{border-color:var(--accent);color:var(--accent)}
.w-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.w-btn.sm{padding:3px 9px;font-size:11.5px}
.w-out{font-family:var(--math);font-size:15px;line-height:2}
.w-out .big{font-size:22px;color:var(--accent);font-weight:600}
.kv{font-family:var(--sans);font-size:12.5px;color:var(--ink2)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:12px;border:1px solid var(--line2);background:var(--surface-2);color:var(--ink2);
  cursor:pointer;transition:.15s;font-family:var(--sans);
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
svg.wsvg{display:block;width:100%;height:auto;overflow:visible}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}

/* ---------- 速查手册 ---------- */
.pills{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 30px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  position:sticky;top:52px;z-index:20;
}
.pills button{
  font-family:var(--sans);font-size:12px;padding:4px 11px;border-radius:16px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2);
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.pills button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pills .sp{flex:1;min-width:8px}
.pills .pr{border-color:var(--accent);color:var(--accent)}
.sheet{margin:0 0 42px;scroll-margin-top:118px}
.sheet h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 0;letter-spacing:.01em;line-height:1.5}
.sheet .sub{
  font-size:11.5px;color:var(--muted);letter-spacing:.05em;margin:5px 0 16px;padding-bottom:11px;
  border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.sheet .sub a{font-size:11px;cursor:pointer;border-bottom:1px solid var(--accent-line)}
.sheet h3{font-size:14.5px;margin:22px 0 8px}
.sheet h3::before{content:"§";font-size:11px;margin-right:7px}
.tbl.dense{margin:10px 0 14px}
.tbl.dense td,.tbl.dense th{padding:7px 10px;font-size:12.8px;line-height:1.7}
.tbl.dense m{font-size:1.04em}
.sheet .f{margin:8px 0;padding:11px;font-size:16px}
@media print{.pills{display:none}}

/* mobile */
#mask{display:none;position:fixed;inset:0;background:rgba(30,24,16,.35);z-index:35;backdrop-filter:blur(2px)}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:0 0 40px rgba(0,0,0,.18)}
  body.nav #side{transform:none}
  body.nav #mask{display:block}
  #burger{display:grid}
  #doc{padding:28px 18px 16px}
  #bar{padding:0 16px}
  #pager{padding:8px 18px 40px;grid-template-columns:1fr}
  .pg.next{grid-column:1;text-align:left}
  .ch-head h1{font-size:26px}
  h2#sec-title{font-size:20px}
  .ex-tools,.ex-hint,.ex-sol{margin-left:0;padding-left:13px;padding-right:13px}
  .ex-tools{padding-left:17px}
}
@media print{
  #side,#bar,#pager,footer,.ex-tools,.markdone{display:none!important}
  #doc{max-width:none;padding:0}
  .ex-sol,.ex-hint{display:block!important}
  body{background:#fff}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="mark">离</div>
      <div>
        <h1>离散数学 · 逐章精读</h1>
        <p>Rosen《离散数学及其应用》8e<br>本科教学版 · 8 章</p>
      </div>
    </div>
    <div class="gauge">
      <div class="gauge-row"><span>学习进度</span><b id="pct">0%</b></div>
      <div class="bar"><i id="pbar" style="width:0%"></i></div>
      <div class="gauge-sub"><span id="psec">0 / 0 节</span><span id="pex">0 题掌握</span></div>
    </div>
    <div id="sumBtn">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5h6.5L13 5v8.5H4z"/><path d="M10 2.5V5h3"/><path d="M6 8h5M6 10.5h5"/></svg>
      <div><b>速查手册</b><span>全章知识点与公式</span></div>
    </div>
    <nav id="tree"></nav>
  </aside>
  <div id="mask"></div>
  <div id="main">
    <header id="bar">
      <button class="iconbtn" id="burger" aria-label="目录">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <div class="crumb"><b id="crumb">—</b></div>
      <div class="sp"></div>
      <button class="iconbtn" id="theme" aria-label="切换深浅色">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1"/></svg>
      </button>
    </header>
    <article id="doc"></article>
    <nav id="pager"></nav>
    <footer>
      基于罗森《离散数学及其应用》原书第 8 版 · 本科教学版（机械工业出版社，徐六通 / 杨娟 / 吴斌 译）章节编号编排<br>
      进度自动保存在本机浏览器 · 建议用 Chrome / Edge 打开
    </footer>
  </div>
</div>

<script>
/* ================= framework ================= */
var CH = window.CH || {};
var W = {};                    /* widget registry */
var ORDER = [];                /* flat list of {ch, sid, title, chtitle} */
var KEY = 'dm.rosen.v1';

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; }
}
var ST = load();
ST.sec = ST.sec || {};         /* sid -> 1 visited, 2 done */
ST.ex  = ST.ex  || {};         /* exid -> 'y' | 'n' */
ST.theme = ST.theme || 'light';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }

function esc(s){ return s; }
function h(html){ return html; }

/* build flat order */
function buildOrder(){
  ORDER = [];
  var nums = Object.keys(CH).map(Number).sort(function(a,b){return a-b;});
  nums.forEach(function(n){
    CH[n].sections.forEach(function(s){
      ORDER.push({c:n, sid:s.id, t:s.title, ct:CH[n].title, s:s});
    });
  });
}

function scanEx(){
  EXALL = {};
  ORDER.forEach(function(o){
    (o.s.blocks||[]).forEach(function(b,i){
      if(b.t==='exs'){
        var g = b.id || ('g'+i);
        b.items.forEach(function(q,k){ EXALL[g+'-'+k] = true; });
      }
    });
  });
}

/* ---------- sidebar ---------- */
function buildTree(){
  var box = document.getElementById('tree'), out = '';
  var nums = Object.keys(CH).map(Number).sort(function(a,b){return a-b;});
  nums.forEach(function(n){
    var c = CH[n];
    var done = c.sections.filter(function(s){return ST.sec[s.id]===2;}).length;
    var cur = ST.cur && String(ST.cur).split('.')[0] == n;
    out += '<div class="ch'+(cur?' on open':'')+'" data-ch="'+n+'">';
    out += '<div class="ch-h" data-toggle="'+n+'">';
    out += '<span class="ch-n">'+n+'</span><b>'+(c.short||c.title)+'</b>';
    out += '<svg width="9" height="9" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 1L5.5 4L2.5 7"/></svg>';
    out += '</div><div class="ch-s">';
    c.sections.forEach(function(s){
      var st = ST.sec[s.id]||0;
      var cls = 'sec'+(st===1?' v':'')+(st===2?' d':'')+(ST.cur===s.id?' on':'');
      out += '<div class="'+cls+'" data-sec="'+s.id+'"><span class="dot"></span><span>'+s.id+'&nbsp;&nbsp;'+s.title+'</span></div>';
    });
    out += '</div></div>';
  });
  box.innerHTML = out;
  var sb = document.getElementById('sumBtn');
  if(sb) sb.classList.toggle('on', ST.cur === 'sum');
  updateGauge();
}

function updateGauge(){
  var total = ORDER.length, done = 0, exok = 0;
  ORDER.forEach(function(o){ if(ST.sec[o.sid]===2) done++; });
  Object.keys(EXALL).forEach(function(k){ if(ST.ex[k]==='y') exok++; });
  var pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('pct').textContent = pct+'%';
  document.getElementById('pbar').style.width = pct+'%';
  document.getElementById('psec').textContent = done+' / '+total+' 节';
  document.getElementById('pex').textContent = exok+' 题掌握';
}
var EXALL = {};  /* exid -> true */

/* ---------- renderer ---------- */
var EXN = 0;

function renderBlocks(blocks){
  var out = '';
  blocks.forEach(function(b, i){
    var t = b.t;
    if(t==='p')    out += '<p'+(b.cls?' class="'+b.cls+'"':'')+'>'+b.h+'</p>';
    else if(t==='lead') out += '<p class="lead">'+b.h+'</p>';
    else if(t==='h3')   out += '<h3>'+b.h+'</h3>';
    else if(t==='hr')   out += '<hr>';
    else if(t==='ul')   out += '<ul>'+b.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
    else if(t==='ol')   out += '<ol>'+b.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>';
    else if(t==='f')    out += '<div class="f">'+b.h+(b.note?'<small>'+b.note+'</small>':'')+'</div>';
    else if(t==='def')  out += '<div class="def"><span class="lb">'+(b.lb||'定义')+'</span>'+b.h+'</div>';
    else if(t==='thm')  out += '<div class="thm"><span class="lb">'+(b.lb||'定理')+'</span>'+b.h+'</div>';
    else if(t==='tip')  out += '<div class="tip"><span class="lb">'+(b.lb||'要点')+'</span>'+b.h+'</div>';
    else if(t==='warn') out += '<div class="warn"><span class="lb">'+(b.lb||'易错')+'</span>'+b.h+'</div>';
    else if(t==='table'){
      out += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
        b.head.map(function(x){return '<th'+(x.c?' class="c"':'')+'>'+x+'</th>';}).join('')+
        '</tr></thead><tbody>'+
        b.rows.map(function(r){
          return '<tr>'+r.map(function(x){
            var c = (x&&x.c)?' class="c"':'';
            var v = (x&&x.h!==undefined)?x.h:x;
            return '<td'+c+'>'+v+'</td>';
          }).join('')+'</tr>';
        }).join('')+'</tbody></table></div>';
    }
    else if(t==='ex'){
      out += '<div class="ex" data-ex="'+(b.id||'')+'"><div class="ex-q"><span class="ex-n">例</span>'+
        '<div class="ex-body">'+(b.title?'<p><b>'+b.title+'</b></p>':'')+b.q+'</div></div>'+
        '<div class="ex-tools"><button class="tbtn" data-act="sol">展开解答</button></div>'+
        '<div class="ex-sol"><span class="lb">解答</span>'+
        b.steps.map(function(s,k){return '<div class="st"><i>'+(k+1)+'</i><div>'+s+'</div></div>';}).join('')+
        (b.ans?'<div class="an"><b>答：</b>'+b.ans+'</div>':'')+
        '</div></div>';
    }
    else if(t==='exs'){
      var grp = b.id || ('g'+i);
      out += '<div class="exs"><div class="exs-h">练习 · '+b.items.length+' 题<em>先自己动笔，再展开</em></div>';
      b.items.forEach(function(q, k){
        var id = grp+'-'+k;
        EXALL[id] = true;
        var cls = 'ex'+(ST.ex[id]==='y'?' done':'');
        out += '<div class="'+cls+'" data-ex="'+id+'" data-key="'+id+'"><div class="ex-q"><span class="ex-n">'+(k+1)+'</span>'+
          '<div class="ex-body">'+q.q+'</div></div>'+
          '<div class="ex-tools">'+
            (q.hint?'<button class="tbtn" data-act="hint">提示</button>':'')+
            '<button class="tbtn" data-act="sol">看解析</button>'+
          '</div>'+
          (q.hint?'<div class="ex-hint"><span class="lb">提示</span>'+q.hint+'</div>':'')+
          '<div class="ex-sol"><span class="lb">解析</span>'+
          (q.steps||[]).map(function(s,k2){return '<div class="st"><i>'+(k2+1)+'</i><div>'+s+'</div></div>';}).join('')+
          (q.ans?'<div class="an"><b>答：</b>'+q.ans+'</div>':'')+
          '<div class="ex-mark"><span>现在清楚了吗</span>'+
            '<button class="mbtn yes'+(ST.ex[id]==='y'?' on':'')+'" data-act="yes">会了</button>'+
            '<button class="mbtn no'+(ST.ex[id]==='n'?' on':'')+'" data-act="no">还懵</button>'+
          '</div></div></div>';
      });
      out += '</div>';
    }
    else if(t==='w'){
      out += '<div class="w" data-w="'+b.id+'"></div>';
    }
    else if(t==='grid'){
      out += '<div class="grid2">'+b.items.map(function(x){
        return '<div class="gcell"><b>'+x.t+'</b><div>'+x.h+'</div></div>';
      }).join('')+'</div>';
    }
  });
  return out;
}

/* ---------- routing ---------- */
function go(sid, push){
  var o = ORDER.filter(function(x){return x.sid===sid;})[0];
  if(!o) return;
  ST.cur = sid;
  if(!ST.sec[sid]) ST.sec[sid] = 1;
  save();

  var c = CH[o.c];
  var secIdx = c.sections.indexOf(c.sections.filter(function(s){return s.id===sid;})[0]);
  var html = '';

  if(secIdx === 0){
    html += '<div class="ch-head">'+
      '<div class="ch-kicker">第 '+o.c+' 章 · Chapter '+o.c+'</div>'+
      '<h1>'+c.title+(c.en?'<em> · '+c.en+'</em>':'')+'</h1>'+
      '<div class="ch-desc">'+c.intro+'</div></div>';
  }
  html += '<h2 id="sec-title">'+sid+'&nbsp;&nbsp;'+o.t+'</h2>';
  html += '<div class="sec-meta"><span>第 '+o.c+' 章 '+o.ct+'</span></div>';
  html += renderBlocks(o.s.blocks || []);

  var done = ST.sec[sid]===2;
  html += '<div class="markdone'+(done?' done':'')+'" data-mark="'+sid+'">'+
    '<span>'+(done?'本节已标记为学完，随时可以回来看。':'知识点读完了？标记一下，右侧进度会同步。')+'</span>'+
    '<button data-act="mark">'+(done?'✓ 已学完':'标记本节已学')+'</button></div>';

  var isLast = c.sections[c.sections.length-1].id === sid;
  if(isLast){
    html += '<div class="chapend"><button data-jumpsum="'+o.c+'">第 '+o.c+' 章知识点与公式速查 →</button></div>';
  }

  document.getElementById('doc').innerHTML = html;
  document.getElementById('crumb').innerHTML = '第 '+o.c+' 章 · '+o.ct+' <span style="opacity:.4">/</span> '+sid+' '+o.t;

  /* mount widgets */
  document.querySelectorAll('#doc [data-w]').forEach(function(el){
    var fn = W[el.getAttribute('data-w')];
    if(!fn){ el.outerHTML = '<div class="warn">组件 '+el.getAttribute('data-w')+' 未加载</div>'; return; }
    el.innerHTML = fn.html ? fn.html() : '';
    if(fn.mount) fn.mount(el);
  });

  buildTree();
  buildPager(sid);
  try{ if(push) history.replaceState(null,'','#'+sid); }catch(err){}
  window.scrollTo(0,0);
  document.body.classList.remove('nav');
  save();
}

function currentBlocks(sid){
  for(var i=0;i<ORDER.length;i++) if(ORDER[i].sid===sid) return ORDER[i].blocks;
  return [];
}

/* ---------- 速查手册 ---------- */
function goSum(anchor){
  ST.cur = 'sum'; save();
  var pills = '<div class="pills">';
  SUM.forEach(function(c){
    pills += '<button data-jump="sum-'+c.n+'">'+c.n+' '+c.title+'</button>';
  });
  pills += '<span class="sp"></span><button class="pr" data-print="1">打印</button></div>';

  var html = '<div class="ch-head">'+
    '<div class="ch-kicker">速查手册 · Formula Sheet</div>'+
    '<h1>知识点与公式<em>汇总</em></h1>'+
    '<div class="ch-desc">把八章的定义、定理、公式压到一页里。考前翻一遍，比重新读正文快得多；也可以直接打印成两张 A4 贴在桌前。'+
    '标 <b>★</b> 的是最高频、最容易记混的部分——优先看这几块。</div></div>'+
    pills;

  SUM.forEach(function(c){
    var first = (CH[c.n] && CH[c.n].sections[0]) ? CH[c.n].sections[0].id : '';
    html += '<section class="sheet" id="sum-'+c.n+'">'+
      '<h2>第 '+c.n+' 章　'+c.title+'</h2>'+
      '<div class="sub"><span>'+c.tag+'</span>'+
      (first?'<a data-go="'+first+'">去读正文 →</a>':'')+'</div>'+
      c.html+'</section>';
  });

  document.getElementById('doc').innerHTML = html;
  document.getElementById('crumb').innerHTML = '速查手册 <span style="opacity:.4">/</span> 知识点与公式汇总';
  var n0 = ORDER[0];
  document.getElementById('pager').innerHTML =
    '<div class="pg empty"></div>'+
    '<a class="pg next" data-go="'+n0.sid+'"><span>开始学习 →</span><b>'+n0.sid+' '+n0.t+'</b></a>';
  buildTree();
  document.body.classList.remove('nav');
  try{ history.replaceState(null,'','#sum'); }catch(err){}
  if(anchor){
    var t = document.getElementById('sum-'+anchor);
    if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
  } else {
    window.scrollTo(0,0);
  }
}

function buildPager(sid){
  var i = ORDER.map(function(x){return x.sid;}).indexOf(sid);
  var p = ORDER[i-1], n = ORDER[i+1];
  var el = document.getElementById('pager');
  el.innerHTML =
    (p?'<a class="pg prev" data-go="'+p.sid+'"><span>← 上一节</span><b>'+p.sid+' '+p.t+'</b></a>':'<div class="pg empty"></div>')+
    (n?'<a class="pg next" data-go="'+n.sid+'"><span>下一节 →</span><b>'+n.sid+' '+n.t+'</b></a>':'<div class="pg empty"></div>');
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el;
  if(e.target.closest('#sumBtn')){ goSum(null); return; }
  if((el = e.target.closest('[data-jumpsum]'))){ goSum(+el.getAttribute('data-jumpsum')); return; }
  if(e.target.closest('[data-print]')){ window.print(); return; }
  if((el = e.target.closest('[data-jump]'))){
    var tg = document.getElementById(el.getAttribute('data-jump'));
    if(tg) tg.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  if((el = e.target.closest('[data-go]'))) { go(el.getAttribute('data-go'), true); return; }
  if((el = e.target.closest('[data-toggle]'))){
    el.parentNode.classList.toggle('open');
    return;
  }
  if((el = e.target.closest('[data-sec]'))) { go(el.getAttribute('data-sec'), true); return; }

  var act = e.target.closest('[data-act]');
  if(act){
    var a = act.getAttribute('data-act'), box = act.closest('.ex');
    if(a==='hint'){
      var hd = box.querySelector('.ex-hint');
      hd.style.display = hd.style.display==='block'?'none':'block';
      act.classList.toggle('on');
      return;
    }
    if(a==='sol'){
      var sd = box.querySelector('.ex-sol');
      var open = sd.style.display==='block';
      sd.style.display = open?'none':'block';
      act.textContent = open?'看解析':'收起解析';
      act.classList.toggle('on', !open);
      return;
    }
    if(a==='yes'||a==='no'){
      var id = box.getAttribute('data-key');
      ST.ex[id] = (a==='yes')?'y':'n';
      box.classList.toggle('done', a==='yes');
      box.querySelectorAll('.mbtn').forEach(function(b){b.classList.remove('on');});
      act.classList.add('on');
      save(); updateGauge();
      return;
    }
    if(a==='mark'){
      var sid = act.closest('[data-mark]').getAttribute('data-mark');
      ST.sec[sid] = 2; save();
      act.closest('[data-mark]').classList.add('done');
      act.closest('[data-mark]').querySelector('span').textContent = '本节已标记为学完，随时可以回来看。';
      act.textContent = '✓ 已学完';
      buildTree();
      return;
    }
  }
});

document.getElementById('burger').onclick = function(){ document.body.classList.toggle('nav'); };
document.getElementById('mask').onclick = function(){ document.body.classList.remove('nav'); };
document.getElementById('theme').onclick = function(){
  var t = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', t);
  ST.theme = t; save();
};
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(ST.cur==='sum'){ if(e.key==='ArrowRight'&&ORDER[0]) go(ORDER[0].sid,true); return; }
  var i = ORDER.map(function(x){return x.sid;}).indexOf(ST.cur);
  if(e.key==='ArrowRight'&&ORDER[i+1]) go(ORDER[i+1].sid,true);
  if(e.key==='ArrowLeft'&&ORDER[i-1])  go(ORDER[i-1].sid,true);
});

/* ---------- boot ---------- */
function boot(){
  document.documentElement.setAttribute('data-theme', ST.theme||'light');
  buildOrder();
  scanEx();
  buildTree();
  var start = location.hash.replace('#','') || ST.cur || '3.5.1';
  if(start === 'sum'){ goSum(null); return; }
  if(!ORDER.filter(function(x){return x.sid===start;}).length) start = ORDER[0].sid;
  go(start, true);
}
</script>

<style>
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.gcell{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:var(--surface);font-size:13.5px;line-height:1.8}
.gcell b{display:block;color:var(--accent);font-size:12.5px;letter-spacing:.03em;margin-bottom:4px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
</style>

<script>
/* ===== w1.js ===== */
/* ============ helpers ============ */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function cnk(n,k){ if(k<0||k>n) return 0; k=Math.min(k,n-k); var r=1; for(var i=1;i<=k;i++){ r=r*(n-k+i)/i; } return Math.round(r); }
function fact(n){ var r=1; for(var i=2;i<=n;i++) r*=i; return r; }
function fmt(n){ return n.toLocaleString('en-US'); }

document.head.insertAdjacentHTML('beforeend',
'<style>'+
'.tt{width:100%;border-collapse:collapse;font-family:var(--math);font-size:14px}'+
'.tt th,.tt td{border:1px solid var(--line);padding:7px 8px;text-align:center;transition:background .2s}'+
'.tt th{background:var(--surface-2);font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--ink2);letter-spacing:.06em}'+
'.tt td.hl{background:var(--accent-soft);color:var(--accent);font-weight:600}'+
'.tt td.res{background:var(--teal-soft);color:var(--teal);font-weight:600}'+
'.vlbl{font-family:var(--sans);font-size:12px;fill:var(--muted)}'+
'.vennwrap{position:relative;max-width:520px;margin:0 auto}'+
'.dotrow{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}'+
'.db{width:52px;height:52px;border-radius:9px;border:1px solid var(--line2);background:var(--surface-2);'+
'display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;transition:.2s;position:relative}'+
'.db b{font-family:var(--math);font-size:16px;line-height:1.2}'+
'.db .vf{font-family:var(--sans);font-size:10px;letter-spacing:.04em;margin-top:1px}'+
'.db.t{border-color:var(--green);background:var(--green-soft)}'+
'.db.t .vf{color:var(--green)}'+
'.db.f{opacity:.45}'+
'.db.f .vf{color:var(--muted)}'+
'.db.witness{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}'+
'.db.witness .vf{color:var(--accent)}'+
'.verdict{margin-top:14px;padding:11px 14px;border-radius:8px;font-size:13.5px;line-height:1.85;border:1px solid var(--line2);background:var(--surface-2)}'+
'.verdict b{font-family:var(--math);font-size:15px}'+
'.verdict.true{border-color:var(--green);background:var(--green-soft)}'+
'.verdict.false{border-color:var(--amber);background:var(--amber-soft)}'+
'.mtx{display:inline-grid;gap:3px;font-family:var(--math);font-size:13px}'+
'.mtx .c{width:38px;height:34px;display:grid;place-items:center;border-radius:5px;background:var(--surface-2);border:1px solid var(--line)}'+
'.mtx .c.T{background:var(--green-soft);color:var(--green);border-color:var(--green)}'+
'.mtx .c.F{background:transparent;color:var(--muted)}'+
'.mtx .hd{display:grid;place-items:center;font-family:var(--sans);font-size:11px;color:var(--muted)}'+
'.mtx .c.pick{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}'+
'.mtx .c.hole{outline:1.5px dashed var(--accent);outline-offset:2px}'+
'.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.cols2{grid-template-columns:1fr}}'+
'</style>');

/* ================= 1.1 真值表 ================= */
W['truth'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>真值表实验台<em>点一个联结词，看它什么时候为真</em></div>'+
      '<div class="w-b"><div class="w-ctl" id="tChips"></div><div id="tBody"></div></div>';
  },
  mount: function(el){
    var P = [
      {k:'neg', n:'¬p',      d:'否定：真变假，假变真', one:true, f:function(a,b){return !a;}, note:'最简单的一个，没有争议。'},
      {k:'and', n:'p ∧ q',   d:'合取：两个都真才真',   f:function(a,b){return a&&b;}, note:'像「不但…而且…」，缺一个就塌。'},
      {k:'or',  n:'p ∨ q',   d:'析取：至少一个真就真', f:function(a,b){return a||b;}, note:'注意这是「相容或」——两个都真时也算真。'},
      {k:'xor', n:'p ⊕ q',   d:'异或：恰好一个真',     f:function(a,b){return a!==b;}, note:'「要么…要么…」的那种或，食堂只给一个菜。'},
      {k:'imp', n:'p → q',   d:'蕴含：只有 T → F 是假',f:function(a,b){return !a||b;}, note:'这是全章最反直觉的一条。前件假时，整个蕴含自动为真——「如果明天下雨，我就带伞」，明天没下雨，你不能说我撒谎。'},
      {k:'bic', n:'p ↔ q',   d:'双条件：真值相同才真', f:function(a,b){return a===b;}, note:'等价于 (p→q)∧(q→p)，两个方向都得成立。'},
      {k:'ctr', n:'(p→q) ∧ (q→p)', d:'蕴含的双向版本', f:function(a,b){return (!a||b)&&(!b||a);}, note:'展开后你会发现它和 p↔q 一模一样——这就是双条件的定义方式。'}
    ];
    var rows = [[true,true],[true,false],[false,true],[false,false]];
    var cur = 'imp';
    function T(v){return v?'T':'F';}
    function draw(){
      var p = P.filter(function(x){return x.k===cur;})[0];
      $('#tChips',el).innerHTML = P.map(function(x){
        return '<span class="chip'+(x.k===cur?' on':'')+'" data-k="'+x.k+'">'+x.n+'</span>';
      }).join('');
      var head = p.one ? ['p','¬p'] : ['p','q',p.n];
      var body = '';
      rows.forEach(function(r){
        var val = p.f(r[0],r[1]);
        var isBad = (p.k==='imp' && r[0] && !r[1]);
        body += '<tr>'+
          (p.one?'':'<td>'+T(r[0])+'</td>')+
          '<td class="'+(p.one?'':'')+'">'+T(p.one?r[0]:r[1])+'</td>'+
          '<td class="res'+(isBad?' hl':'')+'">'+T(val)+'</td></tr>';
      });
      $('#tBody',el).innerHTML =
        '<table class="tt"><thead><tr>'+head.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead>'+
        '<tbody>'+body+'</tbody></table>'+
        '<div class="verdict">'+p.d+'。<br><span style="color:var(--muted);font-size:12.5px">'+p.note+'</span></div>';
    }
    el.addEventListener('click', function(e){
      var c = e.target.closest('[data-k]');
      if(c){ cur = c.getAttribute('data-k'); draw(); }
    });
    draw();
  }
};

/* ================= 1.4 量词 ================= */
W['quant'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>量词到底在说什么<em>论域只有 8 个元素，全部摊开看</em></div>'+
      '<div class="w-b"><div class="w-ctl" id="qCtl"></div><div class="dotrow" id="qDots"></div><div id="qOut"></div></div>'+
      '<div class="w-cap">把「∀ 对所有」和「∃ 存在」翻译成「检查每一个」和「找一个就够」，量词就没什么神秘的了。</div>';
  },
  mount: function(el){
    var dom = [1,2,3,4,5,6,7,8];
    var preds = [
      {k:'even', n:'P(x)：x 是偶数', f:function(x){return x%2===0;}},
      {k:'prime',n:'P(x)：x 是质数', f:function(x){return [2,3,5,7].indexOf(x)>=0;}},
      {k:'gt5',  n:'P(x)：x > 5',    f:function(x){return x>5;}},
      {k:'sq',   n:'P(x)：x 是完全平方数', f:function(x){return [1,4].indexOf(x)>=0;}}
    ];
    var q = 'all', p = 'even';
    function draw(){
      $('#qCtl',el).innerHTML =
        '<label>量词</label>'+
        '<span class="chip'+(q==='all'?' on':'')+'" data-q="all">∀x P(x)</span>'+
        '<span class="chip'+(q==='ex'?' on':'')+'" data-q="ex">∃x P(x)</span>'+
        '<span class="chip'+(q==='nall'?' on':'')+'" data-q="nall">¬∀x P(x)</span>'+
        '<span style="width:100%;height:0"></span>'+
        preds.map(function(x){return '<span class="chip'+(x.k===p?' on':'')+'" data-p="'+x.k+'">'+x.n+'</span>';}).join('');
      var f = preds.filter(function(x){return x.k===p;})[0].f;
      var truth = dom.map(f), nT = truth.filter(Boolean).length;
      var witness = -1;
      var res, cls;
      if(q==='all'){ res = nT===dom.length; cls = res?'true':'false'; witness = truth.indexOf(false); }
      else if(q==='ex'){ res = nT>0; cls = res?'true':'false'; witness = truth.indexOf(true); }
      else { res = nT!==dom.length; cls = res?'true':'false'; witness = truth.indexOf(false); }
      $('#qDots',el).innerHTML = dom.map(function(x,i){
        var t = truth[i];
        var w = (q==='all'&&!t)||(q==='ex'&&t)||(q==='nall'&&!t);
        return '<div class="db '+(t?'t':'f')+(w && (q!=='ex'||t)?' witness':'')+'"><b>'+x+'</b><span class="vf">'+(t?'真':'假')+'</span></div>';
      }).join('');
      var label = q==='all'?'∀x P(x)':q==='ex'?'∃x P(x)':'¬∀x P(x)';
      var expl = '';
      if(q==='all'){
        expl = res ? '所有 8 个元素都满足，所以为<b>真</b>。' :
          '第 '+(witness+1)+' 个元素 x = '+dom[witness]+' 不满足 P，一个反例就够了，所以为<b>假</b>。';
      } else if(q==='ex'){
        expl = res ? '找到 x = '+dom[witness]+' 满足 P，存在性成立，所以为<b>真</b>。' :
          '8 个元素逐个检查都不满足，所以为<b>假</b>。';
      } else {
        expl = res ? 'x = '+dom[witness]+' 是反例，说明「对所有」不成立，所以¬∀为<b>真</b>。' :
          '全部满足，∀ 为真，所以它的否定为<b>假</b>。';
      }
      $('#qOut',el).innerHTML = '<div class="verdict '+cls+'">'+label+' 的真值是 <b>'+(res?'T':'F')+'</b>。'+expl+
        '<br><span style="color:var(--muted);font-size:12.5px">记住这条：¬∀x P(x) ≡ ∃x ¬P(x)，否定会把量词翻个面。</span></div>';
    }
    el.addEventListener('click', function(e){
      var a = e.target.closest('[data-q]'), b = e.target.closest('[data-p]');
      if(a) q = a.getAttribute('data-q');
      if(b) p = b.getAttribute('data-p');
      if(a||b) draw();
    });
    draw();
  }
};

/* ================= 1.5 嵌套量词 ================= */
W['nestq'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>量词顺序为什么不能换<em>同一个矩阵，两种读法</em></div>'+
      '<div class="w-b"><div class="w-ctl" id="nCtl"></div><div id="nBody"></div></div>'+
      '<div class="w-cap">矩阵里 T 表示 P(x,y) 成立。∀x∃y 是「每一行都要有一个 T」，∃y∀x 是「有一整列全是 T」——要求完全不同。</div>';
  },
  mount: function(el){
    var dom = [1,2,3];
    var preds = [
      {k:'sum4', n:'P(x,y)：x + y = 4', f:function(x,y){return x+y===4;}},
      {k:'lt',   n:'P(x,y)：x < y',      f:function(x,y){return x<y;}},
      {k:'prod6',n:'P(x,y)：x·y = 6',    f:function(x,y){return x*y===6;}},
      {k:'eq',   n:'P(x,y)：x = y',      f:function(x,y){return x===y;}}
    ];
    var cur = 'sum4';
    function draw(){
      var p = preds.filter(function(x){return x.k===cur;})[0];
      $('#nCtl',el).innerHTML = preds.map(function(x){
        return '<span class="chip'+(x.k===cur?' on':'')+'" data-k="'+x.k+'">'+x.n+'</span>';
      }).join('');
      var m = dom.map(function(x){ return dom.map(function(y){ return p.f(x,y); }); });

      var aTrue = true, aWit = [], aBad = -1;
      m.forEach(function(row,i){
        var j = row.indexOf(true);
        if(j<0){ aTrue = false; if(aBad<0) aBad = i; aWit.push(-1); }
        else aWit.push(j);
      });
      var bTrue = false, bCol = -1;
      for(var j=0;j<3;j++){ if(m[0][j]&&m[1][j]&&m[2][j]){ bTrue=true; bCol=j; break; } }

      var g = 'display:inline-grid;grid-template-columns:34px repeat(3,38px);gap:3px';
      var out = '<div class="cols2"><div>';
      out += '<div class="kv" style="margin-bottom:8px">真值矩阵 <span style="color:var(--muted)">（行 = x，列 = y）</span></div>';
      out += '<div class="mtx" style="'+g+'">';
      out += '<div class="hd"></div>';
      dom.forEach(function(y){ out += '<div class="hd">y='+y+'</div>'; });
      m.forEach(function(row,i){
        out += '<div class="hd">x='+i+1+'</div>';
        row.forEach(function(v,j){
          var pick = (aWit[i]===j && aTrue) || (bTrue && bCol===j);
          out += '<div class="c '+(v?'T':'F')+(pick?' pick':'')+'">'+(v?'T':'F')+'</div>';
        });
      });
      out += '</div></div><div>';

      out += '<div class="verdict '+(aTrue?'true':'false')+'"><b>∀x∃y P(x,y)</b> ：<b>'+(aTrue?'T':'F')+'</b><br>'+
        (aTrue ? '每一行都找到了配对的 y：'+[0,1,2].map(function(i){return 'x='+dom[i]+'→y='+dom[aWit[i]];}).join('，')+'。'+
                 '<br><span style="color:var(--muted);font-size:12.5px">每个 x 可以配不同的 y，这就够了。</span>'
               : '第 '+(aBad+1)+' 行整行都是 F，找不到任何 y 能和它配对。')+'</div>';

      out += '<div class="verdict '+(bTrue?'true':'false')+'" style="margin-top:10px"><b>∃y∀x P(x,y)</b> ：<b>'+(bTrue?'T':'F')+'</b><br>'+
        (bTrue ? '存在一列 y='+dom[bCol]+'，三个 x 全部满足——同一个 y 要通吃。'
               : '没有任何一列全为 T，也就是说没有哪个 y 能让所有 x 都满足。')+'</div>';

      out += '</div></div>';
      out += '<div class="verdict" style="margin-top:14px;background:var(--surface);border-color:var(--line2)">'+
        '永远有 <b>∃y∀x P(x,y) → ∀x∃y P(x,y)</b>，反过来不成立。'+
        '<br><span style="color:var(--muted);font-size:12.5px">直觉：「有一把钥匙能开所有门」比「每扇门都有一把钥匙能开」强得多。</span></div>';
      $('#nBody',el).innerHTML = out;
    }
    el.addEventListener('click', function(e){
      var c = e.target.closest('[data-k]');
      if(c){ cur = c.getAttribute('data-k'); draw(); }
    });
    draw();
  }
};

/* ================= 2.2 文氏图 ================= */
W['venn'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>集合运算看得见<em>换一个运算，看哪块被涂上</em></div>'+
      '<div class="w-b"><div class="w-ctl" id="vCtl"></div>'+
      '<div class="vennwrap"><svg viewBox="0 0 520 300" class="wsvg" id="vSvg"></svg></div>'+
      '<div id="vNote"></div></div>';
  },
  mount: function(el){
    var AX=210, AY=155, R=92, BX=330, BY=155;
    var ops = [
      {k:'cup',   n:'A ∪ B',   t:'并集：属于 A 或属于 B（或都属）。'},
      {k:'cap',   n:'A ∩ B',   t:'交集：同时属于 A 和 B。'},
      {k:'diff',  n:'A − B',   t:'差集：属于 A 但不属于 B。注意不是对称的。'},
      {k:'rdiff', n:'B − A',   t:'差集：属于 B 但不属于 A。和 A−B 完全不同。'},
      {k:'sym',   n:'A ⊕ B',   t:'对称差：恰好属于其中一个。等于 (A∪B)−(A∩B)。'},
      {k:'comp',  n:'Aᶜ',      t:'补集：在全集 U 里但不属于 A。'},
      {k:'ncup',  n:'(A∪B)ᶜ',  t:'德摩根：等于 Aᶜ ∩ Bᶜ。'}

    var cur = 'cap';
    var NS = 'http://www.w3.org/2000/svg';
    function draw(){
      $('#vCtl',el).innerHTML = ops.map(function(x){
        return '<span class="chip'+(x.k===cur?' on':'')+'" data-k="'+x.k+'">'+x.n+'</span>';
      }).join('');
      var defs = '<defs>'+
        '<clipPath id="vclipA"><circle cx="'+AX+'" cy="'+AY+'" r="'+R+'"/></clipPath>'+
        '<mask id="vnotB"><rect width="520" height="300" fill="#fff"/><circle cx="'+BX+'" cy="'+BY+'" r="'+R+'" fill="#000"/></mask>'+
        '<mask id="vnotA"><rect width="520" height="300" fill="#fff"/><circle cx="'+AX+'" cy="'+AY+'" r="'+R+'" fill="#000"/></mask>'+
        '<mask id="vnotAB"><rect width="520" height="300" fill="#fff"/><circle cx="'+AX+'" cy="'+AY+'" r="'+R+'" fill="#000"/><circle cx="'+BX+'" cy="'+BY+'" r="'+R+'" fill="#000"/></mask>'+
        '</defs>';
      var ac = 'var(--accent)';
      var hl = '';
      if(cur==='cup')   hl = '<g fill="'+ac+'" opacity=".3"><circle cx="'+AX+'" cy="'+AY+'" r="'+R+'"/><circle cx="'+BX+'" cy="'+BY+'" r="'+R+'" mask="url(#vnotA)"/></g>';
      if(cur==='cap')   hl = '<g fill="'+ac+'" opacity=".3"><g clip-path="url(#vclipA)"><circle cx="'+BX+'" cy="'+BY+'" r="'+R+'"/></g></g>';
      if(cur==='diff')  hl = '<g fill="'+ac+'" opacity=".3"><circle cx="'+AX+'" cy="'+AY+'" r="'+R+'" mask="url(#vnotB)"/></g>';
      if(cur==='rdiff') hl = '<g fill="'+ac+'" opacity=".3"><circle cx="'+BX+'" cy="'+BY+'" r="'+R+'" mask="url(#vnotA)"/></g>';
      if(cur==='sym')   hl = '<g fill="'+ac+'" opacity=".3"><circle cx="'+AX+'" cy="'+AY+'" r="'+R+'" mask="url(#vnotB)"/><circle cx="'+BX+'" cy="'+BY+'" r="'+R+'" mask="url(#vnotA)"/></g>';
      if(cur==='comp')  hl = '<g fill="'+ac+'" opacity=".3"><rect x="18" y="18" width="484" height="264" rx="10" mask="url(#vnotA)"/></g>';
      if(cur==='ncup')  hl = '<g fill="'+ac+'" opacity=".3"><rect x="18" y="18" width="484" height="264" rx="10" mask="url(#vnotAB)"/></g>';

      $('#vSvg',el).innerHTML = defs+
        '<rect x="18" y="18" width="484" height="264" rx="10" fill="none" stroke="var(--line2)" stroke-width="1"/>'+
        '<text class="vlbl" x="32" y="40">U</text>'+
        hl+
        '<circle cx="'+AX+'" cy="'+AY+'" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="1.2"/>'+
        '<circle cx="'+BX+'" cy="'+BY+'" r="'+R+'" fill="none" stroke="var(--teal)" stroke-width="1.2"/>'+

      var o = ops.filter(function(x){return x.k===cur;})[0];
      $('#vNote',el).innerHTML = '<div class="verdict"><b>'+o.n+'</b> —— '+o.t+'</div>';

/* ================= 2.3 单射/满射 ================= */
W['inject'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>单射、满射、双射<em>看箭头，别背定义</em></div>'+
      '<div class="w-b"><div class="w-ctl" id="iCtl"></div><div id="iSvgWrap"></div><div id="iOut"></div></div>'+
      '<div class="w-cap">单射看左边：有没有两根箭头指向同一个目标。满射看右边：有没有哪个元素没被指到。</div>';
  },
  mount: function(el){
    var cases = [
      {k:'inj', n:'单射不满射', X:['a','b','c','d'], Y:['1','2','3','4','5'], f:[0,1,2,3]},
      {k:'sur', n:'满射不单射', X:['a','b','c','d','e'], Y:['1','2','3'], f:[0,0,1,2,1]},
      {k:'bij', n:'双射',       X:['a','b','c','d'], Y:['1','2','3','4'], f:[1,3,0,2]},
      {k:'none',n:'既非单射也非满射', X:['a','b','c','d'], Y:['1','2','3','4','5'], f:[0,0,1,1]}
    ];
    var cur = 'inj';
    function draw(){
      $('#iCtl',el).innerHTML = cases.map(function(x){
        return '<span class="chip'+(x.k===cur?' on':'')+'" data-k="'+x.k+'">'+x.n+'</span>';
      }).join('');
      var c = cases.filter(function(x){return x.k===cur;})[0];
      var H = Math.max(c.X.length, c.Y.length)*44 + 60;
      var lx = 110, rx = 390;
      var yTop = 40, gap = 44;
      function yo(i,n){ return yTop + (H-2*yTop-gap*(n-1))/2 + i*gap; }
      var svg = '<svg viewBox="0 0 500 '+H+'" class="wsvg">';
      svg += '<defs><marker id="iar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">'+
             '<path d="M0 1L8 5L0 9" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></marker></defs>';
      svg += '<text class="vlbl" x="'+lx+'" y="22" text-anchor="middle" style="fill:var(--ink2)">X（定义域）</text>';
      svg += '<text class="vlbl" x="'+rx+'" y="22" text-anchor="middle" style="fill:var(--ink2)">Y（陪域）</text>';
      c.X.forEach(function(x,i){
        var y = yo(i,c.X.length);
        svg += '<circle cx="'+lx+'" cy="'+y+'" r="15" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>'+
               '<text x="'+lx+'" y="'+(y+5)+'" text-anchor="middle" font-size="13" font-family="var(--math)" fill="var(--accent)">'+x+'</text>';
      });
      var hit = {};
      c.Y.forEach(function(y,j){
        var yy = yo(j,c.Y.length);
        var used = c.f.indexOf(j) >= 0;
        var multip = c.f.filter(function(t){return t===j;}).length > 1;
        hit[j] = used;
        svg += '<circle cx="'+rx+'" cy="'+yy+'" r="15" fill="'+(used?'var(--teal-soft)':'transparent')+'" stroke="'+(multip?'var(--amber)':'var(--teal)')+'" stroke-width="'+(multip?2:1)+'"/>'+

      });
      c.X.forEach(function(x,i){
        var y1 = yo(i,c.X.length), y2 = yo(c.f[i], c.Y.length);
        var mx = (lx+rx)/2;
        svg += '<path d="M'+(lx+17)+' '+y1+' C'+mx+' '+y1+' '+mx+' '+y2+' '+(rx-19)+' '+y2+'" fill="none" stroke="var(--accent)" stroke-width="1.2" opacity=".65" marker-end="url(#iar)"/>';
      });
      svg += '</svg>';
      $('#iSvgWrap',el).innerHTML = svg;

      var targets = {};
      c.f.forEach(function(t){ targets[t]=(targets[t]||0)+1; });
      var inj = Object.keys(targets).every(function(k){return targets[k]===1;});
      var sur = c.Y.every(function(x,j){ return hit[j]; });
      var kind = inj&&sur ? '双射' : inj ? '单射' : sur ? '满射' : '既非单射也非满射';
      $('#iOut',el).innerHTML =
        '<div class="cols2" style="margin-top:12px">'+
        '<div class="verdict '+(inj?'true':'false')+'"><b>单射</b>（injective）：'+(inj?'成立':'不成立')+'<br>'+
          '<span style="color:var(--muted);font-size:12.5px">'+(inj?'|X| ≤ |Y|，每个目标最多被指一次。':('有目标被指了不止一次（橙色圈）。'))+'</span></div>'+
        '<div class="verdict '+(sur?'true':'false')+'"><b>满射</b>（surjective）：'+(sur?'成立':'不成立')+'<br>'+
          '<span style="color:var(--muted);font-size:12.5px">'+(sur?'|X| ≥ |Y|，Y 里没有落空的。':('Y 里有元素没被指到（空心圈）。'))+'</span></div></div>'+
        '<div class="verdict" style="margin-top:10px"><b>结论：'+kind+'</b>'+
        '<br><span style="color:var(--muted);font-size:12.5px">有限集上，|X|=|Y| 时单射 ⟺ 满射 ⟺ 双射，三者会同时成立。</span></div>';
    }
    el.addEventListener('click', function(e){
      var c = e.target.closest('[data-k]');
      if(c){ cur = c.getAttribute('data-k'); draw(); }
    });
    draw();
  }
};

W['permcomb'] = {
  html: function(){

      '<div class="w-ctl"><label>n = <output id="pcN">5</output><input type="range" id="pcNs" min="2" max="10" value="5"></label>'+
      '<label>r = <output id="pcR">3</output><input type="range" id="pcRs" min="0" max="8" value="3"></label></div>'+
      '<div class="w-ctl" id="pcChips"></div>'+
      '<div id="pcBody"></div></div>'+
      '<div class="w-cap">四个格子其实只在回答两个问题：<b>顺序要不要紧</b>、<b>能不能重复选</b>。回答完，公式自己就出来了。</div>';
  },
  mount: function(el){
    var mode = 'P', n = 5, r = 3;
    function draw(){
      var modes = [
        {k:'P', n:'排列 P(n,r)', d:'有序 · 不重复'},
        {k:'C', n:'组合 C(n,r)', d:'无序 · 不重复'},
        {k:'R', n:'重复排列 n<sup>r</sup>', d:'有序 · 可重复'},
        {k:'B', n:'重复组合 C(n+r−1,r)', d:'无序 · 可重复'}
      ];
      $('#pcChips',el).innerHTML = modes.map(function(x){
        return '<span class="chip'+(x.k===mode?' on':'')+'" data-k="'+x.k+'">'+x.n+'</span>';
      }).join('');

      var fx='', val='', word='', note='';
      if(mode==='P'){
        var ok = r<=n;
        fx = 'P('+n+','+r+') = <span class="frac"><span>'+n+'!</span><span>('+n+'−'+r+')!</span></span>';
        val = ok ? fmt(fact(n)/fact(n-r)) : '0';
        word = '从 '+n+' 个不同对象里取 '+r+' 个排成一列。第一个位置有 '+n+' 种选法，第二个 '+Math.max(n-1,0)+' 种……所以乘起来。';
        note = ok?'':'"r ≤ n"，取不出比总数还多的不重复元素。';
      } else if(mode==='C'){
        var ok2 = r<=n;
        fx = 'C('+n+','+r+') = <span class="frac"><span>'+n+'!</span><span>'+r+'!('+n+'−'+r+')!</span></span>';
        val = ok2 ? fmt(cnk(n,r)) : '0';
        word = '先按顺序取（P('+n+','+r+')），再把重复计数的次序除掉——'+r+' 个东西有 '+r+'! 种排法，所以除以 '+r+'!。';
        note = ok2?'':'同样要求 r ≤ n。';
      } else if(mode==='R'){
        fx = n+'<sup>'+r+'</sup> = '+Array(r).fill(n).join(' × ');
        val = fmt(Math.pow(n,r));
        word = '有 '+r+' 个位置，每个位置都能从 '+n+' 种里任选，互不干扰，直接乘 '+r+' 次。';
        note = '这里 r 可以大于 n——因为每次选完可以放回去。';
      } else {

        val = fmt(cnk(n+r-1,r));
        word = '把 '+r+' 个相同的球分到 '+n+' 个不同的盒子里：'+r+' 个星、'+(n-1)+' 个隔板，共 '+(n+r-1)+' 个位置里挑 '+r+' 个放星。';
        note = '这就是隔板法，下面有专门的组件。';

      $('#pcBody',el).innerHTML =
        '<div class="pc-out"><div><div class="fx">'+fx+'</div>'+
        '<div class="pc-word">'+word+(note?'<br><span style="color:var(--amber)">'+note+'</span>':'')+'</div></div>'+
        '<div class="nm">'+val+'</div></div>';
    }
    $('#pcNs',el).oninput = function(){ n=+this.value; $('#pcN',el).textContent=n; if(mode!=='R'&&mode!=='B'&&r>n){r=n;$('#pcRs',el).value=n;$('#pcR',el).textContent=n;} draw(); };
    $('#pcRs',el).oninput = function(){ r=+this.value; $('#pcR',el).textContent=r; draw(); };

W['stars'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>隔板法：星星和棍子<em>为什么重复组合是 C(n+r−1, r)</em></div>'+
      '<div class="w-b">'+
      '<div class="w-ctl"><label>球数 r = <output id="stR">6</output><input type="range" id="stRs" min="1" max="10" value="6"></label>'+
      '<label>盒子数 n = <output id="stN">4</output><input type="range" id="stNs" min="2" max="6" value="4"></label>'+
      '<button class="w-btn" id="stShuffle">换一种分法</button></div>'+
      '<div id="stBody"></div></div>'+
      '<div class="w-cap">每一串星星和隔板的排法，唯一对应一个解 (x₁, x₂, …)。所以数排法就是数解的个数。盒子允许为空，就是因为两个隔板可以挨着。</div>';
  },
  mount: function(el){
    var r = 6, n = 4, comp = null;
    function randComp(){
      var a = [], left = r;
      for(var i=0;i<n;i++){
        if(i===n-1){ a.push(left); left=0; }
        else { var hi = left; var v = Math.floor(Math.random()*(hi+1)); a.push(v); left-=v; }
      }
      return a;
    }
    function draw(){
      if(!comp || comp.length!==n || comp.reduce(function(a,b){return a+b;},0)!==r) comp = randComp();
      var s = '';
      comp.forEach(function(v,i){
        s += Array(v+1).join('<span class="st">★</span>');
        if(i<n-1) s += '<span class="br">│</span>';
      });
      if(s==='') s = '<span style="color:var(--muted)">（r = 0 时只有隔板）</span>';
      var tuple = '('+comp.join(', ')+')';
      var total = r + n - 1;
      $('#stBody',el).innerHTML =
        '<div class="sb">'+s+'</div>'+
        '<div class="kv" style="text-align:center;margin-top:10px">对应的解：<b style="font-family:var(--math);font-size:15px;color:var(--accent)">x₁ + x₂ + … + x'+'<sub>'+n+'</sub> = '+r+'</b> → '+tuple+'</div>'+
        '<div class="cols2" style="margin-top:14px">'+
          '<div class="verdict"><b>数排法</b><br>一共 '+r+' 颗星、'+(n-1)+' 根隔板，共 <b>'+total+'</b> 个位置。'+
          '<br>挑 '+r+' 个位置放星星：<b>C('+total+','+r+') = '+fmt(cnk(total,r))+'</b></div>'+
          '<div class="verdict"><b>也可以这么想</b><br>挑 '+(n-1)+' 个位置放隔板：'+
          '<b>C('+total+','+(n-1)+') = '+fmt(cnk(total,n-1))+'</b>'+
          '<br><span style="color:var(--muted);font-size:12.5px">两个数一定相等：C(N,k) = C(N,N−k)。</span></div>'+
        '</div>'+
        '<div class="verdict" style="margin-top:10px;background:var(--surface);border-color:var(--line2)">'+
        '<b>把「允许为空」改成「每盒至少一个」</b>：先给每个盒子垫 1 个球，剩 '+(r-n>0?r-n:0)+' 个再随便分，答案变成 C('+(r-1)+','+(n-1)+') = '+
        (r>=n?fmt(cnk(r-1,n-1)):'0（球不够，无解）')+'。</div>';
    }
    $('#stRs',el).oninput = function(){ r=+this.value; $('#stR',el).textContent=r; comp=null; if(r<n) {} draw(); };
    $('#stNs',el).oninput = function(){ n=+this.value; $('#stN',el).textContent=n; comp=null; draw(); };
    $('#stShuffle',el).onclick = function(){ comp = randComp(); draw(); };
    if(r<n) r = n;
    draw();
  }
};

/* ================= 3.5.5 放入盒子 ================= */
W['boxes'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>把物体放进盒子：四种世界<em>3.5.5 的核心表</em></div>'+
      '<div class="w-b">'+
      '<div class="w-ctl"><label>物体数 m = <output id="bxM">5</output><input type="range" id="bxMs" min="3" max="7" value="5"></label>'+
      '<label>盒子数 n = <output id="bxN">3</output><input type="range" id="bxNs" min="2" max="4" value="3"></label></div>'+
      '<div style="display:grid;grid-template-columns:62px 1fr 1fr;gap:7px" id="bxGrid"></div>'+
      '<div id="bxOut" style="margin-top:14px"></div></div>'+
      '<div class="w-cap">题目里出现「球」「信」「人」「座位」，先判断两件事：<b>物体彼此是否一样</b>、<b>盒子是否有编号</b>。判断完再问一句<b>允许不允许空盒</b>，公式就一定了。</div>';
  },
  mount: function(el){
    var m = 5, n = 3, cur = 'dd';
    function stir(maxm,maxn){
      var S=[]; for(var i=0;i<=maxm;i++){ S.push(new Array(maxn+1).fill(0)); }
      S[0][0]=1;
      for(var i=1;i<=maxm;i++) for(var j=1;j<=maxn;j++) S[i][j]=j*S[i-1][j]+S[i-1][j-1];
      return S;
    }
    function parts(maxm,maxn){
      var P=[]; for(var i=0;i<=maxm;i++) P.push(new Array(maxn+1).fill(0));
      P[0][0]=1;
      for(var i=1;i<=maxm;i++) for(var j=1;j<=maxn;j++){
        if(j>i) P[i][j]=0; else P[i][j]=P[i-1][j-1]+(i-j>=0?P[i-j][j]:0);
      }
      return P;
    }
    function onto(m,n){ var s=0; for(var k=0;k<=n;k++){ s += ((k%2)?-1:1)*cnk(n,k)*Math.pow(n-k,m); } return Math.round(s); }
    function draw(){
      var S = stir(8,5), P = parts(8,5);
      var sumS = 0; for(var k=1;k<=n;k++) sumS += S[m][k];
      var pLE = 0; for(var k=1;k<=n;k++) pLE += P[m][k];
      var vals = {
        dd:{e:Math.pow(n,m), ne:onto(m,n)},
        di:{e:sumS, ne:S[m][n]},
        id:{e:cnk(n+m-1,m), ne:(m>=n?cnk(m-1,n-1):0)},
        ii:{e:pLE, ne:P[m][n]}
      };
      var names = {dd:'物体可区分 · 盒子可区分', di:'物体可区分 · 盒子不可区分',
                   id:'物体不可区分 · 盒子可区分', ii:'物体不可区分 · 盒子不可区分'};
      var short = {dd:['n<sup>m</sup>','满射数'], di:['Σ S(m,k)','S(m,n)'],
                   id:['C(n+m−1,m)','C(m−1,n−1)'], ii:['分拆 ≤ n 部分','分拆恰 n 部分']};
      var g = '<div></div><div class="axis-h">盒子可区分<br><span style="opacity:.7">（有编号）</span></div><div class="axis-h">盒子不可区分<br><span style="opacity:.7">（只看分组）</span></div>';
      g += '<div class="axis-v">物体可区分<br><span style="opacity:.7">（球有编号）</span></div>';
      g += '<div class="cell4'+(cur==='dd'?' on':'')+'" data-k="dd"><span class="f1">'+short.dd[0]+'</span><span class="f2">允许空 → '+fmt(vals.dd.e)+'<br>非空 → '+fmt(vals.dd.ne)+'</span></div>';

      g += '<div class="cell4'+(cur==='ii'?' on':'')+'" data-k="ii"><span class="f1">'+short.ii[0]+'</span><span class="f2">允许空 → '+fmt(vals.ii.e)+'<br>非空 → '+fmt(vals.ii.ne)+'</span></div>';

      var D = {
        dd:{f:'允许空盒：<b>n<sup>m</sup></b>　|　不允许空盒：<b>Σ<sub>k=0</sub><sup>n</sup> (−1)<sup>k</sup> C(n,k)(n−k)<sup>m</sup></b>',
          why:'每个球独立地挑一个盒子，m 个球就有 n<sup>m</sup> 种。要保证不空，就是数<b>满射函数</b>的个数，用容斥：先不管空不空，再扣掉「指定 k 个盒子为空」的情况——符号交替是因为容斥。',
          eg:'m 个不同的球放进 n 个有编号的盒子，每盒至少一个。',

          why:'盒子没编号，所以「哪个盒子」不再重要，只关心<b>把 m 个球切成几堆</b>。S(m,n) 就是「切成 n 个非空堆」的切法数。允许空盒时，实际堆数可以是 1 到 n 之间的任何数，全部加起来。',

        id:{f:'允许空盒：<b>C(n+m−1, m)</b>（隔板法）　|　不允许空盒：<b>C(m−1, n−1)</b>',
          why:'球一样，盒子有编号 → 只关心每个盒子装几个，也就是方程 x₁+x₂+…+x<sub>n</sub> = m 的非负整数解。这正是隔板法。<b>非负</b>对应允许空，<b>正整数</b>对应非空。',
          eg:'6 个相同的球放进 4 个不同盒子，允许空：C(4+6−1,6) = 84。',
          calc:'允许空：C('+(n+m-1)+','+m+') = <b>'+fmt(vals.id.e)+'</b>　｜　非空：C('+(m-1)+','+(n-1)+') = <b>'+fmt(vals.id.ne)+'</b>'},
        ii:{f:'允许空盒：<b>分拆成至多 n 个部分</b>　|　不允许空盒：<b>分拆成恰好 n 个部分</b>（记作 p<sub>n</sub>(m)）',
          why:'球一样、盒子也没编号 → 剩下纯粹是「把 m 写成几个正整数之和」的问题。这个数没有闭式公式，只能枚举或用递推，所以考试里通常只让你列举。',
          eg:'5 分成 3 个正整数之和：5 = 3+1+1 = 2+2+1，共 2 种。',
          calc:'恰好 '+n+' 部分：<b>'+fmt(vals.ii.ne)+'</b>　｜　至多 '+n+' 部分：<b>'+fmt(vals.ii.e)+'</b>'}

        '<div style="margin-top:8px;font-size:12.5px;color:var(--muted)">例：'+c.eg+'</div></div>';

/* ================= 帕斯卡三角 ================= */
W['pascal'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>帕斯卡三角<em>点一个数，看它的两个「父母」</em></div>'+
      '<div class="w-b"><div class="pasc" id="psTri"></div><div id="psOut" style="margin-top:14px"></div></div>'+
      '<div class="w-cap">每个数等于左上和右上两个数之和 —— 这就是 C(n,k) = C(n−1,k−1) + C(n−1,k) 的全部内容。</div>';
  },
  mount: function(el){
    var N = 9, cur = [5,2];
    function draw(){
      var s = '';
      for(var i=0;i<=N;i++){
        s += '<div class="row">';
        for(var j=0;j<=i;j++){
          var on = (i===cur[0]&&j===cur[1]);
          var par = (i===cur[0]-1 && (j===cur[1]-1||j===cur[1]));
          s += '<div class="cl'+(on?' on':'')+(par?' par':'')+'" data-i="'+i+'" data-j="'+j+'">'+cnk(i,j)+'</div>';
        }
        s += '</div>';
      }
      $('#psTri',el).innerHTML = s;
      var i = cur[0], j = cur[1];
      var left = j>0 ? cnk(i-1,j-1) : 0, right = j<=i-1 ? cnk(i-1,j) : 0;
      var msg = '';
      if(i===0){ msg = '<div class="verdict"><b>C(0,0) = 1</b>，三角形的顶点。</div>'; }
      else {
        msg = '<div class="verdict"><b>C('+i+','+j+') = '+cnk(i,j)+'</b>'+
          '<br><span style="font-family:var(--math)">C('+(i-1)+','+(j-1)+') + C('+(i-1)+','+j+') = '+left+' + '+right+' = '+(left+right)+'</span>'+
          '<br><span style="color:var(--muted);font-size:12.5px">组合意义：从 '+i+' 个里选 '+j+' 个，先盯住某一个特定元素——选它就从剩下 '+(i-1)+' 个里再选 '+(j-1)+' 个，不选它就从剩下选 '+j+' 个，两类不重不漏。</span></div>';
      }
      $('#psOut',el).innerHTML = msg;
    }
    el.addEventListener('click', function(e){
      var c = e.target.closest('[data-i]');
      if(c){ cur = [+c.getAttribute('data-i'), +c.getAttribute('data-j')]; draw(); }
    });
    draw();
  }
};

/* ================= 鸽巢原理 ================= */
W['pigeon'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>鸽巢原理<em>随便怎么扔，总有一个洞很挤</em></div>'+
      '<div class="w-b">'+
      '<div class="w-ctl"><label>鸽子 = <output id="pgN">9</output><input type="range" id="pgNs" min="2" max="14" value="9"></label>'+
      '<label>巢 = <output id="pgM">4</output><input type="range" id="pgMs" min="2" max="6" value="4"></label>'+
      '<button class="w-btn" id="pgGo">随机扔一次</button></div>'+
      '<div class="holes" id="pgHoles"></div><div id="pgOut"></div></div>'+
      '<div class="w-cap">注意这是<b>存在性</b>结论：它告诉你「一定有一个洞至少 ⌈n/m⌉ 只」，但不会告诉你哪个洞、也不告诉你是谁。</div>';
  },
  mount: function(el){
    var n = 9, m = 4, dist = null;
    function rnd(){
      var d = new Array(m).fill(0);
      for(var i=0;i<n;i++) d[Math.floor(Math.random()*m)]++;
      return d;
    }
    function draw(){
      if(!dist || dist.length!==m || dist.reduce(function(a,b){return a+b;},0)!==n) dist = rnd();
      var mx = Math.max.apply(null, dist);
      var bound = Math.ceil(n/m);
      var s = '';
      dist.forEach(function(v,i){
        s += '<div class="hole'+(v>=bound?' rich':'')+'"><div class="hl-row">';
        for(var k=0;k<v;k++) s += '<span class="ball"></span>';
        s += '</div><div class="lbl">巢 '+(i+1)+'：'+v+'</div></div>';
      });
      $('#pgHoles',el).innerHTML = s;
      $('#pgOut',el).innerHTML = '<div class="verdict">'+
        '<b>⌈'+n+' / '+m+'⌉ = '+bound+'</b>，所以无论怎么分配，<b>必定</b>有一个巢里至少 '+bound+' 只鸽子。'+
        '<br>这一把最挤的是 <b>'+mx+'</b> 只，'+(mx>=bound?'符合结论。':'咦？这不可能——理论上不该小于 '+bound+'。')+
        '<br><span style="color:var(--muted);font-size:12.5px">为什么？如果每个巢都少于 '+bound+' 只，那每个巢最多 '+(bound-1)+' 只，'+m+' 个巢最多 '+(m*(bound-1))+' 只，但你有 '+n+' 只——矛盾。这就是反证法版本的鸽巢原理。</span></div>';
    }
    $('#pgNs',el).oninput = function(){ n=+this.value; $('#pgN',el).textContent=n; dist=null; draw(); };
    $('#pgMs',el).oninput = function(){ m=+this.value; $('#pgM',el).textContent=m; dist=null; draw(); };
    $('#pgGo',el).onclick = function(){ dist=rnd(); draw(); };
    draw();
  }
};

/* ================= 不可区分物体排列 ================= */
W['permdup'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>有重复元素的排列<em>改个单词试试</em></div>'+
      '<div class="w-b">'+
      '<div class="w-ctl"><input id="pdIn" value="MISSISSIPPI" style="font-family:var(--mono);font-size:14px;padding:6px 10px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);width:200px;letter-spacing:.05em" maxlength="14">'+
      '<span class="chip" data-w="SUCCESS">SUCCESS</span><span class="chip" data-w="MISSISSIPPI">MISSISSIPPI</span><span class="chip" data-w="BANANA">BANANA</span></div>'+
      '<div id="pdBody"></div></div>'+
      '<div class="w-cap">先当作所有字母都不一样，有 n! 种排法；再把每种字母内部的 nᵢ! 种「其实看起来一样」的排法除掉。</div>';
  },
  mount: function(el){
    function draw(){
      var w = ($('#pdIn',el).value||'').toUpperCase().replace(/[^A-Z]/g,'');
      if(!w){ $('#pdBody',el).innerHTML = '<div class="verdict false">请输入字母。</div>'; return; }
      var cnt = {}, order = [];
      for(var i=0;i<w.length;i++){ if(!cnt[w[i]]){cnt[w[i]]=0;order.push(w[i]);} cnt[w[i]]++; }
      var denom = 1, parts = [], letters = '';
      order.forEach(function(ch){ denom *= fact(cnt[ch]); letters += '<span style="color:var(--accent)">'+ch+'</span>'; parts.push(ch+'<span style="color:var(--muted)">×'+cnt[ch]+'</span>'); });
      var total = Math.round(fact(w.length)/denom);
      $('#pdBody',el).innerHTML =
        '<div class="sb" style="letter-spacing:9px">'+letters+'</div>'+
        '<div class="kv" style="margin-top:10px;text-align:center">n = '+w.length+'，各字母出现次数：'+parts.join('　')+'</div>'+
        '<div class="pc-out" style="margin-top:12px"><div><div class="fx">'+
          '<span class="frac"><span>'+w.length+'!</span><span>'+order.map(function(ch){return cnt[ch]+'!';}).join(' × ')+'</span></span>'+
          ' = <span class="frac"><span>'+fmt(fact(w.length))+'</span><span>'+fmt(denom)+'</span></span></div>'+
          '<div class="pc-word">全排列 '+fmt(fact(w.length))+' 种，但同字母互换看不出区别，所以除掉 '+fmt(denom)+'。</div></div>'+
          '<div class="nm">'+fmt(total)+'</div></div>';
    }
    $('#pdIn',el).oninput = draw;
    el.addEventListener('click', function(e){
      var c = e.target.closest('[data-w]');
      if(c){ $('#pdIn',el).value = c.getAttribute('data-w'); draw(); }
    });
    draw();
  }
};

/* ================= 4.1 递推：汉诺塔 ================= */
W['hanoi'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>递推关系是怎么长出来的<em>汉诺塔 H(n)</em></div>'+
      '<div class="w-b">'+
      '<div class="w-ctl"><label>盘子数 n = <output id="hnN">4</output><input type="range" id="hnNs" min="1" max="10" value="4"></label></div>'+
      '<div id="hnBody"></div></div>'+
      '<div class="w-cap">把 n 个盘子从 A 搬到 C：先把上面 n−1 个搬到 B（H(n−1) 步），再搬最大的那个（1 步），再把 n−1 个从 B 搬到 C（H(n−1) 步）。</div>';
  },
  mount: function(el){
    var n = 4;
    function draw(){
      var H = function(k){ return Math.pow(2,k)-1; };
      var rows = '';
      for(var i=1;i<=Math.min(n,6);i++){
        rows += '<div class="stepline"><span class="s">H('+i+') = 2·H('+(i-1)+') + 1 = '+H(i)+'</span>'+
          (i===n?'<span class="s on">← 当前</span>':'')+'</div>';
      }
      var tower = '';
      for(var k=n;k>=1;k--){

        tower += '<div style="width:'+w+'px;height:11px;background:var(--accent);opacity:'+(0.35+0.65*k/n)+';border-radius:3px;margin:2px auto"></div>';
      }
      $('#hnBody',el).innerHTML =
        '<div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap">'+
        '<div style="min-width:150px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:center">'+
          '<div style="font-size:11px;color:var(--muted);margin-bottom:6px">塔 A</div>'+tower+
          '<div style="height:3px;background:var(--line2);border-radius:2px;margin-top:4px"></div></div>'+
        '<div style="flex:1;min-width:240px">'+
          '<div class="f" style="margin:0;font-size:17px">H(n) = 2H(n−1) + 1，H(1) = 1 ⟹ H(n) = 2<sup>n</sup> − 1</div>'+
          '<div class="verdict" style="margin-top:10px">n = '+n+' 时需要 <b>'+fmt(Math.pow(2,n)-1)+'</b> 步。'+
          '<br><span style="color:var(--muted);font-size:12.5px">指数增长：n=64 时约 1.8×10¹⁹ 步，一秒一步也要 5849 亿年。</span></div>'+
        '</div></div>'+
        '<div style="margin-top:14px">'+rows+'</div>';

};

/* ================= 4.2 线性递推求解 ================= */
W['linrec'] = {
  html: function(){
    return '<div class="w-h"><span class="sq"></span>常系数线性递推：特征根法<em>拖 p、q 看根怎么变</em></div>'+
      '<div class="w-b">'+
      '<div class="w-ctl"><label>p = <output id="lrP">1</output><input type="range" id="lrPs" min="-3" max="4" value="1"></label>'+
      '<label>q = <output id="lrQ">1</output><input type="range" id="lrQs" min="-3" max="4" value="1"></label>'+
      '<span class="chip" data-pr="1,1">斐波那契</span><span class="chip" data-pr="3,-2">aₙ=3aₙ₋₁−2aₙ₋₂</span><span class="chip" data-pr="2,1">重根</span></div>'+
      '<div id="lrBody"></div></div>'+
      '<div class="w-cap">aₙ = p·aₙ₋₁ + q·aₙ₋₂ 对应特征方程 r² − pr − q = 0。求出根，通解的形状就定了。</div>';
  },
  mount: function(el){
    var p = 1, q = 1;
    function draw(){
      var a = [0,1];
      for(var i=2;i<=10;i++) a.push(p*a[i-1]+q*a[i-2]);
      var D = p*p + 4*q;
      var out = '';
      if(D > 0){
        var r1 = (p+Math.sqrt(D))/2, r2 = (p-Math.sqrt(D))/2;
        var f1 = r1.toFixed(3), f2 = r2.toFixed(3);
        out = '<div class="f" style="margin:0;font-size:16px">r² − '+p+'r − '+q+' = 0　⟹　r₁ = '+f1+'，r₂ = '+f2+'</div>'+
          '<div class="verdict">两根不相等 → 通解 <b>aₙ = α·'+f1+'<sup>n</sup> + β·'+f2+'<sup>n</sup></b>'+
          '<br><span style="color:var(--muted);font-size:12.5px">再用 a₀ = 0、a₁ = 1 解出 α、β 即可。两个根谁主导，就看谁绝对值大。</span></div>';
        if(Math.abs(r1-1)<1e-9 && Math.abs(r2-1)<1e-9) out = '<div class="f">r = 1 是二重根</div>';
      } else if(D === 0){
        var r = p/2;
        out = '<div class="f" style="margin:0;font-size:16px">r² − '+p+'r − '+q+' = 0　⟹　r = '+r.toFixed(3)+'（二重根）</div>'+
          '<div class="verdict">重根情形 → 通解 <b>aₙ = (α + βn)·'+r.toFixed(3)+'<sup>n</sup></b>'+
          '<br><span style="color:var(--muted);font-size:12.5px">重根时要在前面乘一个 n，否则两个解线性相关、凑不出所有初值。</span></div>';
      } else {
        out = '<div class="f" style="margin:0;font-size:16px">判别式 Δ = '+D+' &lt; 0，根是共轭复数</div>'+
          '<div class="verdict false">这一版教材里通常不深入复数根，遇到时按「无实根」记结论即可。</div>';
      }
      var seq = a.slice(0,10).map(function(x,i){
        return '<span class="s">a<sub>'+i+'</sub>='+x+'</span>';
      }).join('');
      $('#lrBody',el).innerHTML = out+
        '<div class="stepline" style="margin-top:12px">'+seq+'</div>'+
        '<div class="kv" style="color:var(--muted);margin-top:8px">当前递推：aₙ = '+p+'·aₙ₋₁ '+(q>=0?'+ '+q:'− '+(-q))+'·aₙ₋₂，初值 a₀=0, a₁=1</div>';
    }
    $('#lrPs',el).oninput = function(){ p=+this.value; $('#lrP',el).textContent=p; draw(); };
    $('#lrQs',el).oninput = function(){ q=+this.value; $('#lrQ',el).textContent=q; draw(); };
    el.addEventListener('click', function(e){
      var c = e.target.closest('[data-pr]');
